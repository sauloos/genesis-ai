plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.genesisbrands'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:1.1.7"
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring AI — Anthropic (Claude)
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'

    // Spring AI — OpenAI (embeddings, and Azure AI Foundry OpenAI-compatible endpoint)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // Spring AI — Azure OpenAI (embeddings via Azure OpenAI when azure profile is active)
    implementation 'org.springframework.ai:spring-ai-starter-model-azure-openai'


    // API docs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Database — H2 for local dev, PostgreSQL in production (Azure Database for PostgreSQL)
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Azure Blob Storage
    implementation 'com.azure:azure-storage-blob:12.28.1'

    // PDF text extraction (attachments). Pinned to 2.0.24, not the newer 3.x line —
    // openhtmltopdf-pdfbox 1.0.10 is compiled against PDFBox 2.0.24's PDType1Font API
    // (removed in 3.x) and both share the org.apache.pdfbox:pdfbox coordinate, so a
    // single classpath can only carry one version. Loader/PDDocument/PDFTextStripper,
    // the only PDFBox APIs this project reads from, are present unchanged in 2.0.24.
    implementation 'org.apache.pdfbox:pdfbox:2.0.24'

    // PDF generation (Brand Book Assembly deliverable) — HTML+CSS to PDF
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-svg-support:1.0.10'

    // HTML parsing (URL fetching)
    implementation 'org.jsoup:jsoup:1.18.3'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
