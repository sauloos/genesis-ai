<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis — Standing agents</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-bg-image: url('/bg-earth.jpg');
    --theme-bg-transform: rotate(180deg);
    --theme-bg-overlay: rgba(0, 0, 10, 0.52);
    --theme-body-bg: #000010;
    --theme-text-primary: #f2f2f2;
    --theme-text-muted: rgba(255, 255, 255, 0.52);
    --theme-text-label: rgba(255, 255, 255, 0.38);
    --theme-card-bg: rgba(255, 255, 255, 0.07);
    --theme-card-bg-hover: rgba(255, 255, 255, 0.12);
    --theme-card-border: rgba(255, 255, 255, 0.10);
    --theme-backdrop: blur(12px);
    --theme-btn-color: rgba(255, 255, 255, 0.4);
    --theme-btn-border: rgba(255, 255, 255, 0.12);
    --theme-btn-color-hover: rgba(255, 255, 255, 0.75);
    --theme-btn-border-hover: rgba(255, 255, 255, 0.3);
    --theme-env-badge-bg: rgba(0, 0, 0, 0.4);
    --theme-env-badge-border: rgba(255, 255, 255, 0.08);
    --standing-accent: #6fe0a5;
    --standing-warn: #f5b84a;
    --standing-bad: #f26d6d;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    color: var(--theme-text-primary);
    background: var(--theme-body-bg);
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--theme-bg-image) var(--theme-bg-position, center center) / var(--theme-bg-size, cover) no-repeat;
    transform: var(--theme-bg-transform, none);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--theme-bg-overlay);
    z-index: -1;
  }

  header { display: flex; align-items: center; justify-content: space-between; padding: 24px 40px 0; }
  .back-btn {
    font-size: 12px; color: var(--theme-btn-color); background: none;
    border: 1px solid var(--theme-btn-border); border-radius: 6px; padding: 5px 12px;
    cursor: pointer; text-decoration: none; transition: color 0.15s, border-color 0.15s;
  }
  .back-btn:hover { color: var(--theme-btn-color-hover); border-color: var(--theme-btn-border-hover); }

  .hero { text-align: center; padding: 36px 24px 28px; }
  .hero-logo {
    height: 52px; width: auto; aspect-ratio: 805 / 220; display: block; margin: 0 auto 20px;
    background-color: var(--theme-text-primary, currentColor);
    -webkit-mask-image: url(/api/themes/active/logo); mask-image: url(/api/themes/active/logo);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }
  .hero-label { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--theme-text-label); margin-bottom: 10px; }
  .hero h1 { font-size: clamp(20px, 3vw, 28px); font-weight: 600; letter-spacing: -0.3px; }
  .hero-sub { font-size: 14px; color: var(--theme-text-muted); margin-top: 8px; }

  .main { max-width: 1000px; margin: 0 auto; padding: 0 24px 80px; display: flex; flex-direction: column; gap: 16px; }

  .panel {
    background: var(--theme-card-bg); border: 1px solid var(--theme-card-border); border-radius: 16px;
    backdrop-filter: var(--theme-backdrop); -webkit-backdrop-filter: var(--theme-backdrop);
    padding: 20px 22px;
  }
  .panel-title { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--theme-text-label); margin-bottom: 14px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--theme-text-muted); margin: 12px 0 0; }

  .offer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .offer-name { font-size: 16px; font-weight: 600; }
  .offer-desc { font-size: 13px; color: var(--theme-text-muted); margin-top: 4px; max-width: 60ch; }
  .offer-meta { font-size: 12px; color: var(--theme-text-label); margin-top: 6px; }
  .warn { color: var(--standing-warn); }

  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .switch input { accent-color: var(--standing-accent); width: 16px; height: 16px; }

  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 18px; margin-top: 18px; }
  .field label.cap { display: block; font-size: 11px; color: var(--theme-text-label); margin-bottom: 6px; letter-spacing: 0.02em; }
  .field input[type=number], .field input[type=text], .field select, .field textarea {
    width: 100%; font: inherit; font-size: 13px; color: var(--theme-text-primary);
    background: var(--theme-env-badge-bg); border: 1px solid var(--theme-card-border); border-radius: 8px; padding: 7px 9px;
  }
  .field textarea { min-height: 60px; resize: vertical; }
  .field select[multiple] { min-height: 90px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
  .checks label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .checks input { accent-color: var(--standing-accent); }
  .lock { font-size: 11px; color: var(--theme-text-label); display: inline-flex; gap: 5px; align-items: center; margin-top: 5px; cursor: pointer; }
  .help { font-size: 11px; color: var(--theme-text-label); margin-top: 4px; }

  .actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .btn {
    font-size: 12px; color: var(--theme-text-primary); background: var(--theme-card-bg-hover);
    border: 1px solid var(--theme-btn-border-hover); border-radius: 6px; padding: 6px 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--standing-accent); }
  .btn.small { padding: 3px 10px; font-size: 11px; background: none; color: var(--theme-btn-color); border-color: var(--theme-btn-border); }
  .btn:focus-visible, .switch input:focus-visible { outline: 2px solid var(--standing-accent); outline-offset: 2px; }
  .saved { font-size: 12px; color: var(--theme-text-muted); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-weight: 600; color: var(--theme-text-label); padding: 0 8px 8px 0; white-space: nowrap; }
  td { padding: 7px 8px 7px 0; border-top: 1px solid var(--theme-card-border); color: var(--theme-text-muted); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.date { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.name { color: var(--theme-text-primary); word-break: break-word; }
  td.nowrap { white-space: nowrap; }
  .pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; padding: 2px 7px; border-radius: 10px; border: 1px solid currentColor; }
  .pill.SUCCEEDED, .pill.active { color: var(--standing-accent); }
  .pill.RUNNING { color: var(--theme-text-primary); }
  .pill.SKIPPED, .pill.paused { color: var(--standing-warn); }
  .pill.FAILED { color: var(--standing-bad); }
  .pill.PUBLISHED { color: var(--standing-accent); }
  .pill.QUEUED { color: var(--standing-warn); }
  .pill.CANCELLED { color: var(--theme-text-muted); }

  .empty { text-align: center; padding: 24px; color: var(--theme-text-muted); font-size: 13px; }

  #env-badge {
    position: fixed; bottom: 20px; left: 24px; display: flex; align-items: center; gap: 7px;
    background: var(--theme-env-badge-bg); border: 1px solid var(--theme-env-badge-border);
    border-radius: 20px; padding: 5px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }

  @media (max-width: 480px) {
    header { padding: 20px 16px 0; }
    .hero { padding: 28px 16px 20px; }
    .main { padding: 0 16px 60px; }
  }
</style>
<link rel="stylesheet" href="/api/themes/active/styles.css">
</head>
<body>

<header>
  <a href="/dashboard" class="back-btn">← Dashboard</a>
</header>

<div class="hero">
  <div class="hero-logo" role="img" aria-label="Genesis"></div>
  <div class="hero-label">Brain Engine</div>
  <h1>Standing agents</h1>
  <p class="hero-sub">Agents clients subscribe to. They run on the client's schedule and deliver to the client's inbox for approval.</p>
</div>

<div class="main">
  <div class="section-title">Offers</div>
  <p class="help" id="mail-status" style="margin:0 0 12px"></p>
  <div id="offers"><div class="panel empty">Loading offers…</div></div>

  <div class="section-title">Subscriptions</div>
  <section class="panel"><div class="table-wrap" id="subs"></div></section>

  <div class="section-title">Runs, last 30 days</div>
  <section class="panel"><div class="table-wrap" id="runs"></div></section>

  <div id="channels-block" hidden>
    <div class="section-title">Social publishing</div>
    <p class="help" id="channels-status" style="margin:0 0 12px"></p>
    <section class="panel"><div class="table-wrap" id="channels-posts"></div></section>
  </div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CADENCE = { DAILY: 'Daily', WEEKLY: 'Weekly', FORTNIGHTLY: 'Every two weeks', MONTHLY: 'Monthly' };
const when = t => t ? new Date(t).toLocaleString() : '—';

function dollars(micros) {
  const d = micros / 1e6;
  if (d === 0) return '$0';
  if (d < 0.01) return '<$0.01';
  return '$' + d.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function api(path, init = {}) {
  const r = await fetch(path, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...init });
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { msg = (await r.json()).message || msg; } catch {}
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}

function optionInput(o, offer, id) {
  const value = offer.defaultOptions[o.key] ?? o.defaultValue ?? '';
  const name = `${id}-opt-${o.key}`;
  switch (o.type) {
    case 'BOOLEAN':
      return `<label class="switch"><input type="checkbox" id="${name}" data-key="${esc(o.key)}" ${value === 'true' ? 'checked' : ''}> ${esc(o.label)}</label>`;
    case 'SELECT':
      return `<select id="${name}" data-key="${esc(o.key)}">${o.allowedValues.map(v => `<option ${v === value ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`;
    case 'MULTI_SELECT': {
      const chosen = new Set(String(value).split(',').filter(Boolean));
      return `<div class="checks" id="${name}" data-key="${esc(o.key)}" data-multi="1">${o.allowedValues.map(v =>
        `<label><input type="checkbox" value="${esc(v)}" ${chosen.has(v) ? 'checked' : ''}> ${esc(v)}</label>`).join('')}</div>`;
    }
    case 'NUMBER':
      return `<input type="number" id="${name}" data-key="${esc(o.key)}" value="${esc(value)}" ${o.allowedValues?.length === 2 ? `min="${o.allowedValues[0]}" max="${o.allowedValues[1]}"` : ''}>`;
    case 'TEXT':
      return `<textarea id="${name}" data-key="${esc(o.key)}">${esc(value)}</textarea>`;
    default:
      return `<input type="text" id="${name}" data-key="${esc(o.key)}" value="${esc(value)}">`;
  }
}

let products = [];

function renderOffer(offer) {
  const id = 'offer-' + offer.agentId.replace(/[^a-z0-9-]/gi, '');
  const locked = new Set(offer.lockedOptions);
  const required = new Set(offer.requiredProducts || []);
  // A required product that was deleted since still shows, so saving does not drop it silently.
  const productChoices = [...products, ...[...required].filter(pid => !products.some(p => p.id === pid))
    .map(pid => ({ id: pid, name: `Unknown product ${pid.slice(0, 8)}`, active: false }))];
  const allowed = new Set(offer.allowedCadences);
  const el = document.createElement('section');
  el.className = 'panel';
  el.innerHTML = `
    <div class="offer-head">
      <div>
        <div class="offer-name">${esc(offer.displayName)}</div>
        ${offer.description ? `<div class="offer-desc">${esc(offer.description)}</div>` : ''}
        <div class="offer-meta">${offer.subscribers} subscriber${offer.subscribers === 1 ? '' : 's'}
          ${offer.availableForLiveView ? '' : ' · <span class="warn">Not enabled for the live dashboard in Agents, so clients cannot see it yet.</span>'}</div>
      </div>
      <label class="switch"><input type="checkbox" id="${id}-enabled" ${offer.enabled ? 'checked' : ''}> Offered to clients</label>
    </div>
    <div class="fields">
      <div class="field">
        <label class="cap">Frequencies clients may choose</label>
        <div class="checks" id="${id}-cadences">${offer.agentCadences.map(c =>
          `<label><input type="checkbox" value="${c}" ${allowed.has(c) ? 'checked' : ''}> ${CADENCE[c] || c}</label>`).join('')}</div>
      </div>
      <div class="field">
        <label class="cap" for="${id}-maxruns">Runs per client per month</label>
        <input type="number" min="0" id="${id}-maxruns" placeholder="No limit" value="${offer.maxRunsPerMonth ?? ''}">
      </div>
      <div class="field">
        <label class="cap" for="${id}-budget">Client's monthly model spend cap (USD)</label>
        <input type="number" min="0" step="0.01" id="${id}-budget" placeholder="No cap" value="${offer.monthlyBudgetMicros == null ? '' : (offer.monthlyBudgetMicros / 1e6)}">
        <div class="help">Counts all of the client's usage this month, not only this agent.</div>
      </div>
      <div class="field">
        <label class="cap">Only for clients who bought</label>
        ${productChoices.length ? `<div class="checks" id="${id}-products">${productChoices.map(p =>
          `<label><input type="checkbox" value="${esc(p.id)}" ${required.has(p.id) ? 'checked' : ''}> ${esc(p.name)}${p.active ? '' : ' (inactive)'}</label>`).join('')}</div>`
          : '<div class="help">No products in the catalog yet.</div>'}
        <div class="help">None ticked: every client can subscribe. Otherwise a client needs a paid order containing one of them.</div>
      </div>
    </div>
    ${offer.options.length ? `<div class="panel-title" style="margin-top:20px">Default options</div>
    <div class="fields">${offer.options.map(o => `
      <div class="field" data-option="${esc(o.key)}">
        ${o.type === 'BOOLEAN' ? '' : `<label class="cap" for="${id}-opt-${esc(o.key)}">${esc(o.label)}</label>`}
        ${optionInput(o, offer, id)}
        ${o.helpText ? `<div class="help">${esc(o.helpText)}</div>` : ''}
        <label class="lock"><input type="checkbox" data-lock="${esc(o.key)}" ${locked.has(o.key) ? 'checked' : ''}> Locked (clients cannot change it)</label>
      </div>`).join('')}</div>` : ''}
    <div class="actions"><button type="button" class="btn" id="${id}-save">Save</button><span class="saved" id="${id}-status"></span></div>`;

  el.querySelector(`#${id}-save`).addEventListener('click', async () => {
    const status = el.querySelector(`#${id}-status`);
    const defaults = {};
    el.querySelectorAll('[data-key]').forEach(input => {
      const key = input.dataset.key;
      if (input.dataset.multi) defaults[key] = [...input.querySelectorAll('input:checked')].map(i => i.value).join(',');
      else if (input.type === 'checkbox') defaults[key] = String(input.checked);
      else defaults[key] = input.value;
    });
    const budget = el.querySelector(`#${id}-budget`).value;
    const maxRuns = el.querySelector(`#${id}-maxruns`).value;
    const body = {
      enabled: el.querySelector(`#${id}-enabled`).checked,
      defaultOptions: defaults,
      lockedOptions: [...el.querySelectorAll('[data-lock]:checked')].map(i => i.dataset.lock),
      allowedCadences: [...el.querySelectorAll(`#${id}-cadences input:checked`)].map(i => i.value),
      maxRunsPerMonth: maxRuns === '' ? null : Number(maxRuns),
      monthlyBudgetMicros: budget === '' ? null : Math.round(Number(budget) * 1e6),
      requiredProducts: [...el.querySelectorAll(`#${id}-products input:checked`)].map(i => i.value)
    };
    status.textContent = 'Saving…';
    try {
      await api(`/api/admin/standing/offers/${encodeURIComponent(offer.agentId)}`, { method: 'PUT', body: JSON.stringify(body) });
      status.textContent = 'Saved';
      loadTables();
    } catch (e) {
      status.textContent = 'Not saved: ' + e.message;
    }
  });
  return el;
}

async function loadOffers() {
  const host = document.getElementById('offers');
  try {
    const [offers, catalog, notify] = await Promise.all([api('/api/admin/standing/offers'),
      api('/api/admin/standing/products').catch(() => []), api('/api/admin/standing/notifications').catch(() => null)]);
    products = catalog;
    const mail = document.getElementById('mail-status');
    if (notify) mail.innerHTML = notify.emailEnabled
      ? 'Email notifications are on: clients who opt in get an email when results reach their inbox.'
      : 'Email notifications are off. Set <code>spring.mail.host</code> and <code>genesis.standing.notify.from</code> to turn them on; clients still see results in their inbox.';
    host.innerHTML = offers.length ? '' : '<div class="panel empty">No standing agents are installed in this app.</div>';
    host.style.display = 'flex'; host.style.flexDirection = 'column'; host.style.gap = '16px';
    offers.forEach(o => host.appendChild(renderOffer(o)));
  } catch (e) {
    host.innerHTML = `<div class="panel empty">Could not load offers: ${esc(e.message)}</div>`;
  }
}

async function loadTables() {
  try {
    const [subs, runs] = await Promise.all([api('/api/admin/standing/subscriptions'), api('/api/admin/standing/runs?days=30&limit=200')]);
    const subsEl = document.getElementById('subs');
    subsEl.innerHTML = !subs.length ? '<div class="empty">No client has subscribed yet.</div>' : `<table>
      <thead><tr><th>Client</th><th>Agent</th><th>State</th><th>Frequency</th><th>Next run</th><th>Last run</th><th></th></tr></thead>
      <tbody>${subs.map(s => `<tr>
        <td class="name">${esc(s.clientLabel)}</td>
        <td class="nowrap">${esc(s.agentId)}</td>
        <td><span class="pill ${s.active ? 'active' : 'paused'}">${s.active ? 'Active' : (s.pausedReason === 'ADMIN' ? 'Paused by admin' : 'Paused by client')}</span></td>
        <td class="nowrap">${esc(CADENCE[s.cadence] || s.cadence)}</td>
        <td class="date">${when(s.nextRunAt)}</td>
        <td class="date">${when(s.lastRunAt)}</td>
        <td class="nowrap">${s.active
          ? `<button type="button" class="btn small" data-sub="${esc(s.id)}" data-act="pause">Pause</button>`
          : s.pausedReason === 'ADMIN' ? `<button type="button" class="btn small" data-sub="${esc(s.id)}" data-act="resume">Resume</button>` : ''}</td>
      </tr>`).join('')}</tbody></table>`;
    subsEl.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', async () => {
      b.disabled = true;
      try { await api(`/api/admin/standing/subscriptions/${b.dataset.sub}/${b.dataset.act}`, { method: 'POST' }); } catch (e) { alert(e.message); }
      loadTables();
    }));
    document.getElementById('runs').innerHTML = !runs.length ? '<div class="empty">No runs in the last 30 days.</div>' : `<table>
      <thead><tr><th>Started</th><th>Client</th><th>Agent</th><th>Trigger</th><th>Status</th><th class="num">Items</th><th class="num">Cost</th><th>Note</th></tr></thead>
      <tbody>${runs.map(({ run: r, clientLabel }) => `<tr>
        <td class="date">${when(r.startedAt)}</td>
        <td class="name">${esc(clientLabel)}</td>
        <td class="nowrap">${esc(r.agentName)}</td>
        <td class="nowrap">${r.trigger === 'MANUAL' ? 'Run now' : 'Schedule'}</td>
        <td><span class="pill ${r.status}">${esc(r.status.toLowerCase())}</span></td>
        <td class="num">${r.itemsCreated}</td>
        <td class="num">${dollars(r.costMicros)}</td>
        <td>${esc(r.error || r.note || '')}</td>
      </tr>`).join('')}</tbody></table>`;
  } catch (e) {
    document.getElementById('subs').innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`;
  }
}

// Shown only when the app adopts os/publishing (otherwise the endpoint is a 404).
async function loadChannels() {
  let st;
  try { st = await api('/api/admin/channels?limit=50'); } catch { return; }
  document.getElementById('channels-block').hidden = false;
  const configured = st.providers.filter(p => p.configured).map(p => esc(p.displayName));
  const missing = [];
  if (!st.tokenKeySet) missing.push('<code>genesis.publishing.token-key</code>');
  if (!st.publicBaseUrl) missing.push('<code>genesis.publishing.public-base-url</code>');
  document.getElementById('channels-status').innerHTML = (st.ready
      ? `Publishing is on. Clients can connect: ${configured.length ? configured.join(', ') : 'no platform yet (set its app id and secret)'}.`
      : `Publishing is off. Set ${missing.join(' and ')} to turn it on.`)
    + ` ${st.accountsConnected} account(s) connected, ${st.accountsExpired} need reconnecting; ${st.queued} post(s) waiting, ${st.failed} failed.`;
  const posts = st.recent;
  document.getElementById('channels-posts').innerHTML = !posts.length ? '<div class="empty">Nothing published yet.</div>' : `<table>
    <thead><tr><th>Scheduled</th><th>Account</th><th>Network</th><th>Status</th><th class="num">Tries</th><th>Note</th></tr></thead>
    <tbody>${posts.map(({ job: j }) => `<tr>
      <td class="date">${when(j.scheduledAt)}</td>
      <td class="name">${esc(j.accountName)}</td>
      <td class="nowrap">${esc(j.networkLabel || j.network)}</td>
      <td><span class="pill ${esc(j.status)}">${esc(j.status.toLowerCase())}</span></td>
      <td class="num">${j.attempts}</td>
      <td>${j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">View post</a>` : esc(j.error || '')}</td>
    </tr>`).join('')}</tbody></table>`;
}

loadOffers();
loadTables();
loadChannels();

(async () => {
  try {
    const r = await fetch("/api/admin/env", { credentials: "include" });
    if (!r.ok) return;
    const { env } = await r.json();
    const col = { PRODUCTION: "#ef4444", QA: "#f59e0b", DEV: "#6b7280" }[env] || "#888";
    const el = document.createElement("div");
    el.id = "env-badge";
    el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block"></span>`
      + `<span style="font-size:10px;font-weight:700;letter-spacing:0.5px;color:${col};text-transform:uppercase">${env}</span>`;
    document.body.appendChild(el);
  } catch {}
})();
</script>
</body>
</html>
