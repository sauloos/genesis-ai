// Widget module — its WidgetDescriptor bean, the per-widget selection endpoint and its client
// module at static/widgets/productOptions/. The selection lands in the runtime's shared flow
// session cart (CartService), so it compiles against the runtime the adopting app provides.
configurations {
    compileOnly { extendsFrom annotationProcessor }
}

dependencies {
    implementation project(':os:widget-sdk')
    compileOnly project(':os:runtime')
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}
