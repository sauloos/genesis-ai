// GenesisOS document previews — view-only, watermarked, rate-limited page images of a document
// a client may look inside but has not unlocked. The tenant supplies the documents through the
// DocumentPreviewProvider port (os/runtime); an app adopts this by declaring the dependency.
configurations {
    compileOnly { extendsFrom annotationProcessor }
}

dependencies {
    compileOnly project(':os:agent-sdk')
    compileOnly project(':os:runtime')
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation project(':os:runtime')
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
