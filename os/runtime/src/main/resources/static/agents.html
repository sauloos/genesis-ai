<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis — Agents</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-bg-image: url('/bg-earth.jpg');
    --theme-bg-transform: rotate(180deg);
    --theme-bg-overlay: rgba(0, 0, 10, 0.52);
    --theme-body-bg: #000010;
    --theme-text-primary: #f2f2f2;
    --theme-text-muted: rgba(255, 255, 255, 0.52);
    --theme-text-label: rgba(255, 255, 255, 0.38);
    --theme-card-bg: rgba(255, 255, 255, 0.07);
    --theme-card-border: rgba(255, 255, 255, 0.10);
    --theme-backdrop: blur(12px);
    --theme-btn-color: rgba(255, 255, 255, 0.4);
    --theme-btn-border: rgba(255, 255, 255, 0.12);
    --theme-btn-color-hover: rgba(255, 255, 255, 0.75);
    --theme-btn-border-hover: rgba(255, 255, 255, 0.3);
    --theme-env-badge-bg: rgba(0, 0, 0, 0.4);
    --theme-env-badge-border: rgba(255, 255, 255, 0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    color: var(--theme-text-primary);
    background: var(--theme-body-bg);
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--theme-bg-image) var(--theme-bg-position, center center) / var(--theme-bg-size, cover) no-repeat;
    transform: var(--theme-bg-transform, none);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--theme-bg-overlay);
    z-index: -1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 40px 0;
  }
  .back-btn {
    font-size: 12px;
    color: var(--theme-btn-color);
    background: none;
    border: 1px solid var(--theme-btn-border);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-btn:hover { color: var(--theme-btn-color-hover); border-color: var(--theme-btn-border-hover); }

  .hero {
    text-align: center;
    padding: 36px 24px 32px;
  }
  .hero-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--theme-text-label);
    margin-bottom: 10px;
  }
  .hero h1 {
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--theme-text-primary);
  }
  .hero-sub {
    font-size: 14px;
    color: var(--theme-text-muted);
    margin-top: 8px;
  }

  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .agent-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .agent-card {
    background: var(--theme-card-bg);
    border: 1px solid var(--theme-card-border);
    border-radius: 16px;
    backdrop-filter: var(--theme-backdrop);
    -webkit-backdrop-filter: var(--theme-backdrop);
    padding: 20px 22px;
  }

  .agent-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .agent-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--theme-text-primary);
  }
  .agent-id {
    font-size: 11px;
    color: var(--theme-text-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .agent-desc {
    font-size: 13px;
    color: var(--theme-text-muted);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--theme-card-bg-hover);
    color: var(--theme-text-muted);
    border: 1px solid var(--theme-card-border);
  }
  .badge-on {
    background: rgba(111,224,165,0.15);
    color: #6fe0a5;
    border-color: rgba(111,224,165,0.25);
  }

  .custom-options {
    font-size: 11px;
    color: var(--theme-text-muted);
    margin-bottom: 14px;
  }
  .custom-options span {
    display: inline-block;
    margin-right: 8px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--theme-card-bg-hover);
    border: 1px solid var(--theme-card-border);
  }

  .toggle-row {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--theme-card-border);
  }
  .toggle-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--theme-text-muted);
    cursor: pointer;
  }
  .toggle-item input { accent-color: #6fe0a5; width: 15px; height: 15px; cursor: pointer; }

  .settings-toggle {
    margin-left: auto;
    font-size: 12px;
    color: var(--theme-btn-color);
    background: none;
    border: 1px solid var(--theme-btn-border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .settings-toggle:hover { color: var(--theme-btn-color-hover); border-color: var(--theme-btn-border-hover); }
  .settings-toggle:focus-visible, .settings-group button:focus-visible { outline: 2px solid #6fe0a5; outline-offset: 2px; }

  .settings { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--theme-card-border); }
  .settings.open { display: flex; flex-direction: column; gap: 18px; }
  .settings-note { font-size: 12px; color: var(--theme-text-muted); line-height: 1.5; }
  .settings-group { display: flex; flex-direction: column; gap: 10px; }
  .settings-group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .settings-key { font-size: 13px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .settings-file { font-size: 11px; color: var(--theme-text-label); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .settings-field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--theme-text-muted); }
  .settings-field input, .settings-field select, .settings-field textarea {
    font: inherit; font-size: 13px; color: var(--theme-text-primary);
    background: rgba(0,0,0,0.25); border: 1px solid var(--theme-card-border); border-radius: 6px; padding: 6px 8px;
  }
  .settings-field textarea {
    min-height: 220px; resize: vertical; line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  }
  .settings-field input::placeholder { color: var(--theme-text-label); }
  .settings-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .settings-actions button {
    font-size: 12px; border-radius: 6px; padding: 6px 14px; cursor: pointer;
    background: none; color: var(--theme-btn-color-hover); border: 1px solid var(--theme-btn-border-hover);
  }
  .settings-actions button.primary { background: rgba(111,224,165,0.15); color: #6fe0a5; border-color: rgba(111,224,165,0.35); }
  .settings-actions .hint { font-size: 11px; color: var(--theme-text-label); }

  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--theme-text-muted);
    font-size: 14px;
  }

  #toast {
    position: fixed;
    bottom: 32px;
    right: 24px;
    background: rgba(30,30,40,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13px;
    color: #f2f2f2;
    backdrop-filter: blur(12px);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 480px) {
    header { padding: 20px 16px 0; }
    .hero { padding: 28px 16px 24px; }
    .main { padding: 0 12px 60px; }
  }

  .hero-logo {
    height: 52px;
    width: auto;
    aspect-ratio: 805 / 220;
    display: block;
    margin: 0 auto 20px;
    background-color: var(--theme-text-primary, currentColor);
    -webkit-mask-image: url(/api/themes/active/logo);
    mask-image: url(/api/themes/active/logo);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
  }

  #env-badge {
    position: fixed;
    bottom: 20px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--theme-env-badge-bg);
    border: 1px solid var(--theme-env-badge-border);
    border-radius: 20px;
    padding: 5px 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
</style>
<link rel="stylesheet" href="/api/themes/active/styles.css">
</head>
<body>

<header>
  <a href="/dashboard" class="back-btn">← Dashboard</a>
</header>

<div class="hero">
  <div class="hero-logo" role="img" aria-label="Genesis"></div>
  <div class="hero-label">Brain Engine</div>
  <h1>Agents</h1>
  <p class="hero-sub">Registered agents, where they're available, and their model and prompt settings.</p>
</div>

<div class="main">
  <div class="agent-list" id="agentList">
    <div class="empty">Loading agents…</div>
  </div>
</div>

<div id="toast"></div>

<script>
let API_KEY = '';

async function apiFetch(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'X-Api-Key': API_KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok ? 'rgba(111,224,165,0.35)' : 'rgba(239,68,68,0.35)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function renderAgents(agents) {
  const list = document.getElementById('agentList');
  if (!agents.length) {
    list.innerHTML = '<div class="empty">No agents registered on this platform instance.</div>';
    return;
  }
  list.innerHTML = agents.map(a => `
    <div class="agent-card" data-id="${a.agentId}">
      <div class="agent-head">
        <span class="agent-name">${a.displayName}</span>
        <span class="agent-id">${a.agentId}</span>
        <span class="badge ${a.requiresQuestionnaire ? 'badge-on' : ''}">${a.requiresQuestionnaire ? 'Requires questionnaire' : 'No questionnaire'}</span>
        <button type="button" class="settings-toggle" aria-expanded="false">Settings</button>
      </div>
      <div class="agent-desc">${a.description || ''}</div>
      ${a.customOptions && a.customOptions.length ? `
        <div class="custom-options">
          Custom options: ${a.customOptions.map(o => `<span>${o.label} (${o.type})</span>`).join('')}
        </div>
      ` : ''}
      <div class="toggle-row">
        <label class="toggle-item">
          <input type="checkbox" data-field="availableForLiveView" ${a.availableForLiveView ? 'checked' : ''}>
          Available in live dashboard
        </label>
        <label class="toggle-item">
          <input type="checkbox" data-field="availableForPlayground" ${a.availableForPlayground ? 'checked' : ''}>
          Available in Playground
        </label>
        ${a.supportsABCompare ? `
          <label class="toggle-item">
            <input type="checkbox" data-field="abCompareEnabled" ${a.abCompareEnabled ? 'checked' : ''}>
            A/B compare enabled
          </label>
        ` : ''}
        <label class="toggle-item" title="Expose this agent to customers' own apps and models through the Agent connectors (MCP + REST). Only applies while it is also available in the live dashboard.">
          <input type="checkbox" data-field="availableForConnectors" ${a.availableForConnectors ? 'checked' : ''}>
          Available to connectors (MCP + REST)
        </label>
        ${a.supportsToolUse ? `
          <label class="toggle-item">
            <input type="checkbox" data-field="toolsEnabled" ${a.toolsEnabled ? 'checked' : ''}>
            Tools enabled
          </label>
        ` : ''}
      </div>
      <div class="settings"></div>
    </div>
  `).join('');

  list.querySelectorAll('.agent-card').forEach(card => {
    const agentId = card.dataset.id;
    card.querySelectorAll('input[type=checkbox]').forEach(input => {
      input.addEventListener('change', async () => {
        try {
          await apiFetch(`/api/admin/agents/${agentId}/config`, {
            method: 'PUT',
            body: JSON.stringify({ [input.dataset.field]: input.checked })
          });
          toast('Saved.');
        } catch (e) {
          input.checked = !input.checked;
          toast(e.message, false);
        }
      });
    });
    const toggle = card.querySelector('.settings-toggle');
    const panel = card.querySelector('.settings');
    toggle.addEventListener('click', async () => {
      const open = panel.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(open));
      if (open && !panel.dataset.loaded) await loadSettings(agentId, panel);
    });
  });
}

// ── Runtime settings: model, tokens, iterations, RAG, prompt — per config key ──
// Each field shows the deploy-time default (agent.yml + application.yml) as its
// placeholder; a filled field is an admin override, an empty one inherits.

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadSettings(agentId, panel) {
  panel.innerHTML = '<div class="settings-note">Loading settings…</div>';
  try {
    const groups = await apiFetch(`/api/admin/agents/${agentId}/settings`);
    panel.dataset.loaded = '1';
    if (!groups.length) {
      panel.innerHTML = '<div class="settings-note">This agent has no configurable model settings.</div>';
      return;
    }
    panel.innerHTML = `<div class="settings-note">Leave a field empty to use the default shown in grey. Changes apply to the next run, no restart needed.</div>`
      + groups.map(settingsGroupHtml).join('');
    panel.querySelectorAll('.settings-group').forEach(el => {
      const group = groups.find(g => g.key === el.dataset.key);
      wireSettingsGroup(agentId, el, group, panel);
    });
  } catch (e) {
    panel.innerHTML = `<div class="settings-note">Couldn't load settings: ${esc(e.message)}</div>`;
  }
}

function settingsGroupHtml(g) {
  const d = g.defaults, o = g.override || {};
  const id = s => `set-${g.key}-${s}`;
  const rag = o.ragEnabled == null ? '' : String(o.ragEnabled);
  return `
    <div class="settings-group" data-key="${esc(g.key)}">
      <div class="settings-group-head">
        <span class="settings-key">${esc(g.key)}</span>
        <span class="settings-file">${esc(g.promptFile)}</span>
        ${g.override ? `<span class="badge badge-on">Overridden${g.updatedAt ? ' · ' + new Date(g.updatedAt).toLocaleString() : ''}</span>` : ''}
      </div>
      <div class="settings-grid">
        <label class="settings-field" for="${id('model')}">Model
          <input id="${id('model')}" data-f="model" value="${esc(o.model)}" placeholder="${esc(d.model)}"></label>
        <label class="settings-field" for="${id('maxTokens')}">Max tokens
          <input id="${id('maxTokens')}" data-f="maxTokens" type="number" min="1" value="${esc(o.maxTokens)}" placeholder="${esc(d.maxTokens)}"></label>
        <label class="settings-field" for="${id('maxIterations')}">Max iterations
          <input id="${id('maxIterations')}" data-f="maxIterations" type="number" min="1" max="10" value="${esc(o.maxIterations)}" placeholder="${esc(d.maxIterations)}"></label>
        <label class="settings-field" for="${id('ragEnabled')}">Knowledge retrieval
          <select id="${id('ragEnabled')}" data-f="ragEnabled">
            <option value="" ${rag === '' ? 'selected' : ''}>Default (${d.ragEnabled ? 'on' : 'off'})</option>
            <option value="true" ${rag === 'true' ? 'selected' : ''}>On</option>
            <option value="false" ${rag === 'false' ? 'selected' : ''}>Off</option>
          </select></label>
        <label class="settings-field" for="${id('ragTopK')}">Retrieved passages
          <input id="${id('ragTopK')}" data-f="ragTopK" type="number" min="0" max="50" value="${esc(o.ragTopK)}" placeholder="${esc(d.ragTopK)}"></label>
      </div>
      <label class="settings-field" for="${id('systemPrompt')}">System prompt
        <textarea id="${id('systemPrompt')}" data-f="systemPrompt" spellcheck="false">${esc(o.systemPrompt ?? d.systemPrompt)}</textarea></label>
      <div class="settings-actions">
        <button type="button" class="primary" data-act="save">Save</button>
        <button type="button" data-act="reset" ${g.override ? '' : 'disabled'}>Reset to defaults</button>
        <span class="hint">${g.override ? '' : 'Using defaults'}</span>
      </div>
    </div>`;
}

function wireSettingsGroup(agentId, el, group, panel) {
  const val = f => el.querySelector(`[data-f="${f}"]`).value.trim();
  const num = f => val(f) === '' ? null : Number(val(f));
  el.querySelector('[data-act="save"]').addEventListener('click', async () => {
    const prompt = el.querySelector('[data-f="systemPrompt"]').value;
    const body = {
      model: val('model') || null,
      maxTokens: num('maxTokens'),
      maxIterations: num('maxIterations'),
      ragEnabled: val('ragEnabled') === '' ? null : val('ragEnabled') === 'true',
      ragTopK: num('ragTopK'),
      // An unchanged prompt is the default, not an override.
      systemPrompt: prompt.trim() === (group.defaults.systemPrompt || '').trim() ? null : prompt
    };
    try {
      await apiFetch(`/api/admin/agents/${agentId}/settings/${group.key}`, { method: 'PUT', body: JSON.stringify(body) });
      toast(`Saved ${group.key}.`);
      await loadSettings(agentId, panel);
    } catch (e) {
      toast(errorText(e), false);
    }
  });
  el.querySelector('[data-act="reset"]').addEventListener('click', async () => {
    if (!confirm(`Reset ${group.key} to its defaults? The admin overrides, including any edited prompt, will be removed.`)) return;
    try {
      await apiFetch(`/api/admin/agents/${agentId}/settings/${group.key}`, { method: 'DELETE' });
      toast(`Reset ${group.key} to defaults.`);
      await loadSettings(agentId, panel);
    } catch (e) {
      toast(errorText(e), false);
    }
  });
}

function errorText(e) {
  try { return JSON.parse(e.message).message || e.message; } catch { return e.message; }
}

async function load() {
  try {
    const agents = await apiFetch('/api/admin/agents');
    renderAgents(agents);
  } catch (e) {
    document.getElementById('agentList').innerHTML = `<div class="empty">Error loading agents: ${e.message}</div>`;
  }
}

// Fetch the API key from the admin session, then load
(async () => {
  try {
    const r = await fetch('/api/admin/key', { credentials: 'include' });
    if (r.ok) { const { key } = await r.json(); API_KEY = key; }
  } catch {}
  load();
})();

(async () => {
  try {
    const r = await fetch("/api/admin/env", { credentials: "include" });
    if (!r.ok) return;
    const { env } = await r.json();
    const col = { PRODUCTION: "#ef4444", QA: "#f59e0b", DEV: "#6b7280" }[env] || "#888";
    const el = document.createElement("div");
    el.id = "env-badge";
    el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block"></span>`
      + `<span style="font-size:10px;font-weight:700;letter-spacing:0.5px;color:${col};text-transform:uppercase">${env}</span>`;
    document.body.appendChild(el);
  } catch {}
})();
</script>
</body>
</html>
