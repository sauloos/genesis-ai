<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis AI — Agent Playground</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-bg-image: url('/bg-earth.jpg');
    --theme-bg-transform: rotate(180deg);
    --theme-bg-overlay: rgba(0, 0, 10, 0.75);
    --theme-body-bg: #0a0b12;
    --theme-text-primary: #f2f2f2;
    --theme-text-muted: rgba(255, 255, 255, 0.5);
    --theme-text-label: rgba(255, 255, 255, 0.4);
    --theme-card-bg: rgba(255, 255, 255, 0.05);
    --theme-card-bg-hover: rgba(255, 255, 255, 0.12);
    --theme-card-border: rgba(255, 255, 255, 0.1);
    --theme-card-shadow: rgba(0, 0, 0, 0.3);
    --theme-divider: rgba(255, 255, 255, 0.07);
    --theme-backdrop: none;
  }

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--theme-body-bg); display: flex; height: 100vh; overflow: hidden; color: var(--theme-text-primary); }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -2;
    background: var(--theme-bg-image) var(--theme-bg-position, center center) / var(--theme-bg-size, cover) no-repeat;
    transform: var(--theme-bg-transform, none);
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background: var(--theme-bg-overlay);
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px; min-width: 160px; max-width: 480px; background: #111; display: flex;
    flex-direction: column; overflow-y: auto; flex-shrink: 0;
  }

  #sidebar-resizer {
    width: 5px; flex-shrink: 0; cursor: col-resize; background: #222;
  }
  #sidebar-resizer:hover, #sidebar-resizer.dragging { background: #4caf7d; }
  #sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid #222; position: relative; }
  .sidebar-logo {
    height: 22px; width: auto; aspect-ratio: 805 / 220; display: block; margin-bottom: 4px;
    background-color: #f2f2f2;
    -webkit-mask-image: url(/api/themes/active/logo);
    mask-image: url(/api/themes/active/logo);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }
  #sidebar-header p  { color: #666; font-size: 11px; margin-top: 2px; }
  .mode-badge {
    display: inline-block; margin-top: 8px; padding: 3px 9px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: #6fe0a5; background: rgba(111,224,165,0.12); border: 1px solid rgba(111,224,165,0.3);
    border-radius: 20px;
  }

  /* ── Nav menu (hamburger) ── */
  #nav-toggle {
    position: absolute; top: 16px; right: 12px; width: 26px; height: 26px;
    background: none; border: none; color: #888; cursor: pointer;
    display: flex; align-items: center; justify-content: center; border-radius: 5px;
    transition: background 0.15s, color 0.15s;
  }
  #nav-toggle:hover { background: #1e1e1e; color: #fff; }
  #nav-menu {
    display: none; position: absolute; top: 100%; right: 12px; margin-top: 6px;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
    overflow: hidden; z-index: 20; min-width: 150px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #nav-menu.open { display: block; }
  #nav-menu .nav-item {
    display: block; padding: 9px 14px; font-size: 13px; color: #ccc;
    text-decoration: none; transition: background 0.15s, color 0.15s;
  }
  #nav-menu .nav-item:hover { background: #242424; color: #fff; }
  #nav-menu .nav-item.active {
    color: #fff; font-weight: 600; background: #222; pointer-events: none;
  }

  #agent-list { padding: 16px 12px; }
  .side-label {
    font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase;
    letter-spacing: 0.5px; padding: 4px 4px 8px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .side-label:hover { color: #999; }
  .side-label-chev {
    width: 9px; height: 9px; flex-shrink: 0; transition: transform 0.15s;
    stroke: currentColor;
  }
  .side-section.collapsed .side-label-chev { transform: rotate(-90deg); }
  .side-section.collapsed .side-section-body { display: none; }
  .agent-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; transition: all 0.15s;
  }
  .agent-item:hover:not(.disabled) { background: #1c1c1c; }
  .agent-item.active { background: #1a1a1a; border-color: #333; }
  .agent-item.disabled { opacity: 0.35; cursor: default; }
  .agent-name { color: #eee; font-size: 13px; font-weight: 600; }
  .agent-desc { color: #777; font-size: 11px; margin-top: 2px; line-height: 1.4; }
  .agent-item.active .agent-name { color: #fff; }

  /* ── Page Flow simulate panel ── */
  .tbtn {
    padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit;
    cursor: pointer; border: 1px solid transparent; transition: all 0.15s;
  }
  .tbtn-primary { background: rgba(255,255,255,0.9); color: #0a0b12; }
  .tbtn-primary:hover { background: #fff; }
  .tbtn-ghost { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.12); }
  .tbtn-ghost:hover { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); }
  .sim-current { font-size: 14px; font-weight: 700; color: #fff; }
  .sim-ended { font-size: 12px; color: #6fe0a5; }
  .sim-outcome-btn {
    padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer; text-align: left; background: rgba(255,255,255,0.05); color: #f2f2f2;
    border: 1px solid rgba(255,255,255,0.12); transition: all 0.15s;
  }
  .sim-outcome-btn:hover { border-color: rgba(255,255,255,0.3); }
  .sim-history { font-size: 11px; color: rgba(255,255,255,0.45); display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .sim-history summary { cursor: pointer; font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .sim-history-row { display: flex; justify-content: space-between; gap: 6px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .panel-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }


  /* Agent-view tokens for this dark host — every agent's Playground view module styles itself
     only through --av-* (see /agent-views/_shared/tokens.css), so this is the whole theming. */
  :root {
    --av-surface: rgba(12, 13, 20, 0.94);
    --av-surface-subtle: var(--theme-card-bg);
    --av-surface-hover: var(--theme-card-bg-hover);
    --av-text: var(--theme-text-primary);
    --av-text-strong: #fff;
    --av-text-muted: var(--theme-text-muted);
    --av-text-label: var(--theme-text-label);
    --av-text-faint: rgba(255, 255, 255, 0.3);
    --av-border: var(--theme-card-border);
    --av-border-subtle: var(--theme-divider);
    --av-input-bg: var(--theme-card-bg);
    --av-input-disabled-bg: rgba(255, 255, 255, 0.02);
    --av-accent: rgba(255, 255, 255, 0.9);
    --av-accent-text: #0a0b12;
    --av-bubble-bg: var(--theme-card-bg-hover);
    --av-bubble-text: var(--theme-text-primary);
    --av-success: #6fe0a5;
    --av-success-text: #0a0b12;
    --av-success-bg: #14251c;
    --av-success-border: #2a5a3a;
    --av-warning: #e0a56f;
    --av-warning-bg: #2a1c14;
    --av-warning-border: #5a3a1a;
    --av-danger: #e07070;
    --av-danger-bg: #2a1414;
    --av-backdrop: rgba(0, 0, 0, 0.6);
    --av-shadow: rgba(255, 255, 255, 0.12);
  }

  /* ── Main ── */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .main-area { flex: 1; overflow: auto; flex-direction: column; padding: 20px 28px 28px; }
  .main-area h2 { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
  .main-area .sub { font-size: 12px; color: var(--theme-text-muted); }
  #pf-sim-frame { flex: 1; width: 100%; min-height: 480px; margin-top: 20px; border: 1px solid var(--theme-divider);
    border-radius: 8px; background: #fff; }
  #agent-playground-mount { flex: 1; width: 100%; }
  .main-empty { color: var(--theme-text-muted); font-size: 14px; text-align: center; margin-top: 60px; }

</style>
<link rel="stylesheet" href="/api/themes/active/styles.css">
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <a href="/dashboard"><div class="sidebar-logo" role="img" aria-label="Genesis"></div></a>

    <div class="mode-badge">Playground</div>
    <button id="nav-toggle" onclick="toggleNavMenu(event)" aria-label="Menu">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
    <div id="nav-menu">
      <a href="/dashboard" class="nav-item">Dashboard</a>
      <a href="/dashboard/console" class="nav-item">Consultant</a>
      <a href="/dashboard/training" class="nav-item">Training</a>
      <a href="/dashboard/playground" class="nav-item active">Playground</a>
      <a href="/dashboard/questionnaires" class="nav-item">Questionnaires</a>
      <a href="/dashboard/products" class="nav-item">Products</a>
      <a href="/dashboard/templates" class="nav-item">Templates</a>
      <a href="/dashboard/knowledge" class="nav-item">Knowledge</a>
    </div>
  </div>

  <div id="agent-list" class="side-section">
    <div class="side-label" onclick="toggleSideSection('agent-list')">
      <span>Agents</span>
      <svg class="side-label-chev" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="side-section-body">
      <div id="agent-items">
        <div style="padding:12px 4px;color:#666;font-size:12px;">Loading agents…</div>
      </div>

    </div>
  </div>

  <div id="agent-list-pageflows" class="side-section" style="margin-top:8px;border-top:1px solid #2a2a2a;padding:8px 12px 16px;">
    <div class="side-label" onclick="toggleSideSection('agent-list-pageflows')">
      <span>Page Flows</span>
      <svg class="side-label-chev" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="side-section-body">
      <div id="pageflow-items">
        <div style="padding:12px 4px;color:#666;font-size:12px;">Loading page flows…</div>
      </div>
    </div>
  </div>
</div>

<div id="sidebar-resizer"></div>

<div id="main">
  <!-- Page Flow simulate area (shown only when a page flow is selected) -->
  <div id="pageflow-area" class="main-area" style="display:none">
    <h2 id="pf-title">Page Flow</h2>
    <div class="sub" id="pf-sub"></div>
    <iframe id="pf-sim-frame" src="about:blank" title="Page flow simulation"></iframe>
  </div>

  <!-- Agent area: the host is pure chrome — the selected agent's own Playground view module
       (/agent-views/<agentId>/playground.js, via agent-loader.js) renders everything here. -->
  <div id="agent-playground-area" class="main-area" style="display:flex">
    <div id="agent-playground-mount"><div class="main-empty">Select an agent.</div></div>
  </div>
</div>

<script>
const KEY     = 'genesis-ai-key';
const HEADERS = { 'Content-Type': 'application/json', 'X-Api-Key': KEY };

let currentAgent = null;
let mountSeq = 0;

// Populated at boot from GET /api/admin/agents — keyed by agentId. Nothing about any agent
// (identity, icon, availability, capability, UI) is hardcoded in this page.
let AGENT_CATALOG = {};

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
           .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Collapsible sidebar sections ─────────────────────────────────────────────
function toggleSideSection(id) {
  const el = document.getElementById(id);
  const collapsed = el.classList.toggle('collapsed');
  try { localStorage.setItem('pg-collapsed-' + id, collapsed ? '1' : '0'); } catch {}
}
(function restoreSideSectionState() {
  ['agent-list', 'agent-list-pageflows'].forEach(id => {
    let collapsed = false;
    try { collapsed = localStorage.getItem('pg-collapsed-' + id) === '1'; } catch {}
    if (collapsed) document.getElementById(id).classList.add('collapsed');
  });
})();

async function loadAgentCatalog() {
  const container = document.getElementById('agent-items');
  try {
    const agents = await fetch('/api/admin/agents', { headers: HEADERS }).then(r => r.json());
    AGENT_CATALOG = {};
    agents.forEach(a => { AGENT_CATALOG[a.agentId] = a; });
    renderAgentList();
  } catch (err) {
    container.innerHTML = `<div style="padding:12px 4px;color:#c66;font-size:12px;">Failed to load agents: ${esc(err.message || String(err))}</div>`;
  }
}

function renderAgentList() {
  const container = document.getElementById('agent-items');
  const entries = Object.values(AGENT_CATALOG).filter(a => a.availableForPlayground);
  if (!entries.length) {
    container.innerHTML = '<div style="padding:12px 4px;color:#666;font-size:12px;">No agents available.</div>';
    return;
  }
  container.innerHTML = entries.map(a => `
    <div class="agent-item" data-agent="${esc(a.agentId)}" onclick="selectAgent(this)">
      <div class="agent-name">${esc(a.icon || '🧩')} ${esc(a.displayName)}</div>
      <div class="agent-desc">${esc(a.description || '')}</div>
    </div>
  `).join('');
}

// ── Page Flow simulate (mirrors page-flows.html's Simulate panel) ─────────────
let ADMIN_KEY = null;          // fetched from /api/admin/key — distinct from the public KEY above
let pageFlows = [];

async function pfApiFetch(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'X-Api-Key': ADMIN_KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

async function loadAdminKey() {
  try {
    const r = await fetch('/api/admin/key', { credentials: 'include' });
    if (r.ok) { const { key } = await r.json(); ADMIN_KEY = key; }
  } catch {}
}

async function loadPageFlows() {
  const container = document.getElementById('pageflow-items');
  try {
    pageFlows = await pfApiFetch('/api/admin/page-flows');
    renderPageFlowList();
  } catch (err) {
    container.innerHTML = `<div style="padding:12px 4px;color:#c66;font-size:12px;">Failed to load page flows: ${esc(err.message || String(err))}</div>`;
  }
}

function renderPageFlowList() {
  const container = document.getElementById('pageflow-items');
  if (!pageFlows.length) {
    container.innerHTML = '<div style="padding:12px 4px;color:#666;font-size:12px;">No page flows yet.</div>';
    return;
  }
  container.innerHTML = pageFlows.map(f => `
    <div class="agent-item" data-agent="pageflow:${esc(f.id)}" onclick="selectAgent(this)">
      <div class="agent-name">${f.live ? '🟢' : '⚪️'} ${esc(f.name)}</div>
      <div class="agent-desc">${esc(f.livePath)}</div>
    </div>
  `).join('');
}

async function openPageFlowSim(flowId) {
  const titleEl = document.getElementById('pf-title');
  const subEl = document.getElementById('pf-sub');
  const frameEl = document.getElementById('pf-sim-frame');
  titleEl.textContent = 'Loading…';
  subEl.textContent = '';
  frameEl.src = 'about:blank';
  try {
    const detail = await pfApiFetch(`/api/admin/page-flows/${flowId}`);
    titleEl.textContent = detail.flow.name;
    subEl.textContent = (detail.flow.live ? 'Live at ' : 'Not live · would resolve to ') + detail.flow.livePath;
    frameEl.src = `/flow-runtime.html?simulate=1&pageFlowId=${encodeURIComponent(flowId)}`;
  } catch (err) {
    titleEl.textContent = 'Failed to load page flow';
    subEl.textContent = err.message || String(err);
  }
}

// ── Selection ─────────────────────────────────────────────────────────────────
function selectAgent(el, ctx = {}) {
  document.querySelectorAll('.agent-item').forEach(a => a.classList.remove('active'));
  el.classList.add('active');
  currentAgent = el.dataset.agent;

  const isPageFlow = currentAgent.startsWith('pageflow:');
  document.getElementById('pageflow-area').style.display = isPageFlow ? 'flex' : 'none';
  document.getElementById('agent-playground-area').style.display = isPageFlow ? 'none' : 'flex';
  if (!isPageFlow) document.getElementById('pf-sim-frame').src = 'about:blank';

  const mountEl = document.getElementById('agent-playground-mount');
  mountEl.innerHTML = '';
  if (isPageFlow) {
    openPageFlowSim(currentAgent.slice('pageflow:'.length));
    return;
  }

  const meta = AGENT_CATALOG[currentAgent] || {};
  if (!meta.hasPlaygroundView) {
    mountEl.innerHTML = '<div class="main-empty">This agent has no Playground view.</div>';
    return;
  }
  // Guards against a slow import landing after the admin already picked another agent.
  const seq = ++mountSeq;
  import('/widgets/agent-loader.js').then(({ mountAgentPlaygroundView }) => {
    if (seq !== mountSeq) return;
    mountAgentPlaygroundView(currentAgent, mountEl, meta, ctx);
  });
}

function makeResizable(handle, target, axis, min, max) {
  let dragging = false, startPos, startSize;
  handle.addEventListener('mousedown', e => {
    dragging = true;
    handle.classList.add('dragging');
    startPos = axis === 'x' ? e.clientX : e.clientY;
    startSize = axis === 'x' ? target.getBoundingClientRect().width : target.getBoundingClientRect().height;
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const pos = axis === 'x' ? e.clientX : e.clientY;
    const size = Math.max(min, Math.min(max, startSize + (pos - startPos)));
    if (axis === 'x') target.style.width = size + 'px';
    else target.style.height = size + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
  });
}

makeResizable(document.getElementById('sidebar-resizer'), document.getElementById('sidebar'), 'x', 160, 480);

function toggleNavMenu(e) {
  if (e) e.stopPropagation();
  document.getElementById('nav-menu').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('nav-menu');
  const toggle = document.getElementById('nav-toggle');
  if (menu && menu.classList.contains('open') && !menu.contains(e.target) && !toggle.contains(e.target)) {
    menu.classList.remove('open');
  }
});

// ── Deep link: ?agentId=copy&session=<id> opens that run's replay in the agent's own view ──
(async function initFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const agentId = params.get('agentId');
  const sessionId = params.get('session');

  await loadAgentCatalog();
  await loadAdminKey();
  await loadPageFlows();

  const requestedAvailable = (typeof agentId === 'string' && agentId.startsWith('pageflow:'))
    || (AGENT_CATALOG[agentId] && AGENT_CATALOG[agentId].availableForPlayground);
  const initialAgentId = requestedAvailable
    ? agentId
    : Object.values(AGENT_CATALOG).find(a => a.availableForPlayground)?.agentId;
  if (initialAgentId) {
    const el = document.querySelector(`.agent-item[data-agent="${CSS.escape(initialAgentId)}"]`);
    if (el) selectAgent(el, requestedAvailable && sessionId ? { sessionId } : {});
  }
})();
</script>
<script>
(async () => {
  try {
    const r = await fetch("/api/admin/env", { credentials: "include" });
    if (!r.ok) return;
    const { env } = await r.json();
    const col = { PRODUCTION: "#ef4444", QA: "#f59e0b", DEV: "#6b7280" }[env] || "#888";
    const el = document.createElement("div");
    el.id = "env-badge";
    el.style.cssText = "margin-top:auto;padding:10px 16px;border-top:1px solid #222;display:flex;align-items:center;gap:7px;flex-shrink:0";
    el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0"></span>`
      + `<span style="font-size:10px;font-weight:700;letter-spacing:0.5px;color:${col};text-transform:uppercase">${env}</span>`;
    const sb = document.getElementById("sidebar");
    if (sb) sb.appendChild(el);
  } catch {}
})();
</script>
</body>
</html>
