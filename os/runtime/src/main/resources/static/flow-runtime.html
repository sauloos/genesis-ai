<!DOCTYPE html>
<html lang="en">
<head>
<!--PF_SLUG_INJECT-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-bg-image: none;
    --theme-bg-overlay: transparent;
    --theme-body-bg: #fafafa;
    --theme-text-primary: #1a1a1a;
    --theme-text-muted: #777;
    --theme-card-bg: #fff;
    --theme-card-border: #eee;
    --theme-card-shadow: rgba(0,0,0,0.04);
    --theme-backdrop: none;
    --theme-btn-border: #ddd;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; color: var(--theme-text-primary); background: var(--theme-body-bg);
    display: flex; flex-direction: column; align-items: center; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: var(--theme-bg-image) var(--theme-bg-position, center center) / var(--theme-bg-size, cover) no-repeat;
    transform: var(--theme-bg-transform, none); z-index: -2;
  }
  body::after { content: ''; position: fixed; inset: 0; background: var(--theme-bg-overlay); z-index: -1; }

  #card {
    display: none;
    width: 100%; max-width: 640px; margin: 60px auto; background: var(--theme-card-bg);
    border: 1px solid var(--theme-card-border); border-radius: 16px; padding: 40px 44px;
    box-shadow: 0 2px 20px var(--theme-card-shadow); backdrop-filter: var(--theme-backdrop);
  }

  #card.full-bleed {
    max-width: 100%; width: 100%; min-height: 100vh; margin: 0;
    border: none; border-radius: 0; padding: 0; box-shadow: none; backdrop-filter: none;
  }

  #card.no-border { border: none; box-shadow: none; }
  #card.wide { max-width: 1280px; }

  #page-header { display: flex; flex-direction: column; gap: 16px; }
  #page-header:empty { display: none; }
  #page-header:not(:empty) { margin-bottom: 24px; }
  #page-grid { display: grid; gap: 24px; }
  #card.full-bleed #page-grid { gap: 0; height: 100%; min-height: 100vh; }
  .slot { display: flex; flex-direction: column; gap: 16px; }
  #card.full-bleed .slot { gap: 0; height: 100%; }


  /* Host-provided outcome button class (mount contract): navigation widgets use it, and
     the host disables every .outcome-btn while a widget blocks or the flow advances. */
  .outcome-btn {
    padding: 11px 22px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s; font-family: inherit;
    background: var(--theme-text-primary); color: var(--theme-body-bg);
  }
  .outcome-btn:hover { opacity: 0.85; }
  .outcome-btn:disabled { background: var(--theme-btn-border); color: var(--theme-text-muted); cursor: default; opacity: 1; }
  .outcome-btn-back { background: none; border: 1px solid var(--theme-btn-border); color: var(--theme-text-muted); }
  .outcome-btn-back:hover { color: var(--theme-text-primary); border-color: var(--theme-text-primary); opacity: 1; }

  #state-screen {
    width: 100%; max-width: 640px; margin: 80px auto; text-align: center;
    display: none; flex-direction: column; align-items: center; gap: 10px;
  }
  #state-screen h2 { font-size: 20px; color: var(--theme-text-primary); }
  #state-screen p { font-size: 14px; color: var(--theme-text-muted); max-width: 400px; }

  #register-screen { display: none; width: 100%; max-width: 640px; margin: 60px auto; }
  #register-screen .reg-card {
    background: var(--theme-card-bg); border: 1px solid var(--theme-card-border); border-radius: 16px;
    padding: 40px 44px; box-shadow: 0 2px 20px var(--theme-card-shadow); backdrop-filter: var(--theme-backdrop);
  }
  #register-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--theme-text-primary); }
  #register-screen > .reg-card > p { font-size: 13px; color: var(--theme-text-muted); margin-bottom: 28px; line-height: 1.5; }
  .reg-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .reg-field label { font-size: 11px; font-weight: 600; color: var(--theme-text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
  .reg-field input {
    padding: 11px 13px; border: 1px solid var(--theme-btn-border); border-radius: 9px; font-size: 14px;
    font-family: inherit; outline: none; background: transparent; color: var(--theme-text-primary);
  }
  #reg-err { font-size: 12px; color: #d33; min-height: 16px; margin-bottom: 8px; }
  #reg-btn {
    width: 100%; padding: 12px; background: var(--theme-text-primary); color: var(--theme-body-bg);
    border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .reg-login-row { text-align: center; margin-top: 16px; font-size: 12px; color: var(--theme-text-muted); }
  .reg-login-row a { color: var(--theme-text-primary); text-decoration: none; font-weight: 600; }

  .widget-login { display: flex; flex-direction: column; }





  #sim-badge {
    display: none;
    position: fixed; top: 16px; left: 16px; z-index: 9999;
    align-items: center; gap: 7px;
    background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px; padding: 5px 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #sim-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; flex-shrink: 0; }
  #sim-badge span.label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; color: #a78bfa; text-transform: uppercase; }
</style>
<!--PF_THEME_INJECT-->
</head>
<body>

<div id="sim-badge"><span class="dot"></span><span class="label">Simulated</span></div>

<div id="card">
  <div id="page-header"></div>
  <div id="page-grid"></div>
</div>

<div id="state-screen">
  <h2 id="state-title"></h2>
  <p id="state-message"></p>
</div>

<!-- Registration step shown after a flow ends via endAction=CREATE_ENGAGEMENT -->
<div id="register-screen">
  <div class="reg-card">
    <h2>One last step</h2>
    <p>Create an account to see your brand results and download your files when they're ready.</p>
    <div class="reg-field">
      <label>Name</label>
      <input id="reg-name" type="text" placeholder="Your name">
    </div>
    <div class="reg-field">
      <label>Email</label>
      <input id="reg-email" type="email" placeholder="your@email.com">
    </div>
    <div class="reg-field">
      <label>Password</label>
      <input id="reg-password" type="password" placeholder="Min 8 characters">
    </div>
    <div id="reg-err"></div>
    <button id="reg-btn" onclick="submitRegistration()">See my brand results →</button>
    <div class="reg-login-row">
      Already have an account? <a id="reg-login-link" href="/login">Sign in</a>
    </div>
  </div>
</div>

<script>
const API     = '';
const KEY     = 'genesis-ai-key';
const HEADERS = { 'Content-Type': 'application/json', 'X-Api-Key': KEY };

let slug = null;
let rootPrefix = null;
let token = null;
let layouts = [];
let requiredPending = new Set();
let renderGeneration = 0;
let currentPageOutcomes = [];
let currentPageWidgets = [];
let currentPageEnded = false;

// Simulate mode: an admin previewing a (possibly draft, never-live) PageFlow from
// page-flows.html/playground.html, embedded here via an iframe with ?simulate=1&pageFlowId=.
// Every session it starts is a real FlowSession row flagged simulated=true server-side
// (see FlowSessionController/PublicFlowRuntimeService) — this only swaps which API base
// this page talks to and skips the slug/localStorage machinery a real visitor needs.
let simulate = false;
let pageFlowId = null;
function fsBase() { return simulate ? '/api/admin/flow-sessions' : '/api/public/flow-sessions'; }

function updateOutcomeButtons() {
  document.querySelectorAll('.outcome-btn').forEach(b => b.disabled = requiredPending.size > 0);
}

function storageKey(s) { return 'flowSession:' + s; }

async function boot() {
  const params = new URLSearchParams(window.location.search);
  simulate = params.get('simulate') === '1';
  pageFlowId = params.get('pageFlowId');

  if (simulate) {
    document.getElementById('sim-badge').style.display = 'flex';
    try {
      layouts = await fetch(`${API}/api/public/page-layouts`, { headers: HEADERS }).then(r => r.json());
      const res = await fetch(`${API}${fsBase()}`, {
        method: 'POST', headers: HEADERS, credentials: 'include',
        body: JSON.stringify({ pageFlowId })
      });
      if (!res.ok) throw new Error('no such flow');
      const view = await res.json();
      token = view.token;
      render(view);
    } catch (e) {
      showState('Nothing here', 'This page flow could not be simulated.');
    }
    return;
  }

  // window.__PF_SLUG__ is set server-side (see PageController#flowRuntime) because
  // PageFlowRouteFilter reaches this page via a servlet forward, which never updates
  // the browser's own window.location — a query-string read here would always be null
  // for any /live/<slug>-style request. The query-string fallback only covers a direct
  // /flow-runtime.html?slug=... hit if the server-side injection is ever bypassed.
  // A root-mounted flow's slug is legitimately "" — must not be treated as falsy/absent
  // the way a genuinely-unresolved (null) slug is.
  slug = (typeof window.__PF_SLUG__ !== 'undefined' && window.__PF_SLUG__ !== null)
    ? window.__PF_SLUG__
    : new URLSearchParams(window.location.search).get('slug');
  if (slug === null) {
    showState('Nothing here', 'There is no live page available at this address.');
    return;
  }
  // Disambiguates a slug shared by two live flows under different root prefixes (see
  // PageFlowRepository#findLiveByRoute) — null means the default "/live" prefix.
  rootPrefix = (typeof window.__PF_ROOT_PREFIX__ !== 'undefined')
    ? window.__PF_ROOT_PREFIX__
    : new URLSearchParams(window.location.search).get('rootPrefix');

  try {
    layouts = await fetch(`${API}/api/public/page-layouts`, { headers: HEADERS }).then(r => r.json());

    let view = null;
    const savedToken = localStorage.getItem(storageKey(slug));
    if (savedToken) {
      const res = await fetch(`${API}/api/public/flow-sessions/${savedToken}`, { headers: HEADERS });
      if (res.ok) {
        view = await res.json();
      } else {
        localStorage.removeItem(storageKey(slug));
      }
    }

    if (!view) {
      const res = await fetch(`${API}/api/public/flow-sessions`, {
        method: 'POST', headers: HEADERS, body: JSON.stringify({ slug, rootPrefix })
      });
      // The flow's current page requires a signed-in client (PublicFlowRuntimeService
      // throws AuthRequiredException) — send them to sign in rather than showing a
      // generic "no live page" error, then bring them straight back here.
      if (res.status === 403) {
        window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname + window.location.search);
        return;
      }
      if (!res.ok) throw new Error('no live flow');
      view = await res.json();
      localStorage.setItem(storageKey(slug), view.token);
    }

    token = view.token;
    render(view);
  } catch (e) {
    showState('Nothing here', 'There is no live page available at this address.');
  }
}

function render(view) {
  token = view.token;

  if (view.ended) {
    if (!simulate) localStorage.removeItem(storageKey(slug));
    // An END_PAGE flow sets a designated page as the true final destination — show
    // it instead of the generic completion screen, which is reserved for flows that
    // have no end page at all (REDIRECT_FLOW/CREATE_ENGAGEMENT already navigated away,
    // or a plain end-of-flow with nothing configured).
    if (view.page) {
      renderPage(view.page, true);
      return;
    }
    if (view.engagementId) {
      showRegisterScreen(view.engagementId);
    } else {
      showState('All done', 'Thanks — you have completed this flow.');
    }
    return;
  }

  if (!simulate && view.slug !== slug) {
    slug = view.slug;
    localStorage.setItem(storageKey(slug), token);
    history.replaceState(null, '', view.livePath || ('/live/' + slug));
  }

  renderPage(view.page, false);
}

function renderPage(page, isEnded) {
  const layout = layouts.find(l => l.id === page.layoutKey) || layouts[0];
  const isFullBleed = !!layout && layout.id === 'FULL_BLEED';

  document.getElementById('state-screen').style.display = 'none';
  document.getElementById('card').style.display = 'block';
  document.getElementById('card').classList.toggle('full-bleed', isFullBleed);
  document.getElementById('card').classList.toggle('no-border', page.bordered === false);
  document.getElementById('card').classList.toggle('wide', !!layout && layout.wide);

  renderGeneration++;
  requiredPending = new Set();
  currentPageOutcomes = page.outcomes || [];
  currentPageWidgets = page.widgets || [];
  // A flow's designated end page is terminal — the session has already ended server-side;
  // widgets see that as ctx.page.ended (pageNav renders nothing there).
  currentPageEnded = isEnded;
  const widgets = currentPageWidgets;

  // 'header' is a reserved slotKey, not a layout-declared one: any widget assigned to it
  // renders full-width above the grid (spanning every column/slot below), regardless of
  // which layout the page uses — the only way a widget can break out of its column today.
  const headerEl = document.getElementById('page-header');
  headerEl.innerHTML = '';
  widgets.filter(w => w.slotKey === 'header').forEach(w => headerEl.appendChild(renderWidget(w)));

  const grid = document.getElementById('page-grid');
  grid.style.gridTemplateColumns = layout ? layout.gridTemplateColumns : '1fr';
  grid.innerHTML = '';
  (layout ? layout.slots : [{ key: 'main', label: 'Main' }]).forEach(slot => {
    const slotEl = document.createElement('div');
    slotEl.className = 'slot';
    widgets.filter(w => w.slotKey === slot.key).forEach(w => slotEl.appendChild(renderWidget(w)));
    grid.appendChild(slotEl);
  });

  updateOutcomeButtons();
}

// Every widget type renders through its own module at /widgets/<type>/widget.js —
// resolved by convention, so a new widget (core or tenant) is a WidgetDescriptor bean
// plus that module, never an edit here.
function renderWidget(w) {
  const div = document.createElement('div');
  div.className = 'widget-' + w.widgetType.replace(/[A-Z]/g, c => '-' + c.toLowerCase());
  const generation = renderGeneration;
  const ctx = widgetCtx(w);
  // Blocks the outcome buttons while the module loads; released once mount resolves
  // unless the widget asked to keep blocking via ctx.requireCompletion().
  requiredPending.add(w.id);
  import('/widgets/loader.js')
    .then(({ mountWidget }) => mountWidget(w.widgetType, div, w, ctx))
    .catch(e => console.warn(`Widget "${w.widgetType}" failed to load`, e))
    .finally(() => {
      if (generation !== renderGeneration || ctx._blocking) return;
      requiredPending.delete(w.id);
      updateOutcomeButtons();
    });
  return div;
}

// The host services a widget module may use. Calls made after the page has changed are
// ignored, so a slow widget can never block or advance a page it no longer belongs to.
function widgetCtx(w) {
  const generation = renderGeneration;
  const live = () => generation === renderGeneration;
  const credentials = simulate ? 'include' : 'same-origin';
  const ctx = {
    simulate,
    outcomes: currentPageOutcomes.map(o => ({ key: o.key, label: o.label })),
    page: { ended: currentPageEnded, widgetCount: currentPageWidgets.length },
    requireCompletion() {
      ctx._blocking = true;
      if (!live()) return;
      requiredPending.add(w.id);
      updateOutcomeButtons();
    },
    complete() {
      ctx._blocking = false;
      if (!live()) return;
      requiredPending.delete(w.id);
      updateOutcomeButtons();
    },
    onOutcome(key) {
      ctx.complete();
      if (live()) advance(key || 'next');
    },
    advance(key) {
      if (live()) advance(key || 'next');
    },
    session: {
      get token() { return token; },
      fetch(path, init = {}) {
        return fetch(`${API}${fsBase()}/${token}${path}`, {
          ...init, credentials, headers: { ...HEADERS, ...(init.headers || {}) }
        });
      }
    },
    saveContext(patch) {
      return ctx.session.fetch('/context', {
        method: 'PUT', body: JSON.stringify({ contextPatchJson: JSON.stringify(patch) })
      });
    }
  };
  return ctx;
}

async function advance(outcomeKey) {
  document.querySelectorAll('.outcome-btn').forEach(b => b.disabled = true);
  try {
    const res = await fetch(`${API}${fsBase()}/${token}/advance`, {
      method: 'POST', headers: HEADERS, body: JSON.stringify({ outcomeKey }),
      credentials: simulate ? 'include' : 'same-origin'
    });
    if (!res.ok) throw new Error('advance failed');
    render(await res.json());
  } catch (e) {
    document.querySelectorAll('.outcome-btn').forEach(b => b.disabled = false);
    showState('Something went wrong', 'Please try again.');
  }
}

function showState(title, message) {
  document.getElementById('card').style.display = 'none';
  const s = document.getElementById('state-screen');
  s.style.display = 'flex';
  document.getElementById('state-title').textContent = title;
  document.getElementById('state-message').textContent = message;
}

function showRegisterScreen(engagementId) {
  document.getElementById('card').style.display = 'none';
  document.getElementById('state-screen').style.display = 'none';
  document.getElementById('reg-login-link').href = '/login?next=' + encodeURIComponent('/your-brand/' + engagementId);
  document.getElementById('register-screen').style.display = 'block';
  document.getElementById('register-screen').dataset.engagementId = engagementId;
}

async function submitRegistration() {
  const engagementId = document.getElementById('register-screen').dataset.engagementId;
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl    = document.getElementById('reg-err');
  errEl.textContent = '';

  if (!name || !email || !password) { errEl.textContent = 'Please fill in all fields.'; return; }
  if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }

  const btn = document.getElementById('reg-btn');
  btn.disabled = true; btn.textContent = 'Creating account…';

  const regRes = await fetch(`${API}/api/auth/register`, {
    method: 'POST', headers: HEADERS, body: JSON.stringify({ name, email, password })
  }).then(r => r.json());

  if (regRes.error && !regRes.error.includes('already exists')) {
    errEl.textContent = regRes.error; btn.disabled = false; btn.textContent = 'See my brand results →'; return;
  }

  btn.textContent = 'Linking your brand…';
  await fetch(`${API}/api/engagements/${engagementId}/claim`, { method: 'POST', headers: HEADERS });

  window.location.href = '/your-brand/' + engagementId;
}

boot();
</script>
</body>
</html>
