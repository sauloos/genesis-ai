<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget preview — Genesis AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-body-bg: #fafafa;
    --theme-text-primary: #1a1a1a;
    --theme-text-muted: #777;
    --theme-card-bg: #fff;
    --theme-card-border: #eee;
    --theme-card-shadow: rgba(0,0,0,0.04);
    --theme-btn-border: #ddd;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; color: var(--theme-text-primary); background: var(--theme-body-bg);
    padding: 0 16px;
  }
  .preview-banner {
    max-width: 640px; margin: 24px auto 0; font-size: 12px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--theme-text-muted);
  }
  .preview-card {
    max-width: 640px; margin: 12px auto 60px; background: var(--theme-card-bg);
    border: 1px solid var(--theme-card-border); border-radius: 16px; padding: 40px 44px;
    box-shadow: 0 2px 20px var(--theme-card-shadow);
  }
  .preview-error { color: var(--theme-text-muted); font-size: 14px; }

  /* Host-provided button class (see the widget mount contract) */
  .outcome-btn {
    padding: 12px 28px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px;
    font-weight: 500; background: var(--theme-text-primary); color: var(--theme-body-bg);
  }
  .outcome-btn:disabled { background: var(--theme-btn-border); color: var(--theme-text-muted); cursor: default; }
  .outcome-btn-back { background: none; border: 1px solid var(--theme-btn-border); color: var(--theme-text-muted); }
</style>
</head>
<body>
<div class="preview-banner" id="preview-banner">Preview</div>
<div class="preview-card"><div id="preview-widget"></div></div>

<script type="module">
// Admin preview of one widget, outside any flow: mounts the widget's own module through
// loader.js in simulate mode — the same module a flow uses, never a reimplementation.
// /dashboard/widget-preview?type=<widgetType>&config=<url-encoded JSON>
const params = new URLSearchParams(location.search);
const type = params.get('type');
const container = document.getElementById('preview-widget');

function fail(message) {
  container.innerHTML = '';
  const p = document.createElement('p');
  p.className = 'preview-error';
  p.textContent = message;
  container.appendChild(p);
}

let config = {};
try {
  config = JSON.parse(params.get('config') || '{}');
} catch (_) {
  fail('The preview link has an invalid config.');
}

if (!type) {
  fail('No widget type given.');
} else {
  document.getElementById('preview-banner').textContent = `Preview · ${type} · simulated`;
  container.className = 'widget-' + type.replace(/[A-Z]/g, c => '-' + c.toLowerCase());
  const widget = { id: 'preview', slotKey: 'main', orderInSlot: 1, widgetType: type, config };
  const ctx = {
    simulate: true,
    outcomes: [],
    page: { ended: true, widgetCount: 1 },
    requireCompletion() {},
    complete() {},
    onOutcome() { document.getElementById('preview-banner').textContent = `Preview · ${type} · finished`; },
    advance(key) { document.getElementById('preview-banner').textContent = `Preview · ${type} · finished (${key})`; },
    saveContext: async () => {},
  };
  import('/widgets/loader.js')
    .then(({ mountWidget }) => mountWidget(type, container, widget, ctx))
    .catch(() => fail(`The "${type}" widget is not available in this app.`));
}
</script>
</body>
</html>
