spring:
  application:
    name: genesis-os
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/genesis-os;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  ai:
    # A rate limit (429) is worth waiting out: Spring AI otherwise treats every 4xx as final,
    # so one throttled image call failed a whole engagement. The Azure image deployment allows
    # only 2 requests a minute, and an engagement draws three logos at once. Backoff is the
    # Spring AI default (2s, x5, capped at 3 min, 10 attempts).
    retry:
      on-http-codes: 429
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: claude-opus-5-5
          max-tokens: 8000
    openai:
      api-key: ${OPENAI_API_KEY:}
      # Embeddings and images can each be served by an Azure OpenAI resource instead, so they
      # draw on Azure (Microsoft for Startups) credits. Point the base URL at the resource's
      # v1 API, https://<resource>.openai.azure.com/openai/ (the trailing slash matters: Spring
      # joins it to the relative image path without one), and give it that resource's key;
      # the model id is then the Azure deployment's name. Left empty, both fall back to
      # api.openai.com and OPENAI_API_KEY. Claude stays on Anthropic: the credits exclude it.
      embedding:
        base-url: ${OPENAI_EMBEDDING_BASE_URL:}
        api-key: ${OPENAI_EMBEDDING_API_KEY:}
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      image:
        base-url: ${OPENAI_IMAGE_BASE_URL:}
        api-key: ${OPENAI_IMAGE_API_KEY:}

# Same env names as genesis-brands. Without this mapping AZURE_STORAGE_ACCOUNT/KEY never bind,
# and BlobStorageService falls back to local disk, which a redeploy wipes.
azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT:}
    account-key: ${AZURE_STORAGE_KEY:}
    container: ${AZURE_STORAGE_CONTAINER:knowledge}

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

genesis:
  environment: ${APP_ENV:dev}
  # View-only document previews (os/previews): inert unless enabled and a signing key (16+ chars) is set.
  previews:
    enabled: ${GENESIS_PREVIEWS_ENABLED:false}
    signing-key: ${GENESIS_PREVIEWS_SIGNING_KEY:}
  api-key: ${GENESIS_API_KEY:dev-key-change-in-prod}
  allowed-hosts: ${GENESIS_ALLOWED_HOSTS:}
  basic-auth:
    username: ${BASIC_AUTH_USERNAME:genesis}
    password: ${BASIC_AUTH_PASSWORD:change-me-in-prod}
  google-oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  images:
    # Every agent that generates a picture calls this model. When OpenAI retires it, set
    # GENESIS_IMAGE_MODEL and add the new id to UsagePricing — no code change.
    model: ${GENESIS_IMAGE_MODEL:gpt-image-2.6-sunburst}
  training:
    interpretation:
      enabled: true
      model: claude-haiku-4-5
  # Agent config: each adopted agent module ships agents/<id>/agent.yml; add a
  # genesis.agents.<id>.* key here only to override one of its defaults.
