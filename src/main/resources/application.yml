spring:
  application:
    name: genesis-ai
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/genesis;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: claude-opus-5
          max-tokens: 8000
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

genesis:
  api-key: ${GENESIS_API_KEY:dev-key-change-in-prod}
  basic-auth:
    username: ${BASIC_AUTH_USERNAME:genesis}
    password: ${BASIC_AUTH_PASSWORD:change-me-in-prod}
  training:
    interpretation:
      enabled: true
      model: claude-haiku-4-5
  agents:
    copy:
      model: claude-sonnet-5
      system-prompt: agents/copy/system.md
      max-tokens: 3000
      rag:
        enabled: true
        top-k: 3
      max-iterations: 3
    copy-evaluator:
      model: claude-opus-5
      system-prompt: agents/evaluation/copy-evaluator.md
      max-tokens: 1500
    visual-identity:
      model: claude-sonnet-5
      system-prompt: agents/visual-identity/system.md
      max-tokens: 2500
      rag:
        enabled: true
        top-k: 3
      max-iterations: 3
    visual-identity-evaluator:
      model: claude-opus-5
      system-prompt: agents/evaluation/visual-identity-evaluator.md
      max-tokens: 1500

azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT:}
    account-key: ${AZURE_STORAGE_KEY:}
    container: ${AZURE_STORAGE_CONTAINER:knowledge}

qdrant:
  rest:
    url: ${QDRANT_REST_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
