<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root {
  --bg:           #111318;
  --bg-alt:       #181c26;
  --surface:      #1e2333;
  --surface-hover:#252b3b;
  --surface-sel:  #1a2d50;
  --border:       #2a3145;
  --border-light: #323a52;
  --accent:       #4f8ef7;
  --accent-dim:   #2d5ab0;
  --text:         #e2e6f0;
  --text-mid:     #8892a8;
  --text-dim:     #515c72;
  --danger:       #e05050;
  --danger-dim:   #7a2020;
  --success:      #3faa72;
  --warn:         #d9893a;
  --tag-mod:      #1e3a5f;
  --tag-mod-text: #7ab5ff;
  --tag-train:    #1e3d28;
  --tag-train-text:#5cc98a;
  --tag-src:      #3a2e12;
  --tag-src-text: #d4a83a;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:           #f0f2f7;
    --bg-alt:       #e8ebf3;
    --surface:      #ffffff;
    --surface-hover:#f4f6fb;
    --surface-sel:  #ddeaff;
    --border:       #d0d5e3;
    --border-light: #bbc2d6;
    --text:         #1a1e2e;
    --text-mid:     #5a637a;
    --text-dim:     #9099b0;
    --tag-mod:      #ddeaff;
    --tag-mod-text: #1a5abf;
    --tag-train:    #d6f5e3;
    --tag-train-text:#1a7a45;
    --tag-src:      #fef4d9;
    --tag-src-text: #8a5a10;
  }
}
:root[data-theme="light"] {
  --bg:           #f0f2f7;
  --bg-alt:       #e8ebf3;
  --surface:      #ffffff;
  --surface-hover:#f4f6fb;
  --surface-sel:  #ddeaff;
  --border:       #d0d5e3;
  --border-light: #bbc2d6;
  --text:         #1a1e2e;
  --text-mid:     #5a637a;
  --text-dim:     #9099b0;
  --tag-mod:      #ddeaff;
  --tag-mod-text: #1a5abf;
  --tag-train:    #d6f5e3;
  --tag-train-text:#1a7a45;
  --tag-src:      #fef4d9;
  --tag-src-text: #8a5a10;
}

/* ── Reset ───────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top bar ─────────────────────────────────────────────────────────── */
.topbar {
  height: 48px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
}
.topbar-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.topbar-sep { width: 1px; height: 20px; background: var(--border); }
.search-wrap {
  flex: 1;
  max-width: 380px;
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
}
#search {
  width: 100%;
  height: 30px;
  padding: 0 10px 0 30px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  outline: none;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text-dim); }
.topbar-counts {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-mid);
  font-variant-numeric: tabular-nums;
}
.topbar-theme {
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  width: 28px;
  height: 28px;
  cursor: pointer;
  color: var(--text-mid);
  display: flex;
  align-items: center;
  justify-content: center;
}
.topbar-theme:hover { border-color: var(--accent); color: var(--accent); }

/* ── Layout ──────────────────────────────────────────────────────────── */
.layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Sidebar ─────────────────────────────────────────────────────────── */
.sidebar {
  width: 290px;
  flex-shrink: 0;
  background: var(--bg-alt);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 16px;
}
.sidebar-body::-webkit-scrollbar { width: 4px; }
.sidebar-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Section ─────────────────────────────────────────────────────────── */
.section-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  cursor: pointer;
  user-select: none;
  color: var(--text-mid);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.section-head:hover { color: var(--text); }
.section-head .caret {
  display: inline-block;
  transition: transform 0.15s;
  font-size: 9px;
  margin-right: 2px;
}
.section-head.open .caret { transform: rotate(90deg); }
.section-count {
  margin-left: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 6px;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}
.section-items { display: none; }
.section-items.open { display: block; }

/* ── Tree item ───────────────────────────────────────────────────────── */
.tree-item {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 5px 14px 5px 28px;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.1s;
  min-width: 0;
}
.tree-item:hover { background: var(--surface-hover); }
.tree-item.selected { background: var(--surface-sel); color: var(--accent); }
.tree-item.hidden { display: none; }
.item-icon {
  width: 18px;
  flex-shrink: 0;
  color: var(--text-dim);
  font-size: 12px;
  margin-right: 6px;
}
.tree-item.selected .item-icon { color: var(--accent); }
.item-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12.5px;
}
.item-sub {
  font-size: 10.5px;
  color: var(--text-dim);
  white-space: nowrap;
  margin-left: 4px;
  flex-shrink: 0;
}
.tree-item.selected .item-sub { color: var(--accent-dim); }

/* Category group within section */
.cat-group { margin-bottom: 2px; }
.cat-label {
  padding: 4px 14px 2px 20px;
  font-size: 10.5px;
  color: var(--text-dim);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ── Detail panel ────────────────────────────────────────────────────── */
.detail {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.detail-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--text-dim);
}
.detail-empty-icon { font-size: 36px; opacity: 0.3; }
.detail-empty p { font-size: 13px; }

.detail-header {
  padding: 16px 24px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 14px;
  flex-shrink: 0;
}
.detail-header-info { flex: 1; min-width: 0; }
.detail-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  word-break: break-word;
  margin-bottom: 6px;
}
.detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.chip-mod     { background: var(--tag-mod);   color: var(--tag-mod-text); }
.chip-train   { background: var(--tag-train); color: var(--tag-train-text); }
.chip-src     { background: var(--tag-src);   color: var(--tag-src-text); }
.chip-neutral { background: var(--surface);   color: var(--text-mid); border: 1px solid var(--border); }

.detail-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding: 0 12px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.12s, border-color 0.12s;
}
.btn-danger {
  background: var(--danger-dim);
  border-color: var(--danger);
  color: #ffd0d0;
}
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost {
  background: none;
  border-color: var(--border);
  color: var(--text-mid);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}
.detail-body::-webkit-scrollbar { width: 5px; }
.detail-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Content sections in detail ──────────────────────────────────────── */
.detail-section { margin-bottom: 20px; }
.detail-section-title {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-mid);
  margin-bottom: 8px;
}
.code-block {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  line-height: 1.7;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  overflow-x: auto;
  white-space: pre;
  color: var(--text);
  max-height: 480px;
  overflow-y: auto;
}
.code-block::-webkit-scrollbar { width: 4px; height: 4px; }
.code-block::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.text-block {
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-mid);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  max-height: 300px;
  overflow-y: auto;
}
.url-link {
  color: var(--accent);
  text-decoration: none;
  word-break: break-all;
  font-size: 12px;
}
.url-link:hover { text-decoration: underline; }

/* training content items */
.content-list { display: flex; flex-direction: column; gap: 6px; }
.content-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.content-item-type {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding-top: 2px;
  width: 42px;
  flex-shrink: 0;
}
.content-item-body { flex: 1; min-width: 0; font-size: 12px; color: var(--text-mid); line-height: 1.5; }
.content-item-body strong { color: var(--text); font-weight: 500; display: block; margin-bottom: 2px; }
.content-item-del {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  font-size: 13px;
  line-height: 1;
  flex-shrink: 0;
}
.content-item-del:hover { color: var(--danger); background: var(--surface-hover); }

/* ── Status badge ────────────────────────────────────────────────────── */
.status-draft    { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
.status-ingested { background: var(--tag-train); color: var(--tag-train-text); }
.status-pending  { background: var(--tag-src);   color: var(--tag-src-text); }
.status-rejected { background: var(--danger-dim); color: #ffa0a0; }

/* ── Loading / error ─────────────────────────────────────────────────── */
.loading-row {
  padding: 10px 28px;
  font-size: 11.5px;
  color: var(--text-dim);
  font-style: italic;
}
.no-results {
  padding: 8px 28px;
  font-size: 11.5px;
  color: var(--text-dim);
  display: none;
}
.no-results.visible { display: block; }

/* ── Confirm overlay ─────────────────────────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  display: none;
}
.overlay.open { display: flex; }
.confirm-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  max-width: 380px;
  width: calc(100% - 40px);
}
.confirm-box h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.confirm-box p  { font-size: 12.5px; color: var(--text-mid); margin-bottom: 18px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ── Toast ───────────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--text);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  z-index: 200;
  transform: translateY(60px);
  opacity: 0;
  transition: transform 0.2s, opacity 0.2s;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.err  { border-color: var(--danger); color: #ffaaaa; }
</style>
</head>
<body>

<!-- Nav (hidden until toggle) -->
<div id="nav-menu" style="display:none;position:fixed;top:48px;left:0;background:#111318;border:1px solid #2a3145;border-radius:0 0 8px 8px;z-index:50;min-width:160px;padding:4px 0;">
  <a href="/console"        style="display:block;padding:8px 16px;color:#aaa;text-decoration:none;font-size:13px;" onmouseover="this.style.background='#1e2333'" onmouseout="this.style.background=''">Consultant</a>
  <a href="/training"       style="display:block;padding:8px 16px;color:#aaa;text-decoration:none;font-size:13px;" onmouseover="this.style.background='#1e2333'" onmouseout="this.style.background=''">Training</a>
  <a href="/playground"     style="display:block;padding:8px 16px;color:#aaa;text-decoration:none;font-size:13px;" onmouseover="this.style.background='#1e2333'" onmouseout="this.style.background=''">Playground</a>
  <a href="/questionnaires" style="display:block;padding:8px 16px;color:#aaa;text-decoration:none;font-size:13px;" onmouseover="this.style.background='#1e2333'" onmouseout="this.style.background=''">Questionnaires</a>
  <a href="/templates"      style="display:block;padding:8px 16px;color:#aaa;text-decoration:none;font-size:13px;" onmouseover="this.style.background='#1e2333'" onmouseout="this.style.background=''">Templates</a>
  <a href="/knowledge"      style="display:block;padding:8px 16px;color:#4f8ef7;text-decoration:none;font-size:13px;font-weight:600;" onmouseover="this.style.background='#1e2333'" onmouseout="this.style.background=''">Knowledge</a>
</div>

<!-- Top bar -->
<div class="topbar">
  <button onclick="toggleNavMenu(event)" style="background:none;border:1px solid #2a3145;border-radius:5px;width:28px;height:28px;cursor:pointer;color:#8892a8;font-size:14px;display:flex;align-items:center;justify-content:center;" title="Menu">☰</button>
  <span class="topbar-title">Knowledge Explorer</span>
  <div class="topbar-sep"></div>
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="6.5" cy="6.5" r="5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/>
    </svg>
    <input id="search" type="search" placeholder="Search modules, sessions, sources…" oninput="filterAll(this.value)">
  </div>
  <span class="topbar-counts" id="total-count"></span>
  <button class="topbar-theme" onclick="toggleTheme()" title="Toggle theme">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>
</div>

<!-- Layout -->
<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-body" id="sidebar-body">

      <!-- Modules section -->
      <div id="section-modules">
        <div class="section-head open" onclick="toggleSection('modules')">
          <span class="caret">▶</span>
          <span>Modules</span>
          <span class="section-count" id="count-modules">–</span>
        </div>
        <div class="section-items open" id="items-modules">
          <div class="loading-row">Loading…</div>
        </div>
        <div class="no-results" id="nores-modules">No matches</div>
      </div>

      <!-- Training section -->
      <div id="section-training">
        <div class="section-head open" onclick="toggleSection('training')">
          <span class="caret">▶</span>
          <span>Training</span>
          <span class="section-count" id="count-training">–</span>
        </div>
        <div class="section-items open" id="items-training">
          <div class="loading-row">Loading…</div>
        </div>
        <div class="no-results" id="nores-training">No matches</div>
      </div>

      <!-- Sources section -->
      <div id="section-sources">
        <div class="section-head open" onclick="toggleSection('sources')">
          <span class="caret">▶</span>
          <span>Sources</span>
          <span class="section-count" id="count-sources">–</span>
        </div>
        <div class="section-items open" id="items-sources">
          <div class="loading-row">Loading…</div>
        </div>
        <div class="no-results" id="nores-sources">No matches</div>
      </div>

    </div>
  </div>

  <!-- Detail panel -->
  <div class="detail" id="detail">
    <div class="detail-empty" id="detail-empty">
      <div class="detail-empty-icon">🔍</div>
      <p>Select an item to inspect it</p>
    </div>
  </div>
</div>

<!-- Confirm overlay -->
<div class="overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirm-title">Delete item?</h3>
    <p id="confirm-body">This cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok" onclick="execDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API     = '';
const KEY     = 'genesis-ai-key';
const HEADERS = { 'Content-Type': 'application/json', 'X-Api-Key': KEY };

// ── State ─────────────────────────────────────────────────────────────
let allModules  = [];
let allSessions = [];
let allSources  = [];
let selected    = null; // { type, id }
let pendingDel  = null; // { type, id, label }

// ── Boot ──────────────────────────────────────────────────────────────
(async () => {
  const [modules, sessions, sources] = await Promise.allSettled([
    fetch(`${API}/api/knowledge/modules`, { headers: HEADERS }).then(r => r.json()),
    fetch(`${API}/api/training/sessions`, { headers: HEADERS }).then(r => r.json()),
    fetch(`${API}/api/knowledge/sources`, { headers: HEADERS }).then(r => r.json()),
  ]);

  allModules  = modules.status  === 'fulfilled' ? modules.value  : [];
  allSessions = sessions.status === 'fulfilled' ? sessions.value : [];
  allSources  = sources.status  === 'fulfilled' ? sources.value  : [];

  renderModules(allModules);
  renderSessions(allSessions);
  renderSources(allSources);
  updateTotals();
})();

// ── Render sidebar ────────────────────────────────────────────────────
function renderModules(items) {
  const container = document.getElementById('items-modules');
  document.getElementById('count-modules').textContent = items.length;

  if (!items.length) { container.innerHTML = '<div class="loading-row">No modules found</div>'; return; }

  // Group by category
  const cats = {};
  items.forEach(m => {
    (cats[m.category] = cats[m.category] || []).push(m);
  });

  let html = '';
  Object.entries(cats).sort().forEach(([cat, ms]) => {
    html += `<div class="cat-group"><div class="cat-label">${esc(cat)}</div>`;
    ms.forEach(m => {
      html += `<div class="tree-item" id="mod-${esc(m.key)}" data-search="${(m.name + ' ' + m.category + ' ' + m.key).toLowerCase()}"
        onclick="selectModule('${esc(m.key)}')">
        <span class="item-icon">⚙</span>
        <span class="item-label">${esc(m.name)}</span>
      </div>`;
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

function renderSessions(items) {
  const container = document.getElementById('items-training');
  document.getElementById('count-training').textContent = items.length;

  if (!items.length) { container.innerHTML = '<div class="loading-row">No training sessions</div>'; return; }

  const statusOrder = { INGESTED: 0, PENDING_REVIEW: 1, DRAFT: 2, REJECTED: 3 };
  const sorted = [...items].sort((a,b) => (statusOrder[a.status]||9) - (statusOrder[b.status]||9));

  container.innerHTML = sorted.map(s => `
    <div class="tree-item" id="sess-${esc(s.id)}" data-search="${(s.topic||'').toLowerCase()} ${(s.intent||'').toLowerCase()} ${(s.status||'').toLowerCase()}"
      onclick="selectSession('${esc(s.id)}')">
      <span class="item-icon">📄</span>
      <span class="item-label">${esc(s.topic || 'Untitled')}</span>
      <span class="item-sub">${statusLabel(s.status)}</span>
    </div>`).join('');
}

function renderSources(items) {
  const container = document.getElementById('items-sources');
  document.getElementById('count-sources').textContent = items.length;

  if (!items.length) {
    container.innerHTML = '<div class="loading-row">No sources — Qdrant may not be reachable</div>';
    return;
  }

  // Sort by domain then ingestedAt desc
  const sorted = [...items].sort((a,b) => a.domain.localeCompare(b.domain));
  container.innerHTML = sorted.map(s => `
    <div class="tree-item" id="src-${esc(s.sourceId)}" data-search="${(s.domain+' '+(s.title||'')+' '+s.sourceUrl).toLowerCase()}"
      onclick="selectSource('${esc(s.sourceId)}')">
      <span class="item-icon">🔗</span>
      <span class="item-label">${esc(s.title || s.domain)}</span>
      <span class="item-sub">${esc(s.domain)}</span>
    </div>`).join('');
}

// ── Select handlers ───────────────────────────────────────────────────
function selectModule(key) {
  setSelected('mod', key);
  const m = allModules.find(x => x.key === key);
  if (!m) return;
  showDetail(`
    <div class="detail-header">
      <div class="detail-header-info">
        <div class="detail-title">${esc(m.name)}</div>
        <div class="detail-meta">
          <span class="chip chip-mod">Module</span>
          <span class="chip chip-neutral">${esc(m.category)}</span>
          <span class="chip chip-neutral">Read-only</span>
        </div>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-section">
        <div class="detail-section-title">Path</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-mid)">
          knowledge/layer1/modules/${esc(m.key)}
        </div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">Content</div>
        <div class="code-block">${esc(m.content)}</div>
      </div>
    </div>
  `);
}

async function selectSession(id) {
  setSelected('sess', id);
  const s = allSessions.find(x => x.id === id);
  if (!s) return;

  // Load content detail
  let contentHtml = '<div class="loading-row">Loading content…</div>';
  showDetail(buildSessionHtml(s, contentHtml));

  try {
    const detail = await fetch(`${API}/api/training/sessions/${id}`, { headers: HEADERS }).then(r => r.json());
    const items = detail.content || [];
    contentHtml = items.length ? items.map(c => `
      <div class="content-item">
        <div class="content-item-type">${esc(c.contentType || c.type || '?')}</div>
        <div class="content-item-body">
          ${c.fileName ? `<strong>${esc(c.fileName)}</strong>` : ''}
          ${c.textContent ? esc(c.textContent).substring(0, 200) + (c.textContent.length > 200 ? '…' : '') : ''}
          ${c.transcript ? `<em style="display:block;margin-top:4px;color:var(--text-dim)">Transcript: ${esc(c.transcript).substring(0,120)}…</em>` : ''}
        </div>
        <button class="content-item-del" title="Remove" onclick="deleteContentItem('${esc(id)}','${esc(c.id)}',this)">✕</button>
      </div>`).join('')
    : '<div style="color:var(--text-dim);font-size:12px;padding:4px 0">No content items</div>';
    showDetail(buildSessionHtml(s, `<div class="content-list">${contentHtml}</div>`));
  } catch(e) {
    showDetail(buildSessionHtml(s, `<div style="color:var(--text-dim);font-size:12px">Could not load content</div>`));
  }
}

function buildSessionHtml(s, contentHtml) {
  return `
    <div class="detail-header">
      <div class="detail-header-info">
        <div class="detail-title">${esc(s.topic || 'Untitled session')}</div>
        <div class="detail-meta">
          <span class="chip chip-train">Training</span>
          <span class="chip chip-neutral ${statusClass(s.status)}">${statusLabel(s.status)}</span>
          ${s.intent ? `<span class="chip chip-neutral">${esc(s.intent)}</span>` : ''}
          ${s.scope  ? `<span class="chip chip-neutral">${esc(s.scope)}</span>` : ''}
          <span class="chip chip-neutral">${fmtDate(s.updatedAt || s.createdAt)}</span>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn btn-danger" onclick="confirmDelete('training','${esc(s.id)}','${esc(s.topic||'this session')}')">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M6 2h4v1H6V2zM2 4h12v1H2V4zm2 2h8l-.8 9H4.8L4 6zm2 1v6h1V7H6zm3 0v6h1V7H9z"/></svg>
          Delete
        </button>
      </div>
    </div>
    <div class="detail-body">
      ${s.assetTypes ? `<div class="detail-section"><div class="detail-section-title">Asset types</div>
        <div style="font-size:12px;color:var(--text-mid)">${esc(s.assetTypes)}</div></div>` : ''}
      <div class="detail-section">
        <div class="detail-section-title">Content items</div>
        ${contentHtml}
      </div>
    </div>`;
}

async function selectSource(id) {
  setSelected('src', id);
  const s = allSources.find(x => x.sourceId === id);
  if (!s) return;

  showDetail(buildSourceHtml(s, '<div class="loading-row">Loading preview…</div>'));

  try {
    const detail = await fetch(`${API}/api/knowledge/sources/${id}`, { headers: HEADERS }).then(r => r.json());
    const preview = detail.firstChunk || '(no text content)';
    showDetail(buildSourceHtml(s, `
      <div class="text-block">${esc(preview)}</div>
      ${detail.chunkCount > 1 ? `<div style="font-size:11px;color:var(--text-dim);margin-top:6px">
        Showing chunk 1 of ${detail.chunkCount}</div>` : ''}
    `));
  } catch(e) {
    showDetail(buildSourceHtml(s, '<div style="color:var(--text-dim);font-size:12px">Could not load preview</div>'));
  }
}

function buildSourceHtml(s, previewHtml) {
  return `
    <div class="detail-header">
      <div class="detail-header-info">
        <div class="detail-title">${esc(s.title || s.domain)}</div>
        <div class="detail-meta">
          <span class="chip chip-src">Source</span>
          <span class="chip chip-neutral">${esc(s.domain)}</span>
          <span class="chip chip-neutral" style="font-variant-numeric:tabular-nums">${s.chunkCount} chunk${s.chunkCount!==1?'s':''}</span>
          ${s.ingestedAt ? `<span class="chip chip-neutral">${fmtDate(s.ingestedAt)}</span>` : ''}
        </div>
      </div>
      <div class="detail-actions">
        <a class="btn btn-ghost" href="${esc(s.sourceUrl)}" target="_blank" rel="noopener">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M7 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9"/><path d="M10 2h4v4"/><line x1="14" y1="2" x2="8" y2="8"/>
          </svg>
          Open
        </a>
        <button class="btn btn-danger" onclick="confirmDelete('source','${esc(s.sourceId)}','${esc(s.title||s.domain)}')">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M6 2h4v1H6V2zM2 4h12v1H2V4zm2 2h8l-.8 9H4.8L4 6zm2 1v6h1V7H6zm3 0v6h1V7H9z"/></svg>
          Delete
        </button>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-section">
        <div class="detail-section-title">URL</div>
        <a class="url-link" href="${esc(s.sourceUrl)}" target="_blank" rel="noopener">${esc(s.sourceUrl)}</a>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">Content preview</div>
        ${previewHtml}
      </div>
    </div>`;
}

// ── Delete flow ───────────────────────────────────────────────────────
function confirmDelete(type, id, label) {
  pendingDel = { type, id, label };
  document.getElementById('confirm-title').textContent = 'Delete ' + (type === 'training' ? 'training session' : 'source') + '?';
  document.getElementById('confirm-body').textContent =
    `"${label}" will be permanently removed from the knowledge base. This cannot be undone.`;
  document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
  pendingDel = null;
}

async function execDelete() {
  if (!pendingDel) return;
  const { type, id, label } = pendingDel;
  const btn = document.getElementById('confirm-ok');
  btn.disabled = true;
  btn.textContent = 'Deleting…';

  try {
    let url;
    if (type === 'training') url = `${API}/api/training/sessions/${id}`;
    else url = `${API}/api/knowledge/sources/${id}`;

    const res = await fetch(url, { method: 'DELETE', headers: HEADERS });
    if (!res.ok && res.status !== 204) throw new Error(`HTTP ${res.status}`);

    // Remove from state
    if (type === 'training') {
      allSessions = allSessions.filter(s => s.id !== id);
      renderSessions(allSessions);
    } else {
      allSources = allSources.filter(s => s.sourceId !== id);
      renderSources(allSources);
    }
    updateTotals();

    // Clear detail if deleted item was selected
    if (selected && selected.id === id) {
      selected = null;
      document.getElementById('detail').innerHTML =
        '<div class="detail-empty" id="detail-empty"><div class="detail-empty-icon">🗑</div><p>Item deleted</p></div>';
    }

    toast(`Deleted "${label}"`);
  } catch(e) {
    toast(`Delete failed: ${e.message}`, true);
  } finally {
    closeConfirm();
    btn.disabled = false;
    btn.textContent = 'Delete';
  }
}

async function deleteContentItem(sessionId, contentId, btn) {
  if (!confirm('Remove this content item?')) return;
  btn.disabled = true;
  try {
    await fetch(`${API}/api/training/sessions/${sessionId}/content/${contentId}`,
      { method: 'DELETE', headers: HEADERS });
    btn.closest('.content-item').remove();
    toast('Content item removed');
  } catch(e) {
    toast(`Failed: ${e.message}`, true);
    btn.disabled = false;
  }
}

// ── Search / filter ───────────────────────────────────────────────────
function filterAll(q) {
  const lq = q.trim().toLowerCase();
  filterSection('modules',  lq, 'mod-');
  filterSection('training', lq, 'sess-');
  filterSection('sources',  lq, 'src-');
}

function filterSection(section, q, prefix) {
  const container = document.getElementById(`items-${section}`);
  const items = container.querySelectorAll('.tree-item');
  let visible = 0;
  items.forEach(el => {
    const match = !q || (el.dataset.search || '').includes(q);
    el.classList.toggle('hidden', !match);
    if (match) visible++;
  });
  document.getElementById(`nores-${section}`).classList.toggle('visible', q && visible === 0);
}

// ── UI helpers ────────────────────────────────────────────────────────
function setSelected(type, id) {
  document.querySelectorAll('.tree-item.selected').forEach(el => el.classList.remove('selected'));
  const key = type === 'mod' ? `mod-${id}` : type === 'sess' ? `sess-${id}` : `src-${id}`;
  document.getElementById(key)?.classList.add('selected');
  selected = { type, id };
}

function showDetail(html) {
  document.getElementById('detail').innerHTML = html;
}

function toggleSection(name) {
  const head  = document.querySelector(`#section-${name} .section-head`);
  const items = document.getElementById(`items-${name}`);
  head.classList.toggle('open');
  items.classList.toggle('open');
}

function updateTotals() {
  const n = allModules.length + allSessions.length + allSources.length;
  document.getElementById('total-count').textContent =
    `${n.toLocaleString()} items`;
}

function statusLabel(s) {
  const m = { DRAFT:'Draft', PENDING_REVIEW:'Pending', INGESTED:'Ingested', REJECTED:'Rejected' };
  return m[s] || s || '?';
}
function statusClass(s) {
  const m = { DRAFT:'status-draft', PENDING_REVIEW:'status-pending', INGESTED:'status-ingested', REJECTED:'status-rejected' };
  return m[s] || 'status-draft';
}
function fmtDate(s) {
  if (!s) return '';
  try { return new Date(s).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
  catch(e) { return s.substring(0, 10); }
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => el.classList.remove('show'), 3000);
}
function toggleNavMenu(e) {
  e.stopPropagation();
  const m = document.getElementById('nav-menu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', () => {
  const m = document.getElementById('nav-menu');
  if (m) m.style.display = 'none';
});

function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  if (!cur) {
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  } else {
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  }
}
</script>
