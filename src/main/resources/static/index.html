<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .wrap {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }
  .mark {
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(32px, 6vw, 48px);
    line-height: 1.15;
    margin: 0 0 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  p.sub {
    color: #aaa;
    font-size: 17px;
    line-height: 1.6;
    margin: 0 0 40px;
  }
  form {
    display: flex;
    gap: 10px;
    max-width: 420px;
    margin: 0 auto;
  }
  input[type=email] {
    flex: 1;
    background: #161616;
    border: 1px solid #2c2c2c;
    color: #f2f2f2;
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 15px;
    outline: none;
  }
  input[type=email]:focus { border-color: #666; }
  input[type=email]::placeholder { color: #666; }
  button {
    background: #f2f2f2;
    color: #0a0a0a;
    border: none;
    border-radius: 8px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #d8d8d8; }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg {
    margin-top: 16px;
    font-size: 14px;
    min-height: 18px;
  }
  #msg.ok { color: #6fd08c; }
  #msg.err { color: #e07a7a; }
  @media (max-width: 480px) {
    form { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">GENESIS AI</div>
  <h1>We're building the AI creative director.</h1>
  <p class="sub">
    Genesis AI conducts brand discovery, directs specialist agents, and assembles
    complete brand identities — leave your email and we'll let you know the moment
    beta access opens.
  </p>
  <form id="signup-form">
    <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
    <button type="submit" id="submit-btn">Notify me</button>
  </form>
  <div id="msg"></div>
</div>

<script>
const form = document.getElementById('signup-form');
const emailInput = document.getElementById('email');
const btn = document.getElementById('submit-btn');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim();
  if (!email) return;

  btn.disabled = true;
  msg.className = '';
  msg.textContent = '';

  try {
    const res = await fetch('/api/waitlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (res.ok) {
      msg.className = 'ok';
      msg.textContent = data.message || "You're on the list.";
      emailInput.value = '';
    } else {
      msg.className = 'err';
      msg.textContent = data.error || 'Something went wrong. Please try again.';
    }
  } catch (err) {
    msg.className = 'err';
    msg.textContent = 'Something went wrong. Please try again.';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
