<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Genesis AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f6f6f4; color: #1a1a1a; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: 0.8px; margin-bottom: 32px; color: #999; }
  .card { background: #fff; border: 1px solid #eee; border-radius: 16px;
    padding: 40px 44px; width: 100%; max-width: 380px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.05); }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #999; margin-bottom: 28px; line-height: 1.5; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
  .field label { font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.3px; }
  .field input { padding: 11px 13px; border: 1px solid #ddd; border-radius: 9px;
    font-size: 14px; font-family: inherit; outline: none; }
  .field input:focus { border-color: #1a1a1a; }
  .err { font-size: 12px; color: #d33; min-height: 16px; margin-bottom: 4px; }
  .btn { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: none;
    border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background 0.15s; margin-top: 4px; }
  .btn:hover { background: #333; }
  .btn:disabled { background: #ccc; cursor: default; }
  .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #999; }
  .footer-link a { color: #1a1a1a; text-decoration: none; font-weight: 600; }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="brand">GENESIS AI</div>
<div class="card">
  <h1>Create account</h1>
  <div class="sub">Create an account to access your brand results and download your files when ready.</div>
  <div class="field"><label>Name</label><input id="name" type="text" placeholder="Your name" autocomplete="name"></div>
  <div class="field"><label>Email</label><input id="email" type="email" placeholder="your@email.com" autocomplete="email"></div>
  <div class="field"><label>Password</label><input id="password" type="password" placeholder="Min 8 characters" autocomplete="new-password"></div>
  <div class="err" id="err"></div>
  <button class="btn" id="btn" onclick="register()">Create account</button>
  <div class="footer-link">Already have an account? <a href="/login">Sign in</a></div>
</div>

<script>
const API     = '';
const KEY     = 'genesis-ai-key';
const HEADERS = { 'Content-Type': 'application/json', 'X-Api-Key': KEY };

const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';

document.addEventListener('keydown', e => { if (e.key === 'Enter') register(); });

async function register() {
  const name     = document.getElementById('name').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  document.getElementById('err').textContent = '';

  if (!name || !email || !password) {
    document.getElementById('err').textContent = 'Please fill in all fields.'; return;
  }
  if (password.length < 8) {
    document.getElementById('err').textContent = 'Password must be at least 8 characters.'; return;
  }

  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Creating account…';

  const res = await fetch(`${API}/api/auth/register`, {
    method: 'POST', headers: HEADERS,
    body: JSON.stringify({ name, email, password })
  }).then(r => r.json());

  if (res.error) {
    document.getElementById('err').textContent = res.error;
    btn.disabled = false; btn.textContent = 'Create account';
  } else {
    window.location.href = nextUrl;
  }
}
</script>
</body>
</html>
