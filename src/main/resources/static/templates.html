<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis AI — Templates</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #0a0b12; display: flex; height: 100vh; overflow: hidden; color: #f2f2f2; }

  /* ── Sidebar ── */
  #sidebar {
    width: 260px; min-width: 260px; background: #111; display: flex;
    flex-direction: column; border-right: 1px solid #222;
  }
  #sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid #222; position: relative; }
  .sidebar-logo { height: 22px; width: auto; display: block; margin-bottom: 4px; }
  #sidebar-header p  { color: #666; font-size: 11px; margin-top: 2px; }
  .mode-badge {
    display: inline-block; margin-top: 8px; padding: 3px 9px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: #6fe0a5; background: rgba(111,224,165,0.12); border: 1px solid rgba(111,224,165,0.3);
    border-radius: 20px;
  }

  /* ── Nav menu ── */
  #nav-toggle {
    position: absolute; top: 16px; right: 12px; width: 26px; height: 26px;
    background: none; border: none; color: #888; cursor: pointer;
    display: flex; align-items: center; justify-content: center; border-radius: 5px;
    transition: background 0.15s, color 0.15s;
  }
  #nav-toggle:hover { background: #1e1e1e; color: #fff; }
  #nav-menu {
    display: none; position: absolute; top: 100%; right: 12px; margin-top: 6px;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
    overflow: hidden; z-index: 20; min-width: 150px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #nav-menu.open { display: block; }
  #nav-menu .nav-item {
    display: block; padding: 9px 14px; font-size: 13px; color: #ccc;
    text-decoration: none; transition: background 0.15s, color 0.15s;
  }
  #nav-menu .nav-item:hover { background: #242424; color: #fff; }
  #nav-menu .nav-item.active {
    color: #fff; font-weight: 600; background: #222; pointer-events: none;
  }

  /* ── Sidebar list ── */
  #t-list { flex: 1; overflow-y: auto; padding: 8px 8px 12px; }
  #t-list::-webkit-scrollbar { width: 4px; }
  #t-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .t-item {
    padding: 9px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 2px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .t-item:hover { background: #1c1c1c; }
  .t-item.active { background: #222; }
  .t-meta { flex: 1; min-width: 0; }
  .t-name { color: #ccc; font-size: 13px; white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; }
  .t-item.active .t-name { color: #fff; }

  .pill {
    font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-top: 3px;
    display: inline-block; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .pill-current    { background: #1a3a2a; color: #4caf7d; }
  .pill-deprecated { background: #262626; color: #666; }

  /* ── Main ── */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #empty {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; color: rgba(255,255,255,0.35);
  }
  #empty svg { opacity: 0.25; }
  #empty h2  { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.5); }
  #empty p   { font-size: 14px; text-align: center; max-width: 360px; line-height: 1.5; }

  #detail { flex: 1; display: none; flex-direction: column; min-height: 0; overflow-y: auto; }

  /* ── Detail header ── */
  #detail-header { padding: 24px 28px 16px; border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0; }
  #detail-header h2 { font-size: 22px; font-weight: 700; color: #f2f2f2; }
  #desc-text { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 6px; line-height: 1.6; }

  /* ── Status bar ── */
  #status-bar {
    padding: 12px 28px; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.03);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0;
  }
  .status-pill {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .status-pill.st-current    { background: rgba(111,224,165,0.15); color: #6fe0a5; }
  .status-pill.st-deprecated { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.35); }
  #status-note { font-size: 12px; color: rgba(255,255,255,0.35); flex: 1; }

  .sbtn {
    padding: 6px 14px; border-radius: 7px; border: none; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background 0.15s; letter-spacing: 0.2px;
  }
  .sbtn-primary { background: rgba(255,255,255,0.9); color: #0a0b12; }
  .sbtn-primary:hover { background: #fff; }
  .sbtn-ghost { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.12); }
  .sbtn-ghost:hover { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); }
  .sbtn-danger { background: rgba(180,50,50,0.12); color: #e07070; border: 1px solid rgba(180,50,50,0.25); }
  .sbtn-danger:hover { background: rgba(180,50,50,0.22); border-color: rgba(180,50,50,0.4); }

  /* ── Meta grid ── */
  #meta-grid {
    padding: 20px 28px; border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .meta-block label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); text-transform: uppercase;
                      letter-spacing: 0.4px; display: block; margin-bottom: 4px; }
  .meta-block span  { font-size: 13px; color: rgba(255,255,255,0.8); font-family: monospace; word-break: break-all; }

  /* ── Section manifest ── */
  #sections-panel { padding: 20px 28px 32px; flex-shrink: 0; }
  #sections-panel h3 { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.8); margin-bottom: 14px; }

  .section-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .section-table th {
    text-align: left; padding: 7px 10px; background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.4);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .section-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
  .section-table tr:last-child td { border-bottom: none; }
  .section-table tr:hover td { background: rgba(255,255,255,0.03); }

  .s-id   { font-family: monospace; color: rgba(255,255,255,0.5); font-size: 12px; }
  .s-name { color: rgba(255,255,255,0.85); }
  .tag {
    display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px;
    border-radius: 4px; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .tag-required { background: rgba(36,120,168,0.2); color: #6ab4e0; }
  .tag-yes  { background: rgba(111,224,165,0.15); color: #6fe0a5; }
  .tag-no   { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.35); }

  /* ── Hints panel ── */
  #hints-panel { padding: 0 28px 32px; flex-shrink: 0; }
  #hints-panel h3 { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.8); margin-bottom: 12px; }
  #hints-json {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    padding: 14px 16px; font-family: monospace; font-size: 12px; color: rgba(255,255,255,0.75);
    white-space: pre-wrap; word-break: break-all; line-height: 1.6;
  }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 24px; right: 24px; padding: 10px 18px;
    background: #1a1a1a; color: #fff; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }

  /* ── API key block (hidden, used by fetch calls) ── */
  #api-key-block { display: none; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <a href="/dashboard"><img src="/logo.png" alt="Genesis" class="sidebar-logo"></a>

    <span class="mode-badge">Templates</span>
    <button id="nav-toggle" onclick="toggleNav()" aria-label="Navigation">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 2.5h12M1 7h12M1 11.5h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="nav-menu">
      <a href="/dashboard" class="nav-item">Dashboard</a>
      <a href="/dashboard/console"        class="nav-item">Consultant</a>
      <a href="/dashboard/training"       class="nav-item">Training</a>
      <a href="/dashboard/playground"     class="nav-item">Playground</a>
      <a href="/dashboard/questionnaires" class="nav-item">Questionnaires</a>
      <a href="/dashboard/templates"      class="nav-item active">Templates</a>
      <a href="/dashboard/knowledge"      class="nav-item">Knowledge</a>
    </div>
  </div>
  <div id="t-list"></div>
</div>

<div id="main">
  <div id="empty">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <rect x="6" y="4" width="28" height="32" rx="3" stroke="#ccc" stroke-width="1.5"/>
      <path d="M12 14h16M12 20h12M12 26h8" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h2>No template selected</h2>
    <p>Select a template from the sidebar to view its details and section manifest.</p>
  </div>

  <div id="detail">
    <div id="detail-header">
      <h2 id="t-name-heading"></h2>
      <p id="desc-text"></p>
    </div>

    <div id="status-bar">
      <span id="status-pill" class="status-pill"></span>
      <span id="status-note"></span>
      <button id="btn-set-current"     class="sbtn sbtn-primary" onclick="setCurrent()">Mark as Current</button>
      <button id="btn-set-deprecated"  class="sbtn sbtn-danger"  onclick="setDeprecated()">Deprecate</button>
    </div>

    <div id="meta-grid">
      <div class="meta-block">
        <label>Template ID</label>
        <span id="t-id-val"></span>
      </div>
      <div class="meta-block">
        <label>Classpath Path</label>
        <span id="t-path-val"></span>
      </div>
    </div>

    <div id="sections-panel">
      <h3>Section Manifest</h3>
      <table class="section-table">
        <thead>
          <tr>
            <th>Section ID</th>
            <th>Name</th>
            <th>Required</th>
            <th>Default Included</th>
          </tr>
        </thead>
        <tbody id="sections-body"></tbody>
      </table>
    </div>

    <div id="hints-panel">
      <h3>Selection Hints</h3>
      <pre id="hints-json"></pre>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const API = '/api/brand-book-templates';
  const KEY = 'genesis-ai-key';
  const HEADERS = { 'Content-Type': 'application/json', 'X-Api-Key': KEY };

  let templates = [];
  let selectedId = null;

  async function load() {
    try {
      const res = await fetch(API, { headers: HEADERS });
      if (!res.ok) throw new Error(res.status);
      templates = await res.json();
      renderList();
      if (templates.length) select(templates[0].id);
    } catch (e) {
      showToast('Failed to load templates: ' + e.message);
    }
  }

  function renderList() {
    const el = document.getElementById('t-list');
    el.innerHTML = templates.map(t => `
      <div class="t-item${t.id === selectedId ? ' active' : ''}" onclick="select('${t.id}')">
        <div class="t-meta">
          <div class="t-name">${esc(t.name)}</div>
          <span class="pill pill-${t.status.toLowerCase()}">${t.status}</span>
        </div>
      </div>
    `).join('');
  }

  function select(id) {
    selectedId = id;
    renderList();
    const t = templates.find(x => x.id === id);
    if (!t) return;

    document.getElementById('empty').style.display = 'none';
    const detail = document.getElementById('detail');
    detail.style.display = 'flex';

    document.getElementById('t-name-heading').textContent = t.name;
    document.getElementById('desc-text').textContent = t.description || '';
    document.getElementById('t-id-val').textContent = t.id;
    document.getElementById('t-path-val').textContent = t.classpathPath || '—';

    const pill    = document.getElementById('status-pill');
    const note    = document.getElementById('status-note');
    const btnCurr = document.getElementById('btn-set-current');
    const btnDepr = document.getElementById('btn-set-deprecated');

    if (t.status === 'CURRENT') {
      pill.className = 'status-pill st-current';
      pill.textContent = 'Current';
      note.textContent = 'This template is active and will be selected for new brand books.';
      btnCurr.style.display = 'none';
      btnDepr.style.display = '';
    } else {
      pill.className = 'status-pill st-deprecated';
      pill.textContent = 'Deprecated';
      note.textContent = 'This template is retired and will not be selected automatically.';
      btnCurr.style.display = '';
      btnDepr.style.display = 'none';
    }

    renderSections(t.sectionManifestJson);
    renderHints(t.selectionHintsJson);
  }

  function renderSections(json) {
    const tbody = document.getElementById('sections-body');
    if (!json) { tbody.innerHTML = '<tr><td colspan="4" style="color:#aaa;padding:12px 10px">No section manifest</td></tr>'; return; }
    try {
      const sections = JSON.parse(json);
      tbody.innerHTML = sections.map(s => `
        <tr>
          <td class="s-id">${esc(s.id)}</td>
          <td class="s-name">${esc(s.name)}</td>
          <td>${s.required ? '<span class="tag tag-required">Required</span>' : '<span class="tag tag-no">—</span>'}</td>
          <td>${s.defaultIncluded ? '<span class="tag tag-yes">Yes</span>' : '<span class="tag tag-no">No</span>'}</td>
        </tr>
      `).join('');
    } catch {
      tbody.innerHTML = '<tr><td colspan="4" style="color:#cc3333;padding:12px 10px">Invalid JSON</td></tr>';
    }
  }

  function renderHints(json) {
    const el = document.getElementById('hints-json');
    if (!json) { el.textContent = '—'; return; }
    try {
      el.textContent = JSON.stringify(JSON.parse(json), null, 2);
    } catch {
      el.textContent = json;
    }
  }

  async function setCurrent() {
    if (!selectedId) return;
    try {
      const res = await fetch(`${API}/${selectedId}/set-current`, { method: 'POST', headers: HEADERS });
      if (!res.ok) throw new Error(res.status);
      const updated = await res.json();
      updateLocal(updated);
      select(selectedId);
      showToast('Template marked as Current');
    } catch (e) {
      showToast('Error: ' + e.message);
    }
  }

  async function setDeprecated() {
    if (!selectedId) return;
    try {
      const res = await fetch(`${API}/${selectedId}/set-deprecated`, { method: 'POST', headers: HEADERS });
      if (!res.ok) throw new Error(res.status);
      const updated = await res.json();
      updateLocal(updated);
      select(selectedId);
      showToast('Template deprecated');
    } catch (e) {
      showToast('Error: ' + e.message);
    }
  }

  function updateLocal(t) {
    const idx = templates.findIndex(x => x.id === t.id);
    if (idx >= 0) templates[idx] = t;
    renderList();
  }

  function toggleNav() {
    document.getElementById('nav-menu').classList.toggle('open');
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('#sidebar-header')) {
      document.getElementById('nav-menu').classList.remove('open');
    }
  });

  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  load();
</script>
<script>
(async () => {
  try {
    const r = await fetch("/api/admin/env", { credentials: "include" });
    if (!r.ok) return;
    const { env } = await r.json();
    const col = { PRODUCTION: "#ef4444", QA: "#f59e0b", DEV: "#6b7280" }[env] || "#888";
    const el = document.createElement("div");
    el.id = "env-badge";
    el.style.cssText = "margin-top:auto;padding:10px 16px;border-top:1px solid #222;display:flex;align-items:center;gap:7px;flex-shrink:0";
    el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0"></span>`
      + `<span style="font-size:10px;font-weight:700;letter-spacing:0.5px;color:${col};text-transform:uppercase">${env}</span>`;
    const sb = document.getElementById("sidebar");
    if (sb) sb.appendChild(el);
  } catch {}
})();
</script>
</body>
</html>
