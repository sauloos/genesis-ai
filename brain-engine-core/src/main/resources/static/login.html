<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Genesis AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-body-bg: #f6f6f4;
    --theme-text-primary: #1a1a1a;
    --theme-text-muted: #999;
    --theme-text-label: #666;
    --theme-card-bg: #fff;
    --theme-card-border: #eee;
    --theme-card-shadow: rgba(0, 0, 0, 0.05);
    --theme-divider: #ddd;
    --theme-backdrop: none;
  }

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--theme-body-bg); color: var(--theme-text-primary); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: 0.8px; margin-bottom: 32px; color: var(--theme-text-muted); }
  .card { background: var(--theme-card-bg); border: 1px solid var(--theme-card-border); border-radius: 16px;
    padding: 40px 44px; width: 100%; max-width: 380px;
    backdrop-filter: var(--theme-backdrop); -webkit-backdrop-filter: var(--theme-backdrop);
    box-shadow: 0 2px 20px var(--theme-card-shadow); }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--theme-text-primary); }
  .sub { font-size: 13px; color: var(--theme-text-muted); margin-bottom: 28px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--theme-text-label); text-transform: uppercase; letter-spacing: 0.3px; }
  .field input { padding: 11px 13px; border: 1px solid var(--theme-divider); border-radius: 9px;
    font-size: 14px; font-family: inherit; outline: none; background: var(--theme-card-bg); color: var(--theme-text-primary); }
  .field input:focus { border-color: var(--theme-text-primary); }
  .err { font-size: 12px; color: #d33; min-height: 16px; margin-bottom: 4px; }
  .btn { width: 100%; padding: 12px; background: var(--theme-text-primary); color: var(--theme-body-bg); border: none;
    border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: opacity 0.15s; margin-top: 4px; }
  .btn:hover { opacity: 0.82; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--theme-text-muted); }
  .footer-link a { color: var(--theme-text-primary); text-decoration: none; font-weight: 600; }
  .footer-link a:hover { text-decoration: underline; }
</style>
<link rel="stylesheet" href="/api/themes/active/styles.css">
<!--PF_GOOGLE_INJECT-->
</head>
<body>
<div class="brand">GENESIS AI</div>
<div class="card">
  <h1>Sign in</h1>
  <div class="sub">Access your results</div>
  <div id="widget-mount"></div>
  <div class="footer-link">Don't have an account? <a id="register-link" href="/register">Create one</a></div>
</div>

<script type="module">
import { mountWidget } from '/widgets/loader.js';

const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';
if (nextUrl !== '/') {
  document.getElementById('register-link').href = '/register?next=' + encodeURIComponent(nextUrl);
}

mountWidget('login', document.getElementById('widget-mount'), { widgetType: 'login', config: { googleEnabled: true } }, {
  onOutcome: () => { window.location.href = nextUrl; }
});
</script>
</body>
</html>
