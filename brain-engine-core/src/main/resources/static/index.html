<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenesisOS</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-body-bg: #f6f6f4;
    --theme-text-primary: #1a1a1a;
    --theme-text-muted: #999;
    --theme-text-label: #666;
    --theme-card-bg: #fff;
    --theme-card-border: #eee;
    --theme-card-shadow: rgba(0, 0, 0, 0.05);
    --theme-divider: #ddd;
    --theme-backdrop: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--theme-body-bg); color: var(--theme-text-primary);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }

  .logo { height: 28px; margin-bottom: 28px; }
  .logo-fallback { font-size: 12px; font-weight: 800; letter-spacing: 0.8px; margin-bottom: 28px; color: var(--theme-text-muted); }

  .card {
    background: var(--theme-card-bg); border: 1px solid var(--theme-card-border);
    border-radius: 16px; padding: 44px 48px; width: 100%; max-width: 440px;
    text-align: center;
    backdrop-filter: var(--theme-backdrop); -webkit-backdrop-filter: var(--theme-backdrop);
    box-shadow: 0 2px 20px var(--theme-card-shadow);
  }

  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--theme-text-primary); }
  .sub { font-size: 14px; line-height: 1.5; color: var(--theme-text-muted); margin-bottom: 30px; }

  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: block; width: 100%; padding: 12px; border-radius: 9px; font-size: 14px;
    font-weight: 600; font-family: inherit; text-decoration: none; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.82; }
  .btn-primary { background: var(--theme-text-primary); color: var(--theme-body-bg); border: none; }
  .btn-secondary { background: transparent; color: var(--theme-text-primary); border: 1px solid var(--theme-divider); }

  .footer { margin-top: 28px; font-size: 12px; color: var(--theme-text-muted); }
</style>
<link rel="stylesheet" href="/api/themes/active/styles.css">
</head>
<body>
<img class="logo" src="/api/themes/active/logo" alt="GenesisOS" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
<div class="logo-fallback" id="logo-fallback" style="display:none;">GENESISOS</div>

<div class="card">
  <h1>Welcome to GenesisOS</h1>
  <div class="sub">The Brain Engine platform — a sector-agnostic reasoning core that each tenant configures for its own domain.</div>
  <div class="actions">
    <a class="btn btn-primary" href="/login">Sign in</a>
    <a class="btn btn-secondary" href="/dashboard">Admin console</a>
  </div>
</div>

<div class="footer">GenesisOS Platform</div>
</body>
</html>
