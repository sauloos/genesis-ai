<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenesisOS — Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-bg-image: url('/bg-earth.jpg');
    --theme-bg-transform: rotate(180deg);
    --theme-bg-overlay: rgba(0, 0, 10, 0.75);
    --theme-body-bg: #0a0b12;
    --theme-text-primary: #f2f2f2;
    --theme-text-muted: rgba(255, 255, 255, 0.5);
    --theme-text-label: rgba(255, 255, 255, 0.4);
    --theme-section-label: rgba(255, 255, 255, 0.28);
    --theme-card-bg: rgba(255, 255, 255, 0.05);
    --theme-card-bg-hover: rgba(255, 255, 255, 0.12);
    --theme-card-border: rgba(255, 255, 255, 0.1);
    --theme-card-icon-bg: rgba(255, 255, 255, 0.08);
    --theme-card-icon-border: rgba(255, 255, 255, 0.10);
    --theme-card-shadow: rgba(0, 0, 0, 0.3);
    --theme-divider: rgba(255, 255, 255, 0.07);
    --theme-backdrop: none;
    --theme-btn-color: rgba(255, 255, 255, 0.4);
    --theme-btn-border: rgba(255, 255, 255, 0.12);
    --theme-btn-color-hover: rgba(255, 255, 255, 0.75);
    --theme-btn-border-hover: rgba(255, 255, 255, 0.3);
    --theme-env-badge-bg: rgba(0, 0, 0, 0.4);
    --theme-env-badge-border: rgba(255, 255, 255, 0.08);
    --theme-link-color: rgba(255, 255, 255, 0.5);
    --theme-link-border: rgba(255, 255, 255, 0.18);
    --theme-link-color-hover: rgba(255, 255, 255, 0.85);
    --theme-link-border-hover: rgba(255, 255, 255, 0.4);
    --theme-go-color: rgba(255, 255, 255, 0.28);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    color: var(--theme-text-primary);
    background: var(--theme-body-bg);
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--theme-bg-image) var(--theme-bg-position, center center) / var(--theme-bg-size, cover) no-repeat;
    transform: var(--theme-bg-transform, none);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--theme-bg-overlay);
    z-index: -1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 24px 40px 0;
  }

  .logout-btn {
    font-size: 12px;
    color: var(--theme-btn-color);
    background: none;
    border: 1px solid var(--theme-btn-border);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.15s, border-color 0.15s;
  }
  .logout-btn:hover { color: var(--theme-btn-color-hover); border-color: var(--theme-btn-border-hover); }

  .hero {
    text-align: center;
    padding: 36px 24px 40px;
  }
  .hero-logo {
    height: 52px;
    width: auto;
    aspect-ratio: 805 / 220;
    display: block;
    margin: 0 auto 20px;
    background-color: var(--theme-text-primary, currentColor);
    -webkit-mask-image: url(/api/themes/active/logo);
    mask-image: url(/api/themes/active/logo);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
  }
  .hero-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--theme-text-label);
    margin-bottom: 10px;
  }
  .hero h1 {
    font-size: clamp(22px, 3.5vw, 32px);
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--theme-text-primary);
  }

  .grid-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .grid-wrap {
    --accent:        #7c9ef8;
    --accent-hover:  rgba(124,158,248,0.4);
    --accent-shadow: rgba(124,158,248,0.15);
    --accent-from:   #7c9ef8;
    --accent-to:     #5a7de8;
    --badge-bg:      rgba(124,158,248,0.12);
    --badge-border:  rgba(124,158,248,0.22);
  }

  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .feature-card {
    background: var(--theme-card-bg);
    border: 1px solid var(--theme-card-border);
    border-radius: 14px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 14px;
    backdrop-filter: var(--theme-backdrop);
    -webkit-backdrop-filter: var(--theme-backdrop);
    transition: background 0.18s, border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .feature-card:hover {
    background: var(--theme-card-bg-hover);
    border-color: var(--accent-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 32px var(--theme-card-shadow), 0 0 0 1px var(--accent-shadow);
  }
  .feature-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent-from), var(--accent-to));
    opacity: 0;
    transition: opacity 0.18s;
  }
  .feature-card:hover::after { opacity: 1; }

  .card-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--theme-card-icon-bg);
    border: 1px solid var(--theme-card-icon-border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-icon svg { width: 20px; height: 20px; stroke: var(--theme-text-primary); }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--theme-text-primary);
    margin-bottom: 5px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--theme-text-muted);
    line-height: 1.55;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .card-badges {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--badge-bg);
    color: var(--accent);
    border: 1px solid var(--badge-border);
  }
  .prov-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 2px 7px 2px 6px;
    border-radius: 4px;
  }
  .prov-badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .prov-core { background: rgba(148,163,184,0.12); border: 1px solid rgba(148,163,184,0.25); color: #94a3b8; }
  .prov-core .dot { background: #94a3b8; }
  .prov-customised { background: rgba(167,139,250,0.14); border: 1px solid rgba(167,139,250,0.32); color: #a78bfa; }
  .prov-customised .dot { background: #a78bfa; }
  .card-go {
    color: var(--theme-go-color);
    transition: color 0.15s, transform 0.15s;
  }
  .feature-card:hover .card-go { color: var(--accent); transform: translateX(3px); }

  .return-link {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--theme-link-color);
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--theme-link-border);
    border-radius: 5px;
    padding: 4px 12px;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .return-link:hover { color: var(--theme-link-color-hover); border-color: var(--theme-link-border-hover); }

  #env-badge {
    position: fixed;
    bottom: 20px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--theme-env-badge-bg);
    border: 1px solid var(--theme-env-badge-border);
    border-radius: 20px;
    padding: 5px 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  @media (max-width: 480px) {
    header { padding: 20px 16px 0; }
    .hero { padding: 32px 16px 28px; }
    .grid-wrap { padding: 0 12px 48px; }
  }
</style>
<link rel="stylesheet" href="/api/themes/active/styles.css">
</head>
<body>

<header>
  <a href="/" class="logout-btn">Sign out</a>
</header>

<div class="hero">
  <div class="hero-logo" role="img" aria-label="GenesisOS"></div>
  <div class="hero-label">Admin</div>
  <h1>Brain Engine Platform</h1>
</div>

<div class="grid-wrap">
  <div class="feature-grid" id="card-grid">
    <div style="padding:12px 4px;color:var(--theme-text-muted);font-size:12px;">Loading…</div>
  </div>
</div>

<a href="/" class="return-link">Return to landing page</a>

<script>
(async () => {
  try {
    const r = await fetch("/api/admin/env", { credentials: "include" });
    if (!r.ok) return;
    const { env } = await r.json();
    const col = { PRODUCTION: "#ef4444", QA: "#f59e0b", DEV: "#6b7280" }[env] || "#888";
    const el = document.getElementById("env-badge") || document.createElement("div");
    el.id = "env-badge";
    el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block"></span>`
      + `<span style="font-size:10px;font-weight:700;letter-spacing:0.5px;color:${col};text-transform:uppercase">${env}</span>`;
    if (!el.parentNode) document.body.appendChild(el);
  } catch {}
})();
</script>
<script>
  // Every dashboard card — core platform pages and tenant AdminNavExtensions alike —
  // comes from one endpoint now, each carrying its own Live + Core/Customised
  // provenance flag, so the page no longer needs a separate "Platform" vs
  // "Extensions" grouping: it's a single flat grid.
  const CARD_ICONS = {
    consultant: '<path d="M3 3h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H13l-4 3v-3H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M7 8h8M7 11h5"/>',
    knowledge: '<ellipse cx="11" cy="6" rx="7" ry="3"/><path d="M4 6v4c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M4 10v4c0 1.66 3.13 3 7 3s7-1.34 7-3v-4"/>',
    training: '<path d="M11 2L2 7l9 5 9-5-9-5Z"/><path d="M2 7v6l9 5 9-5V7"/>',
    questionnaires: '<rect x="4" y="2" width="14" height="18" rx="2"/><path d="M8 7h6M8 11h6M8 15h4"/>',
    themes: '<circle cx="11" cy="11" r="8"/><path d="M11 3v16M3 11h16"/><path d="M5.1 5.1l11.8 11.8M16.9 5.1L5.1 16.9"/>',
    agents: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="12" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="12" width="7" height="7" rx="1.5"/><rect x="12" y="12" width="7" height="7" rx="1.5"/>',
    'page-flows': '<rect x="2" y="9" width="6" height="6" rx="1.5"/><rect x="14" y="2" width="6" height="6" rx="1.5"/><rect x="14" y="16" width="6" height="6" rx="1.5"/><path d="M8 12h4v-6h2M12 12h2v6"/>',
    generic: '<rect x="4" y="4" width="14" height="14" rx="2"/><path d="M8 11h6"/>',
  };

  function cardEl(card) {
    const a = document.createElement("a");
    a.href = card.path;
    a.className = "feature-card";
    const provClass = card.core ? "prov-core" : "prov-customised";
    const provLabel = card.core ? "Core" : "Customised";
    a.innerHTML = `
      <div class="card-icon">
        <svg viewBox="0 0 22 22" fill="none" stroke-width="1.6">${CARD_ICONS[card.icon] || CARD_ICONS.generic}</svg>
      </div>
      <div>
        <div class="card-title"></div>
        <div class="card-desc"></div>
      </div>
      <div class="card-footer">
        <div class="card-badges">
          <span class="card-badge">${card.live ? "Live" : "Off"}</span>
          <span class="prov-badge ${provClass}"><span class="dot"></span>${provLabel}</span>
        </div>
        <svg class="card-go" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8h10M9 4l4 4-4 4"/>
        </svg>
      </div>`;
    a.querySelector(".card-title").textContent = card.label;
    a.querySelector(".card-desc").textContent = card.description;
    return a;
  }

  (async () => {
    const grid = document.getElementById("card-grid");
    try {
      const r = await fetch("/api/admin/dashboard-cards", { credentials: "include" });
      if (!r.ok) throw new Error("dashboard-cards fetch failed");
      const cards = await r.json();
      grid.innerHTML = "";
      cards.forEach(card => grid.appendChild(cardEl(card)));
    } catch {
      grid.innerHTML = '<div style="padding:12px 4px;color:var(--theme-text-muted);font-size:12px;">Couldn\'t load capabilities.</div>';
    }
  })();
</script>
</body>
</html>
