<!DOCTYPE html>
<html lang="en">
<head>
<!--PF_SLUG_INJECT-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-bg-image: none;
    --theme-bg-overlay: transparent;
    --theme-body-bg: #fafafa;
    --theme-text-primary: #1a1a1a;
    --theme-text-muted: #777;
    --theme-card-bg: #fff;
    --theme-card-border: #eee;
    --theme-card-shadow: rgba(0,0,0,0.04);
    --theme-backdrop: none;
    --theme-btn-border: #ddd;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; color: var(--theme-text-primary); background: var(--theme-body-bg);
    display: flex; flex-direction: column; align-items: center; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: var(--theme-bg-image) var(--theme-bg-position, center center) / var(--theme-bg-size, cover) no-repeat;
    transform: var(--theme-bg-transform, none); z-index: -2;
  }
  body::after { content: ''; position: fixed; inset: 0; background: var(--theme-bg-overlay); z-index: -1; }

  #card {
    display: none;
    width: 100%; max-width: 640px; margin: 60px auto; background: var(--theme-card-bg);
    border: 1px solid var(--theme-card-border); border-radius: 16px; padding: 40px 44px;
    box-shadow: 0 2px 20px var(--theme-card-shadow); backdrop-filter: var(--theme-backdrop);
  }

  #card.full-bleed {
    max-width: 100%; width: 100%; min-height: 100vh; margin: 0;
    border: none; border-radius: 0; padding: 0; box-shadow: none; backdrop-filter: none;
  }

  #card.no-border { border: none; box-shadow: none; }

  #page-grid { display: grid; gap: 24px; }
  #card.full-bleed #page-grid { gap: 0; height: 100%; min-height: 100vh; }
  .slot { display: flex; flex-direction: column; gap: 16px; }
  #card.full-bleed .slot { gap: 0; height: 100%; }

  .widget-content h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; line-height: 1.35; color: var(--theme-text-primary); }
  .widget-content p { font-size: 14px; color: var(--theme-text-muted); line-height: 1.6; white-space: pre-wrap; }
  .widget-content-image { max-width: 100%; display: block; object-fit: contain; }
  .widget-content-iframe { width: 100%; min-height: 400px; border: 0; display: block; }

  .widget-question label.q-prompt { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--theme-text-primary); }
  .widget-question .q-help { font-size: 12px; color: var(--theme-text-muted); margin-bottom: 10px; }
  .widget-question input[type="text"], .widget-question textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--theme-btn-border); border-radius: 8px;
    font-size: 14px; font-family: inherit; resize: vertical; background: transparent; color: var(--theme-text-primary);
  }
  .widget-question .q-choices { display: flex; flex-direction: column; gap: 8px; }
  .widget-question .q-choice { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--theme-text-primary); }

  .widget-questionnaire {
    border: 1px solid var(--theme-card-border); border-radius: 12px; padding: 24px;
  }
  .q-embed-status { font-size: 13px; color: var(--theme-text-muted); }
  .q-embed-progress { font-size: 11px; color: var(--theme-text-muted); text-transform: uppercase; letter-spacing: 0.5px;
    font-weight: 600; margin-bottom: 10px; }
  .q-embed-prompt { font-size: 16px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; color: var(--theme-text-primary); }
  .q-embed-help { font-size: 12px; color: var(--theme-text-muted); margin-bottom: 16px; line-height: 1.5; }
  .q-embed-body { min-height: 60px; }
  .q-embed-text-row { display: flex; gap: 8px; align-items: flex-start; }
  .q-embed-text-row input[type="text"], .q-embed-text-row textarea {
    flex: 1; padding: 10px 12px; border: 1px solid var(--theme-btn-border); border-radius: 8px;
    font-size: 14px; font-family: inherit; resize: vertical; background: transparent; color: var(--theme-text-primary);
  }
  .q-embed-text-row textarea { min-height: 90px; line-height: 1.5; }
  .q-embed-mic-btn {
    width: 38px; height: 38px; flex-shrink: 0; border-radius: 8px; border: 1px solid var(--theme-btn-border);
    background: transparent; color: var(--theme-text-primary); cursor: pointer; font-size: 14px;
  }
  .q-embed-mic-btn.recording { background: #fdeaea; border-color: #e88; color: #1a1a1a; }
  .q-embed-voice-status { font-size: 12px; color: var(--theme-text-muted); margin-top: 6px; min-height: 14px; }
  .q-embed-dropzone {
    border: 2px dashed var(--theme-btn-border); border-radius: 10px; padding: 24px; text-align: center;
    cursor: pointer; color: var(--theme-text-muted); font-size: 13px;
  }
  .q-embed-image-preview { max-width: 100%; max-height: 200px; border-radius: 8px; display: block; margin: 0 auto 10px; }
  .q-embed-slider-wrap { padding: 12px 4px 0; }
  .q-embed-slider-wrap input[type="range"] { width: 100%; accent-color: var(--theme-text-primary); }
  .q-embed-slider-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--theme-text-muted); margin-top: 6px; }
  .q-embed-slider-value { text-align: center; font-size: 22px; font-weight: 700; margin-top: 10px; font-variant-numeric: tabular-nums; color: var(--theme-text-primary); }
  .q-embed-choice-list { display: flex; flex-direction: column; gap: 8px; }
  .q-embed-choice-btn {
    text-align: left; padding: 11px 14px; border: 1px solid var(--theme-btn-border); border-radius: 8px;
    background: transparent; font-size: 14px; color: var(--theme-text-primary); cursor: pointer; font-family: inherit;
  }
  .q-embed-choice-btn.selected { background: var(--theme-text-primary); color: var(--theme-body-bg); border-color: var(--theme-text-primary); }
  .q-embed-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .q-embed-nav-btn {
    padding: 9px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .q-embed-nav-primary { background: var(--theme-text-primary); color: var(--theme-body-bg); }
  .q-embed-nav-primary:disabled { background: var(--theme-btn-border); color: var(--theme-text-muted); cursor: default; }
  .q-embed-nav-ghost { background: none; color: var(--theme-text-muted); }
  .q-embed-nav-ghost:disabled { opacity: 0.3; cursor: default; }
  .q-embed-done { font-size: 14px; color: var(--theme-text-primary); font-weight: 600; }

  .widget-page-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 32px; flex-wrap: wrap; }
  .page-nav-left, .page-nav-right { display: flex; gap: 10px; flex-wrap: wrap; }
  .page-nav-right { margin-left: auto; }
  .outcome-btn {
    padding: 11px 22px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s; font-family: inherit;
    background: var(--theme-text-primary); color: var(--theme-body-bg);
  }
  .outcome-btn:hover { opacity: 0.85; }
  .outcome-btn:disabled { background: var(--theme-btn-border); color: var(--theme-text-muted); cursor: default; opacity: 1; }
  .outcome-btn-back { background: none; border: 1px solid var(--theme-btn-border); color: var(--theme-text-muted); }
  .outcome-btn-back:hover { color: var(--theme-text-primary); border-color: var(--theme-text-primary); opacity: 1; }

  .widget-header-hero { text-align: center; padding: 8px 4px 28px; }
  .widget-header-hero-logo {
    height: 40px; width: auto; aspect-ratio: 805 / 220; display: block; margin: 0 auto 16px;
    background-color: var(--theme-text-primary, currentColor);
    -webkit-mask-image: url(/api/themes/active/logo); mask-image: url(/api/themes/active/logo);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }
  .widget-header-hero-label {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--theme-text-label); margin-bottom: 8px;
  }
  .widget-header-hero h1 { font-size: clamp(20px, 3.5vw, 28px); font-weight: 600; letter-spacing: -0.3px; color: var(--theme-text-primary); }

  #state-screen {
    width: 100%; max-width: 640px; margin: 80px auto; text-align: center;
    display: none; flex-direction: column; align-items: center; gap: 10px;
  }
  #state-screen h2 { font-size: 20px; color: var(--theme-text-primary); }
  #state-screen p { font-size: 14px; color: var(--theme-text-muted); max-width: 400px; }

  #register-screen { display: none; width: 100%; max-width: 640px; margin: 60px auto; }
  #register-screen .reg-card {
    background: var(--theme-card-bg); border: 1px solid var(--theme-card-border); border-radius: 16px;
    padding: 40px 44px; box-shadow: 0 2px 20px var(--theme-card-shadow); backdrop-filter: var(--theme-backdrop);
  }
  #register-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--theme-text-primary); }
  #register-screen > .reg-card > p { font-size: 13px; color: var(--theme-text-muted); margin-bottom: 28px; line-height: 1.5; }
  .reg-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .reg-field label { font-size: 11px; font-weight: 600; color: var(--theme-text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
  .reg-field input {
    padding: 11px 13px; border: 1px solid var(--theme-btn-border); border-radius: 9px; font-size: 14px;
    font-family: inherit; outline: none; background: transparent; color: var(--theme-text-primary);
  }
  #reg-err { font-size: 12px; color: #d33; min-height: 16px; margin-bottom: 8px; }
  #reg-btn {
    width: 100%; padding: 12px; background: var(--theme-text-primary); color: var(--theme-body-bg);
    border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .reg-login-row { text-align: center; margin-top: 16px; font-size: 12px; color: var(--theme-text-muted); }
  .reg-login-row a { color: var(--theme-text-primary); text-decoration: none; font-weight: 600; }

  .widget-login { display: flex; flex-direction: column; }
  .wl-tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--theme-card-border); }
  .wl-tab {
    flex: 1; padding: 10px; border: none; background: none; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 600; color: var(--theme-text-muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .wl-tab.active { color: var(--theme-text-primary); border-bottom-color: var(--theme-text-primary); }
  .wl-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .wl-field label { font-size: 11px; font-weight: 600; color: var(--theme-text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
  .wl-field input {
    padding: 11px 13px; border: 1px solid var(--theme-btn-border); border-radius: 9px; font-size: 14px;
    font-family: inherit; outline: none; background: transparent; color: var(--theme-text-primary);
  }
  .wl-err { font-size: 12px; color: #d33; min-height: 16px; margin-bottom: 4px; }
  .wl-submit-btn {
    width: 100%; padding: 12px; background: var(--theme-text-primary); color: var(--theme-body-bg);
    border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .wl-submit-btn:disabled { opacity: 0.6; cursor: default; }
  .wl-divider {
    display: flex; align-items: center; gap: 10px; margin: 18px 0; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px; color: var(--theme-text-muted);
  }
  .wl-divider::before, .wl-divider::after { content: ''; flex: 1; height: 1px; background: var(--theme-card-border); }
  .wl-google-btn { display: flex; justify-content: center; }

  .widget-logout { display: flex; justify-content: flex-end; }
  .logout-btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--theme-btn-border);
    background: none; color: var(--theme-text-muted); font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .logout-btn:hover { color: var(--theme-text-primary); border-color: var(--theme-text-primary); }
  .logout-btn:disabled { opacity: 0.5; cursor: default; }

  .widget-product-options { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .po-heading { font-size: 18px; font-weight: 700; margin-bottom: 18px; color: var(--theme-text-primary); }
  .po-cards {
    width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
  }
  .po-card {
    display: flex; flex-direction: column; align-items: stretch; gap: 8px; text-align: left;
    border: 1px solid var(--theme-card-border); border-radius: 12px; padding: 18px;
    cursor: pointer; background: none; font-family: inherit; transition: border-color 0.15s;
  }
  .po-card:hover { border-color: var(--theme-text-muted); }
  .po-card.selected { border-color: var(--theme-text-primary); border-width: 2px; padding: 17px; }
  .po-name { font-size: 14px; font-weight: 700; color: var(--theme-text-primary); }
  .po-price { font-size: 22px; font-weight: 700; color: var(--theme-text-primary); }
  .po-price .po-interval { font-size: 12px; font-weight: 500; color: var(--theme-text-muted); }
  .po-desc { font-size: 12px; color: var(--theme-text-muted); line-height: 1.4; }
  .po-features { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--theme-text-muted); }
  .po-features li::before { content: '✓ '; color: var(--theme-text-primary); }
  .po-select-btn {
    margin-top: 8px; padding: 9px; border-radius: 9px; border: 1px solid var(--theme-btn-border);
    background: none; color: var(--theme-text-primary); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .po-card.selected .po-select-btn { background: var(--theme-text-primary); color: var(--theme-body-bg); border-color: var(--theme-text-primary); }
  .po-error { font-size: 13px; color: #d33; }
  .po-continue-btn {
    margin-top: 22px; padding: 12px 28px; border-radius: 9px; border: none;
    background: var(--theme-text-primary); color: var(--theme-body-bg);
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .po-continue-btn:disabled { opacity: 0.5; cursor: default; }

  .widget-payment { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .pay-heading { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--theme-text-primary); }
  .pay-summary {
    width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 4px;
    border: 1px solid var(--theme-card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .pay-summary-product { font-size: 13px; color: var(--theme-text-muted); }
  .pay-summary-option { font-size: 15px; font-weight: 700; color: var(--theme-text-primary); }
  .pay-summary-price { font-size: 22px; font-weight: 700; color: var(--theme-text-primary); }
  .pay-summary-price .pay-interval { font-size: 12px; font-weight: 500; color: var(--theme-text-muted); }
  .pay-btn {
    padding: 12px 28px; border-radius: 9px; border: none;
    background: var(--theme-text-primary); color: var(--theme-body-bg);
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .pay-btn:disabled { opacity: 0.6; cursor: default; }
  .pay-mode-note { font-size: 11px; color: var(--theme-text-muted); margin-top: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
  .pay-error { font-size: 13px; color: #d33; margin-top: 10px; }
  .pay-success { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pay-success-icon { font-size: 30px; color: var(--theme-text-primary); }
  .pay-success-text { font-size: 14px; font-weight: 700; color: var(--theme-text-primary); }
  .pay-success-sub { font-size: 12px; color: var(--theme-text-muted); }

  .widget-brand-results { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .br-heading { font-size: 18px; font-weight: 700; margin-bottom: 18px; color: var(--theme-text-primary); }
  .br-spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid var(--theme-btn-border); border-top-color: var(--theme-text-primary);
    animation: br-spin 0.8s linear infinite; margin-bottom: 14px;
  }
  @keyframes br-spin { to { transform: rotate(360deg); } }
  .br-status { font-size: 13px; color: var(--theme-text-muted); max-width: 380px; line-height: 1.5; }
  .br-error { font-size: 13px; color: #d33; max-width: 380px; line-height: 1.5; margin-bottom: 14px; }
  .br-retry-btn {
    padding: 10px 20px; border-radius: 9px; border: 1px solid var(--theme-btn-border);
    background: none; color: var(--theme-text-primary); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .br-cards {
    width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px; margin-top: 6px;
  }
  .br-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    border: 1px solid var(--theme-card-border); border-radius: 12px; padding: 14px;
  }
  .br-card-img { width: 100%; border-radius: 6px; display: block; object-fit: cover; }
  .br-card-label { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; color: var(--theme-text-primary); }
  .br-card-tagline { font-size: 12px; color: var(--theme-text-muted); line-height: 1.4; }
  .br-choose-btn {
    width: 100%; margin-top: 4px; padding: 10px; border-radius: 9px; border: none;
    background: var(--theme-text-primary); color: var(--theme-body-bg);
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .br-choose-btn:disabled { opacity: 0.5; cursor: default; }
  .br-note { font-size: 12px; color: var(--theme-text-muted); margin-top: 18px; }

  #sim-badge {
    display: none;
    position: fixed; top: 16px; left: 16px; z-index: 9999;
    align-items: center; gap: 7px;
    background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px; padding: 5px 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #sim-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; flex-shrink: 0; }
  #sim-badge span.label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; color: #a78bfa; text-transform: uppercase; }
</style>
<!--PF_THEME_INJECT-->
</head>
<body>

<div id="sim-badge"><span class="dot"></span><span class="label">Simulated</span></div>

<div id="card">
  <div id="page-grid"></div>
</div>

<div id="state-screen">
  <h2 id="state-title"></h2>
  <p id="state-message"></p>
</div>

<!-- Registration step shown after a flow ends via endAction=CREATE_ENGAGEMENT -->
<div id="register-screen">
  <div class="reg-card">
    <h2>One last step</h2>
    <p>Create an account to see your brand results and download your files when they're ready.</p>
    <div class="reg-field">
      <label>Name</label>
      <input id="reg-name" type="text" placeholder="Your name">
    </div>
    <div class="reg-field">
      <label>Email</label>
      <input id="reg-email" type="email" placeholder="your@email.com">
    </div>
    <div class="reg-field">
      <label>Password</label>
      <input id="reg-password" type="password" placeholder="Min 8 characters">
    </div>
    <div id="reg-err"></div>
    <button id="reg-btn" onclick="submitRegistration()">See my brand results →</button>
    <div class="reg-login-row">
      Already have an account? <a id="reg-login-link" href="/login">Sign in</a>
    </div>
  </div>
</div>

<script>
const API     = '';
const KEY     = 'genesis-ai-key';
const HEADERS = { 'Content-Type': 'application/json', 'X-Api-Key': KEY };

let slug = null;
let rootPrefix = null;
let token = null;
let layouts = [];
let requiredPending = new Set();
let currentPageOutcomes = [];
let currentPageWidgets = [];
let questionnaireStates = {};

// Simulate mode: an admin previewing a (possibly draft, never-live) PageFlow from
// page-flows.html/playground.html, embedded here via an iframe with ?simulate=1&pageFlowId=.
// Every session it starts is a real FlowSession row flagged simulated=true server-side
// (see FlowSessionController/PublicFlowRuntimeService) — this only swaps which API base
// this page talks to and skips the slug/localStorage machinery a real visitor needs.
let simulate = false;
let pageFlowId = null;
function fsBase() { return simulate ? '/api/admin/flow-sessions' : '/api/public/flow-sessions'; }

function parseChoices(json) {
  try {
    const arr = JSON.parse(json || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function isRequired(config) {
  return config.required === true || config.required === 'true';
}

function widgetConfigBool(value, defaultVal) {
  if (value === undefined || value === null || value === '') return defaultVal;
  return value === true || value === 'true';
}

async function saveAnswer(widgetId, value, required) {
  const patch = {};
  patch[widgetId] = value;
  try {
    await fetch(`${API}${fsBase()}/${token}/context`, {
      method: 'PUT', headers: HEADERS, credentials: simulate ? 'include' : 'same-origin',
      body: JSON.stringify({ contextPatchJson: JSON.stringify(patch) })
    });
  } catch (e) { /* best effort — outcome gating below only reflects local state */ }

  const hasValue = Array.isArray(value) ? value.length > 0 : !!(value && String(value).trim());
  if (hasValue) {
    requiredPending.delete(widgetId);
  } else if (required) {
    requiredPending.add(widgetId);
  }
  updateOutcomeButtons();
}

function updateOutcomeButtons() {
  document.querySelectorAll('.outcome-btn').forEach(b => b.disabled = requiredPending.size > 0);
}

async function putContext(key, value) {
  const patch = {};
  patch[key] = value;
  try {
    await fetch(`${API}${fsBase()}/${token}/context`, {
      method: 'PUT', headers: HEADERS, credentials: simulate ? 'include' : 'same-origin',
      body: JSON.stringify({ contextPatchJson: JSON.stringify(patch) })
    });
  } catch (e) { /* best effort — outcome gating below only reflects local state */ }
}

function applyBoundaries(el, config) {
  if (config.widthMode === 'percent' && config.width) el.style.width = config.width + '%';
  else if (config.widthMode === 'fixed' && config.width) el.style.width = config.width + 'px';
  if (config.heightMode === 'percent' && config.height) el.style.height = config.height + '%';
  else if (config.heightMode === 'fixed' && config.height) el.style.height = config.height + 'px';
}

const widgetRegistry = {
  content: (w) => {
    const mode = w.config.contentMode || 'text';
    let el;
    if (mode === 'html') {
      el = document.createElement('div');
      el.className = 'widget-content';
      el.innerHTML = w.config.html || '';
    } else if (mode === 'image') {
      el = document.createElement('img');
      el.className = 'widget-content-image';
      el.src = w.config.imageUrl || '';
      el.alt = w.config.imageAlt || '';
    } else if (mode === 'header') {
      el = document.createElement('div');
      el.className = 'widget-header-hero';
      const logo = document.createElement('div');
      logo.className = 'widget-header-hero-logo';
      logo.setAttribute('role', 'img');
      logo.setAttribute('aria-label', w.config.heading || 'Genesis Brands');
      el.appendChild(logo);
      if (w.config.label) {
        const label = document.createElement('div');
        label.className = 'widget-header-hero-label';
        label.textContent = w.config.label;
        el.appendChild(label);
      }
      const h1 = document.createElement('h1');
      h1.textContent = w.config.heading || '';
      el.appendChild(h1);
    } else if (mode === 'htmlFile') {
      el = document.createElement('iframe');
      el.className = 'widget-content-iframe';
      el.src = w.config.htmlFileUrl || '';
      // allow-top-navigation lets an embedded full page's own internal links (e.g. a
      // "Sign in" link meant to leave the landing page) navigate the real top-level tab
      // instead of getting stuck loading inside the iframe — matches how the same HTML
      // behaved when served directly, before it was wrapped in a Content widget.
      el.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation');
      el.setAttribute('frameborder', '0');
    } else {
      el = document.createElement('div');
      el.className = 'widget-content';
      const h = document.createElement('h2');
      h.textContent = w.config.heading || '';
      const p = document.createElement('p');
      p.textContent = w.config.body || '';
      el.appendChild(h);
      el.appendChild(p);
    }
    applyBoundaries(el, w.config);
    return el;
  },
  question: (w) => {
    const div = document.createElement('div');
    div.className = 'widget-question';
    const required = isRequired(w.config);

    const label = document.createElement('label');
    label.className = 'q-prompt';
    label.textContent = w.config.prompt || '';
    label.htmlFor = 'q-' + w.id;
    div.appendChild(label);

    if (w.config.helpText) {
      const help = document.createElement('div');
      help.className = 'q-help';
      help.textContent = w.config.helpText;
      div.appendChild(help);
    }

    const questionType = w.config.questionType || 'short_text';
    if (required) requiredPending.add(w.id);

    if (questionType === 'long_text') {
      const ta = document.createElement('textarea');
      ta.id = 'q-' + w.id;
      ta.rows = 4;
      ta.onchange = () => saveAnswer(w.id, ta.value, required);
      div.appendChild(ta);
    } else if (questionType === 'single_select' || questionType === 'multi_select') {
      const wrap = document.createElement('div');
      wrap.className = 'q-choices';
      parseChoices(w.config.choicesJson).forEach((choice, i) => {
        const row = document.createElement('label');
        row.className = 'q-choice';
        const input = document.createElement('input');
        input.type = questionType === 'single_select' ? 'radio' : 'checkbox';
        input.name = 'q-' + w.id;
        input.id = 'q-' + w.id + '-' + i;
        input.value = choice;
        input.onchange = () => {
          if (questionType === 'single_select') {
            saveAnswer(w.id, choice, required);
          } else {
            const checked = Array.from(wrap.querySelectorAll('input:checked')).map(el => el.value);
            saveAnswer(w.id, checked, required);
          }
        };
        row.appendChild(input);
        row.appendChild(document.createTextNode(choice));
        wrap.appendChild(row);
      });
      div.appendChild(wrap);
    } else {
      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'q-' + w.id;
      input.onchange = () => saveAnswer(w.id, input.value, required);
      div.appendChild(input);
    }

    return div;
  },
  questionnaire: (w) => {
    const div = document.createElement('div');
    div.className = 'widget-questionnaire';
    requiredPending.add(w.id);
    bootQuestionnaireWidget(w, div);
    return div;
  },
  login: (w) => {
    const div = document.createElement('div');
    div.className = 'widget-login';
    requiredPending.add(w.id);
    bootLoginWidget(w, div);
    return div;
  },
  brandResults: (w) => {
    const div = document.createElement('div');
    div.className = 'widget-brand-results';
    requiredPending.add(w.id);
    bootBrandResultsWidget(w, div);
    return div;
  },
  logout: (w) => {
    const div = document.createElement('div');
    div.className = 'widget-logout';
    bootLogoutWidget(w, div);
    return div;
  },
  productOptions: (w) => {
    const div = document.createElement('div');
    div.className = 'widget-product-options';
    bootProductOptionsWidget(w, div);
    return div;
  },
  payment: (w) => {
    const div = document.createElement('div');
    div.id = 'payment-widget-' + w.id;
    div.className = 'widget-payment';
    bootPaymentWidget(w, div);
    return div;
  },
  pageNav: (w) => {
    const div = document.createElement('div');
    div.className = 'widget-page-nav';
    const backOutcome = currentPageOutcomes.find(o => o.key === 'back');
    const otherOutcomes = currentPageOutcomes.filter(o => o.key !== 'back');

    const left = document.createElement('div');
    left.className = 'page-nav-left';
    if (backOutcome) {
      const btn = document.createElement('button');
      btn.className = 'outcome-btn outcome-btn-back';
      btn.textContent = backOutcome.label;
      btn.onclick = () => advance(backOutcome.key);
      left.appendChild(btn);
    }
    div.appendChild(left);

    const right = document.createElement('div');
    right.className = 'page-nav-right';
    otherOutcomes.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'outcome-btn';
      btn.textContent = o.label;
      btn.onclick = () => advance(o.key);
      right.appendChild(btn);
    });
    div.appendChild(right);

    return div;
  }
};

function qid(state, suffix) { return 'qw-' + state.widgetId + '-' + suffix; }

function buildMicIcon() {
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', '14');
  svg.setAttribute('height', '14');
  svg.setAttribute('viewBox', '0 0 16 16');
  svg.setAttribute('fill', 'none');
  const rect = document.createElementNS(svgNS, 'rect');
  rect.setAttribute('x', '5');
  rect.setAttribute('y', '1');
  rect.setAttribute('width', '6');
  rect.setAttribute('height', '9');
  rect.setAttribute('rx', '3');
  rect.setAttribute('fill', 'currentColor');
  const path = document.createElementNS(svgNS, 'path');
  path.setAttribute('d', 'M3 7v1a5 5 0 0010 0V7M8 13v2');
  path.setAttribute('stroke', 'currentColor');
  path.setAttribute('stroke-width', '1.5');
  path.setAttribute('stroke-linecap', 'round');
  svg.appendChild(rect);
  svg.appendChild(path);
  return svg;
}

function renderQuestionnaireStatus(container, message) {
  container.innerHTML = '';
  const status = document.createElement('div');
  status.className = 'q-embed-status';
  status.textContent = message;
  container.appendChild(status);
}

function renderQuestionnaireDone(container) {
  container.innerHTML = '';
  const done = document.createElement('div');
  done.className = 'q-embed-done';
  done.textContent = '✓ Completed — thank you.';
  container.appendChild(done);
}

function bootQuestionnaireWidget(w, container) {
  const state = {
    widgetId: w.id, questionnaireId: w.config.questionnaireId, questions: [],
    responseId: null, index: 0, mediaRecorder: null, isRecording: false,
    pendingImageFile: null, answers: {}
  };
  questionnaireStates[w.id] = state;
  renderQuestionnaireStatus(container, 'Loading…');
  loadQuestionnaireWidget(w, container, state);
}

async function loadQuestionnaireWidget(w, container, state) {
  try {
    const detail = await fetch(`${API}/api/questionnaires/${state.questionnaireId}`, { headers: HEADERS }).then(r => r.json());
    state.questions = detail.questions || [];
    if (!state.questions.length) {
      requiredPending.delete(w.id);
      updateOutcomeButtons();
      renderQuestionnaireStatus(container, 'This questionnaire has no questions configured.');
      return;
    }
    const startRes = await fetch(`${API}/api/questionnaires/${state.questionnaireId}/responses${simulate ? '?simulated=true' : ''}`, {
      method: 'POST', headers: HEADERS
    }).then(r => r.json());
    state.responseId = startRes.id;
    await putContext('__questionnaireResponse:' + w.id, state.responseId);
    renderQuestionnaireStep(w, container, state);
  } catch (e) {
    requiredPending.delete(w.id);
    updateOutcomeButtons();
    renderQuestionnaireStatus(container, 'This questionnaire is not available right now.');
  }
}

function renderQuestionnaireStep(w, container, state) {
  container.innerHTML = '';
  const q = state.questions[state.index];

  const progress = document.createElement('div');
  progress.className = 'q-embed-progress';
  progress.textContent = 'Question ' + (state.index + 1) + ' of ' + state.questions.length;
  container.appendChild(progress);

  const prompt = document.createElement('div');
  prompt.className = 'q-embed-prompt';
  prompt.textContent = q.prompt + (q.required ? ' *' : '');
  container.appendChild(prompt);

  if (q.helpText) {
    const help = document.createElement('div');
    help.className = 'q-embed-help';
    help.textContent = q.helpText;
    container.appendChild(help);
  }

  const body = document.createElement('div');
  body.className = 'q-embed-body';
  container.appendChild(body);

  if (q.type === 'SHORT_TEXT' || q.type === 'LONG_TEXT') {
    renderQuestionnaireTextStep(w, body, q, state);
  } else if (q.type === 'IMAGE_UPLOAD') {
    renderQuestionnaireImageStep(body, q, state);
  } else if (q.type === 'SLIDER') {
    renderQuestionnaireSliderStep(body, q, state);
  } else if (q.type === 'SINGLE_SELECT' || q.type === 'MULTI_SELECT') {
    renderQuestionnaireChoiceStep(body, q, state);
  }

  appendQuestionnaireFooter(w, container, state);
}

function renderQuestionnaireTextStep(w, body, q, state) {
  const row = document.createElement('div');
  row.className = 'q-embed-text-row';

  const field = document.createElement(q.type === 'LONG_TEXT' ? 'textarea' : 'input');
  if (q.type !== 'LONG_TEXT') field.type = 'text';
  field.id = qid(state, 'text-field');
  field.value = state.answers[q.id] || '';
  row.appendChild(field);

  if (q.allowVoice) {
    const micBtn = document.createElement('button');
    micBtn.type = 'button';
    micBtn.className = 'q-embed-mic-btn';
    micBtn.id = qid(state, 'mic-btn');
    micBtn.title = 'Record answer';
    micBtn.appendChild(buildMicIcon());
    micBtn.onclick = () => toggleQuestionnaireRecording(state);
    row.appendChild(micBtn);
  }
  body.appendChild(row);

  if (q.allowVoice) {
    const status = document.createElement('div');
    status.className = 'q-embed-voice-status';
    status.id = qid(state, 'voice-status');
    body.appendChild(status);
  }
}

function renderQuestionnaireImageStep(body, q, state) {
  state.pendingImageFile = null;
  const existing = state.answers[q.id];
  const existingBlob = existing && existing.blobPath;

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.style.display = 'none';
  fileInput.id = qid(state, 'image-input');
  body.appendChild(fileInput);

  const dropZone = document.createElement('div');
  dropZone.className = 'q-embed-dropzone';
  dropZone.id = qid(state, 'drop-zone');
  dropZone.style.display = existingBlob ? 'none' : 'block';
  dropZone.textContent = 'Click to upload an image';
  dropZone.onclick = () => fileInput.click();
  body.appendChild(dropZone);

  const previewWrap = document.createElement('div');
  previewWrap.className = 'q-embed-image-preview-wrap';
  previewWrap.id = qid(state, 'image-preview-wrap');
  previewWrap.style.display = existingBlob ? 'block' : 'none';

  const img = document.createElement('img');
  img.className = 'q-embed-image-preview';
  img.id = qid(state, 'image-preview');
  img.src = existingBlob || '';
  previewWrap.appendChild(img);

  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'q-embed-nav-btn q-embed-nav-ghost';
  removeBtn.textContent = 'Remove';
  removeBtn.onclick = () => {
    state.pendingImageFile = null;
    delete state.answers[q.id];
    fileInput.value = '';
    dropZone.style.display = 'block';
    previewWrap.style.display = 'none';
  };
  previewWrap.appendChild(removeBtn);
  body.appendChild(previewWrap);

  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    state.pendingImageFile = file;
    const reader = new FileReader();
    reader.onload = () => {
      img.src = reader.result;
      dropZone.style.display = 'none';
      previewWrap.style.display = 'block';
    };
    reader.readAsDataURL(file);
  };
}

function renderQuestionnaireSliderStep(body, q, state) {
  const config = q.configJson ? JSON.parse(q.configJson) : {};
  const min = config.min ?? 0, max = config.max ?? 100, step = config.step ?? 1;
  const existing = state.answers[q.id];
  const val = existing !== undefined ? existing : Math.round((min + max) / 2);

  const wrap = document.createElement('div');
  wrap.className = 'q-embed-slider-wrap';

  const input = document.createElement('input');
  input.type = 'range';
  input.id = qid(state, 'slider-input');
  input.min = min; input.max = max; input.step = step; input.value = val;

  const valueEl = document.createElement('div');
  valueEl.className = 'q-embed-slider-value';
  valueEl.textContent = val;
  input.oninput = () => { valueEl.textContent = input.value; };
  wrap.appendChild(input);

  const labels = document.createElement('div');
  labels.className = 'q-embed-slider-labels';
  const minLabel = document.createElement('span');
  minLabel.textContent = config.minLabel || String(min);
  const maxLabel = document.createElement('span');
  maxLabel.textContent = config.maxLabel || String(max);
  labels.appendChild(minLabel);
  labels.appendChild(maxLabel);
  wrap.appendChild(labels);
  wrap.appendChild(valueEl);
  body.appendChild(wrap);
}

function renderQuestionnaireChoiceStep(body, q, state) {
  const config = q.configJson ? JSON.parse(q.configJson) : {};
  const options = config.options || [];
  const existing = state.answers[q.id];
  const selected = q.type === 'MULTI_SELECT' ? (existing || []) : (existing !== undefined ? [existing] : []);

  const list = document.createElement('div');
  list.className = 'q-embed-choice-list';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'q-embed-choice-btn' + (selected.includes(opt) ? ' selected' : '');
    btn.textContent = opt;
    btn.dataset.opt = opt;
    btn.onclick = () => {
      if (q.type === 'SINGLE_SELECT') {
        list.querySelectorAll('.q-embed-choice-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      } else {
        btn.classList.toggle('selected');
      }
    };
    list.appendChild(btn);
  });
  body.appendChild(list);
}

function appendQuestionnaireFooter(w, container, state) {
  const footer = document.createElement('div');
  footer.className = 'q-embed-footer';

  const backBtn = document.createElement('button');
  backBtn.type = 'button';
  backBtn.className = 'q-embed-nav-btn q-embed-nav-ghost';
  backBtn.textContent = 'Back';
  backBtn.disabled = state.index === 0;
  backBtn.onclick = () => { state.index--; renderQuestionnaireStep(w, container, state); };
  footer.appendChild(backBtn);

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'q-embed-nav-btn q-embed-nav-primary';
  nextBtn.textContent = state.index === state.questions.length - 1 ? 'Submit' : 'Next';
  nextBtn.onclick = async () => {
    nextBtn.disabled = true;
    const ok = await persistQuestionnaireStep(container, state);
    nextBtn.disabled = false;
    if (!ok) return;

    if (state.index === state.questions.length - 1) {
      await fetch(`${API}/api/questionnaires/responses/${state.responseId}/submit`, { method: 'POST', headers: HEADERS });
      requiredPending.delete(w.id);
      renderQuestionnaireDone(container);
      advance('next');
      return;
    }
    state.index++;
    renderQuestionnaireStep(w, container, state);
  };
  footer.appendChild(nextBtn);
  container.appendChild(footer);
}

async function persistQuestionnaireStep(container, state) {
  const q = state.questions[state.index];

  if (q.type === 'SHORT_TEXT' || q.type === 'LONG_TEXT') {
    const value = document.getElementById(qid(state, 'text-field')).value.trim();
    if (q.required && !value) { alert('This question requires an answer.'); return false; }
    if (value) {
      state.answers[q.id] = value;
      await saveQuestionnaireAnswer(state, q.id, value);
    }
  } else if (q.type === 'IMAGE_UPLOAD') {
    if (state.pendingImageFile) {
      const form = new FormData();
      form.append('image', state.pendingImageFile);
      const res = await fetch(`${API}/api/questionnaires/responses/${state.responseId}/answers/${q.id}/image`, {
        method: 'POST', headers: { 'X-Api-Key': KEY }, body: form
      }).then(r => r.json());
      state.answers[q.id] = JSON.parse(res.valueJson);
      state.pendingImageFile = null;
    } else if (q.required && !state.answers[q.id]) {
      alert('This question requires an image.'); return false;
    }
  } else if (q.type === 'SLIDER') {
    const value = Number(document.getElementById(qid(state, 'slider-input')).value);
    state.answers[q.id] = value;
    await saveQuestionnaireAnswer(state, q.id, value);
  } else if (q.type === 'SINGLE_SELECT') {
    const btn = container.querySelector('.q-embed-choice-btn.selected');
    if (q.required && !btn) { alert('Please choose an option.'); return false; }
    if (btn) {
      const value = btn.dataset.opt;
      state.answers[q.id] = value;
      await saveQuestionnaireAnswer(state, q.id, value);
    }
  } else if (q.type === 'MULTI_SELECT') {
    const selected = Array.from(container.querySelectorAll('.q-embed-choice-btn.selected')).map(b => b.dataset.opt);
    if (q.required && !selected.length) { alert('Please choose at least one option.'); return false; }
    state.answers[q.id] = selected;
    await saveQuestionnaireAnswer(state, q.id, selected);
  }
  return true;
}

async function saveQuestionnaireAnswer(state, questionId, value) {
  await fetch(`${API}/api/questionnaires/responses/${state.responseId}/answers/${questionId}`, {
    method: 'PUT', headers: HEADERS, body: JSON.stringify({ value })
  });
}

async function toggleQuestionnaireRecording(state) {
  const micBtn = document.getElementById(qid(state, 'mic-btn'));
  const statusEl = document.getElementById(qid(state, 'voice-status'));

  if (!state.isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.mediaRecorder = new MediaRecorder(stream);
      const audioChunks = [];
      state.mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      state.mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        statusEl.textContent = 'Transcribing…';
        const q = state.questions[state.index];
        const form = new FormData();
        form.append('audio', blob, 'answer.webm');
        try {
          const res = await fetch(`${API}/api/questionnaires/responses/${state.responseId}/answers/${q.id}/voice`, {
            method: 'POST', headers: { 'X-Api-Key': KEY }, body: form
          }).then(r => r.json());
          const transcript = JSON.parse(res.valueJson);
          const field = document.getElementById(qid(state, 'text-field'));
          if (field) field.value = transcript;
          state.answers[q.id] = transcript;
          statusEl.textContent = 'Transcribed — feel free to edit before continuing.';
        } catch (err) {
          statusEl.textContent = 'Transcription failed — you can type your answer instead.';
        }
      };
      state.mediaRecorder.start();
      state.isRecording = true;
      micBtn.classList.add('recording');
      statusEl.textContent = 'Recording… click to stop.';
    } catch (err) {
      statusEl.textContent = 'Microphone access denied.';
    }
  } else {
    state.mediaRecorder.stop();
    state.isRecording = false;
    micBtn.classList.remove('recording');
  }
}

let googleScriptPromise = null;
function loadGoogleScript() {
  if (googleScriptPromise) return googleScriptPromise;
  googleScriptPromise = new Promise((resolve, reject) => {
    if (window.google && window.google.accounts && window.google.accounts.id) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load Google Identity script'));
    document.head.appendChild(s);
  });
  return googleScriptPromise;
}

async function bootLoginWidget(w, container) {
  try {
    const res = await fetch(`${API}/api/auth/me`, { headers: HEADERS });
    if (res.ok) { finishLogin(w); return; }
  } catch (e) { /* fall through to the form */ }
  renderLoginForm(w, container);
}

function finishLogin(w) {
  requiredPending.delete(w.id);
  updateOutcomeButtons();
  advance('next');
}

async function bootLogoutWidget(w, container) {
  try {
    const res = await fetch(`${API}/api/auth/me`, { headers: HEADERS });
    if (!res.ok) return; // not signed in — render nothing
  } catch (e) {
    return;
  }
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'logout-btn';
  btn.textContent = w.config.label || 'Sign out';
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = 'Signing out…';
    try {
      await fetch(`${API}/api/auth/logout`, { method: 'POST', headers: HEADERS });
    } catch (e) { /* best effort — the visitor is leaving this state regardless */ }
    window.location.reload();
  };
  container.appendChild(btn);
}

async function bootProductOptionsWidget(w, container) {
  const productId = w.config.productId;
  if (!productId) {
    container.innerHTML = '';
    const err = document.createElement('div');
    err.className = 'po-error';
    err.textContent = 'This widget has no product configured.';
    container.appendChild(err);
    return;
  }

  let product, options, selectedOptionId = null;
  try {
    const res = await fetch(`${API}/api/products/${productId}`, { headers: HEADERS });
    if (!res.ok) throw new Error('product fetch failed');
    const detail = await res.json();
    product = detail.product;
    options = (detail.options || []).filter(o => o.active);
  } catch (e) {
    container.innerHTML = '';
    const err = document.createElement('div');
    err.className = 'po-error';
    err.textContent = 'Could not load this product.';
    container.appendChild(err);
    return;
  }

  try {
    const res = await fetch(`${API}/api/public/flow-sessions/${token}/widgets/${w.id}/selection`, { headers: HEADERS });
    if (res.ok) {
      const body = await res.json();
      selectedOptionId = body.optionId || null;
    }
  } catch (e) { /* no prior selection — proceed unselected */ }

  renderProductOptions(w, container, product, options, selectedOptionId);
}

function renderProductOptions(w, container, product, options, selectedOptionId) {
  container.innerHTML = '';

  const advanceOnSelect = widgetConfigBool(w.config.advanceOnSelect, false);
  if (advanceOnSelect) {
    if (selectedOptionId) requiredPending.delete(w.id); else requiredPending.add(w.id);
    updateOutcomeButtons();
  }

  const heading = document.createElement('h2');
  heading.className = 'po-heading';
  heading.textContent = w.config.heading || product.name;
  container.appendChild(heading);

  const grid = document.createElement('div');
  grid.className = 'po-cards';

  options.forEach(o => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'po-card' + (o.id === selectedOptionId ? ' selected' : '');

    const name = document.createElement('div');
    name.className = 'po-name';
    name.textContent = o.name;
    card.appendChild(name);

    const price = document.createElement('div');
    price.className = 'po-price';
    price.textContent = formatMoney(o.priceCents, o.currency);
    if (o.billingInterval) {
      const interval = document.createElement('span');
      interval.className = 'po-interval';
      interval.textContent = ' / ' + o.billingInterval;
      price.appendChild(interval);
    }
    card.appendChild(price);

    if (o.description) {
      const desc = document.createElement('div');
      desc.className = 'po-desc';
      desc.textContent = o.description;
      card.appendChild(desc);
    }

    const features = parseFeatures(o.featuresJson);
    if (features.length) {
      const ul = document.createElement('ul');
      ul.className = 'po-features';
      features.forEach(f => {
        const li = document.createElement('li');
        li.textContent = f;
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }

    const selectBtn = document.createElement('div');
    selectBtn.className = 'po-select-btn';
    selectBtn.textContent = o.id === selectedOptionId ? 'Selected' : 'Select';
    card.appendChild(selectBtn);

    card.onclick = () => selectProductOption(w, container, product, options, o.id);
    grid.appendChild(card);
  });

  container.appendChild(grid);

  if (advanceOnSelect) {
    const continueBtn = document.createElement('button');
    continueBtn.type = 'button';
    continueBtn.className = 'po-continue-btn';
    continueBtn.textContent = w.config.continueLabel || 'Continue';
    continueBtn.disabled = !selectedOptionId;
    continueBtn.onclick = () => goToPayment(w);
    container.appendChild(continueBtn);
  }
}

function goToPayment(w) {
  // A payment widget paired to this one via sourceWidgetId is usually stacked on the
  // same (terminal) page rather than a separate one — reveal it in place instead of
  // calling advance(), which has no real transition to follow from a terminal page.
  const target = currentPageWidgets.find(pw => pw.widgetType === 'payment' && pw.config && pw.config.sourceWidgetId === w.id);
  if (target) {
    const el = document.getElementById('payment-widget-' + target.id);
    if (el) {
      bootPaymentWidget(target, el);
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
  }
  advance('next');
}

async function selectProductOption(w, container, product, options, optionId) {
  try {
    const res = await fetch(`${API}/api/public/flow-sessions/${token}/widgets/${w.id}/selection`, {
      method: 'POST', headers: HEADERS,
      body: JSON.stringify({ productId: product.id, optionId })
    });
    if (!res.ok) throw new Error('selection failed');
    renderProductOptions(w, container, product, options, optionId);
  } catch (e) {
    alert('Could not save your selection. Please try again.');
  }
}

function formatMoney(cents, currency) {
  const amount = (cents || 0) / 100;
  const symbol = (currency || 'usd').toLowerCase() === 'usd' ? '$' : '';
  return symbol + amount.toLocaleString(undefined, { minimumFractionDigits: amount % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
}

function parseFeatures(json) {
  if (!json) return [];
  try { return JSON.parse(json); } catch (e) { return []; }
}

async function bootPaymentWidget(w, container) {
  const sourceWidgetId = w.config.sourceWidgetId;
  if (!sourceWidgetId) {
    container.innerHTML = '';
    const err = document.createElement('div');
    err.className = 'pay-error';
    err.textContent = 'This widget has no source product widget configured.';
    container.appendChild(err);
    return;
  }

  let selection = null, status = null;
  try {
    const res = await fetch(`${API}/api/public/flow-sessions/${token}/widgets/${sourceWidgetId}/selection`, { headers: HEADERS });
    if (res.ok) selection = await res.json();
  } catch (e) { /* no selection yet */ }
  try {
    const res = await fetch(`${API}/api/public/flow-sessions/${token}/widgets/${w.id}/checkout/status`, { headers: HEADERS });
    if (res.ok) status = await res.json();
  } catch (e) { /* no prior payment attempt */ }

  renderPayment(w, container, sourceWidgetId, selection, status);
}

function renderPayment(w, container, sourceWidgetId, selection, status) {
  container.innerHTML = '';

  const heading = document.createElement('h2');
  heading.className = 'pay-heading';
  heading.textContent = w.config.heading || 'Complete your purchase';
  container.appendChild(heading);

  if (status && status.status === 'SUCCEEDED') {
    const box = document.createElement('div');
    box.className = 'pay-success';
    const icon = document.createElement('div');
    icon.className = 'pay-success-icon';
    icon.textContent = '✓';
    box.appendChild(icon);
    const text = document.createElement('div');
    text.className = 'pay-success-text';
    text.textContent = 'Payment complete';
    box.appendChild(text);
    const sub = document.createElement('div');
    sub.className = 'pay-success-sub';
    sub.textContent = formatMoney(status.amountCents, status.currency) + ' — thank you!';
    box.appendChild(sub);
    container.appendChild(box);
    return;
  }

  if (!selection || !selection.optionId || !selection.productId) {
    const err = document.createElement('div');
    err.className = 'pay-error';
    err.textContent = 'Select an option above first.';
    container.appendChild(err);
    return;
  }

  const summary = document.createElement('div');
  summary.className = 'pay-summary';
  const product = document.createElement('div');
  product.className = 'pay-summary-product';
  product.textContent = selection.productName || '';
  summary.appendChild(product);
  const option = document.createElement('div');
  option.className = 'pay-summary-option';
  option.textContent = selection.optionName || '';
  summary.appendChild(option);
  const price = document.createElement('div');
  price.className = 'pay-summary-price';
  price.textContent = formatMoney(selection.priceCents, selection.currency);
  if (selection.billingInterval) {
    const interval = document.createElement('span');
    interval.className = 'pay-interval';
    interval.textContent = ' / ' + selection.billingInterval;
    price.appendChild(interval);
  }
  summary.appendChild(price);
  container.appendChild(summary);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pay-btn';
  btn.textContent = w.config.buttonLabel || 'Pay now';
  btn.onclick = () => startPayment(w, container, sourceWidgetId, btn);
  container.appendChild(btn);

  const errDiv = document.createElement('div');
  errDiv.className = 'pay-error';
  errDiv.style.display = 'none';
  container.appendChild(errDiv);
}

async function startPayment(w, container, sourceWidgetId, btn) {
  btn.disabled = true;
  btn.textContent = 'Processing…';
  try {
    const res = await fetch(`${API}/api/public/flow-sessions/${token}/widgets/${w.id}/checkout`, {
      method: 'POST', headers: HEADERS,
      body: JSON.stringify({ sourceWidgetId })
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || 'Checkout failed');
    if (body.checkoutUrl) {
      window.location.href = body.checkoutUrl;
      return;
    }
    // MOCK mode: succeeded immediately, no redirect needed
    renderPayment(w, container, sourceWidgetId, null, { status: body.status, amountCents: body.amountCents, currency: body.currency });
  } catch (e) {
    btn.disabled = false;
    btn.textContent = w.config.buttonLabel || 'Pay now';
    const errDiv = container.querySelector('.pay-error');
    if (errDiv) { errDiv.textContent = e.message || 'Payment could not be started. Please try again.'; errDiv.style.display = 'block'; }
  }
}

function renderLoginForm(w, container) {
  container.innerHTML = '';
  let mode = 'signin';

  const tabs = document.createElement('div');
  tabs.className = 'wl-tabs';
  const signinTab = document.createElement('button');
  signinTab.type = 'button'; signinTab.className = 'wl-tab active'; signinTab.textContent = 'Sign in';
  const signupTab = document.createElement('button');
  signupTab.type = 'button'; signupTab.className = 'wl-tab'; signupTab.textContent = 'Create account';
  tabs.appendChild(signinTab); tabs.appendChild(signupTab);
  container.appendChild(tabs);

  const nameField = document.createElement('div');
  nameField.className = 'wl-field'; nameField.style.display = 'none';
  const nameLabel = document.createElement('label'); nameLabel.textContent = 'Name';
  const nameInput = document.createElement('input'); nameInput.type = 'text'; nameInput.placeholder = 'Your name';
  nameField.appendChild(nameLabel); nameField.appendChild(nameInput);
  container.appendChild(nameField);

  const emailField = document.createElement('div');
  emailField.className = 'wl-field';
  const emailLabel = document.createElement('label'); emailLabel.textContent = 'Email';
  const emailInput = document.createElement('input'); emailInput.type = 'email'; emailInput.placeholder = 'your@email.com';
  emailField.appendChild(emailLabel); emailField.appendChild(emailInput);
  container.appendChild(emailField);

  const passwordField = document.createElement('div');
  passwordField.className = 'wl-field';
  const passwordLabel = document.createElement('label'); passwordLabel.textContent = 'Password';
  const passwordInput = document.createElement('input'); passwordInput.type = 'password'; passwordInput.placeholder = 'Min 8 characters';
  passwordField.appendChild(passwordLabel); passwordField.appendChild(passwordInput);
  container.appendChild(passwordField);

  const errEl = document.createElement('div');
  errEl.className = 'wl-err';
  container.appendChild(errEl);

  const submitBtn = document.createElement('button');
  submitBtn.type = 'button';
  submitBtn.className = 'wl-submit-btn';
  submitBtn.textContent = 'Sign in';
  container.appendChild(submitBtn);

  signinTab.onclick = () => {
    mode = 'signin';
    signinTab.classList.add('active'); signupTab.classList.remove('active');
    nameField.style.display = 'none';
    submitBtn.textContent = 'Sign in';
    errEl.textContent = '';
  };
  signupTab.onclick = () => {
    mode = 'signup';
    signupTab.classList.add('active'); signinTab.classList.remove('active');
    nameField.style.display = 'flex';
    submitBtn.textContent = 'Create account';
    errEl.textContent = '';
  };

  submitBtn.onclick = async () => {
    errEl.textContent = '';
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const name = nameInput.value.trim();
    if (!email || !password) { errEl.textContent = 'Please fill in email and password.'; return; }
    if (mode === 'signup' && !name) { errEl.textContent = 'Please enter your name.'; return; }
    if (mode === 'signup' && password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signup' ? 'Creating account…' : 'Signing in…';
    try {
      const endpoint = mode === 'signup' ? '/api/auth/register' : '/api/auth/login';
      const res = await fetch(`${API}${endpoint}`, {
        method: 'POST', headers: HEADERS, body: JSON.stringify({ email, name, password })
      });
      const body = await res.json();
      if (!res.ok || body.error) {
        errEl.textContent = body.error || 'Something went wrong. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
        return;
      }
      finishLogin(w);
    } catch (e) {
      errEl.textContent = 'Something went wrong. Please try again.';
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    }
  };

  if (widgetConfigBool(w.config.googleEnabled, true) && window.__PF_GOOGLE_CLIENT_ID__) {
    const divider = document.createElement('div');
    divider.className = 'wl-divider';
    divider.textContent = 'or';
    container.appendChild(divider);

    const googleContainer = document.createElement('div');
    googleContainer.className = 'wl-google-btn';
    container.appendChild(googleContainer);

    loadGoogleScript().then(() => {
      window.google.accounts.id.initialize({
        client_id: window.__PF_GOOGLE_CLIENT_ID__,
        callback: (response) => handleGoogleCredential(w, response, errEl)
      });
      window.google.accounts.id.renderButton(googleContainer, { theme: 'outline', size: 'large', width: 280 });
    }).catch(() => { /* Google button simply doesn't render — email/password still works */ });
  }
}

async function handleGoogleCredential(w, response, errEl) {
  try {
    const res = await fetch(`${API}/api/auth/google`, {
      method: 'POST', headers: HEADERS, body: JSON.stringify({ idToken: response.credential })
    });
    const body = await res.json();
    if (!res.ok || body.error) {
      if (errEl) errEl.textContent = body.error || 'Google sign-in failed. Please try again.';
      return;
    }
    finishLogin(w);
  } catch (e) {
    if (errEl) errEl.textContent = 'Google sign-in failed. Please try again.';
  }
}

async function bootBrandResultsWidget(w, container) {
  const heading = w.config.heading || 'Your brand directions are ready';
  renderBrandResultsStatus(container, heading, 'Getting started…');
  if (simulate) {
    // The pipeline needs a real, authenticated FlowSession (BrandResultsController
    // 403s without a clientUserId, which simulated sessions never have) — admin
    // Simulate preview shows an explanatory placeholder instead of attempting it.
    renderBrandResultsStatus(container, heading,
      'The brand pipeline only runs for real visitor sessions — not available in Simulate preview.');
    requiredPending.delete(w.id);
    updateOutcomeButtons();
    return;
  }
  startBrandResultsPipeline(w, container, false);
}

async function startBrandResultsPipeline(w, container, retry) {
  const heading = w.config.heading || 'Your brand directions are ready';
  renderBrandResultsStatus(container, heading, retry ? 'Retrying…' : 'Getting started…');
  try {
    const res = await fetch(
      `${API}/api/public/brand-results/flow-sessions/${token}/widgets/${w.id}/start${retry ? '?retry=true' : ''}`,
      { method: 'POST', headers: HEADERS }
    );
    if (!res.ok) throw new Error('start failed');
    const body = await res.json();
    pollBrandResults(w, container, body.engagementId);
  } catch (e) {
    renderBrandResultsError(w, container, 'Could not start generating your brand directions.');
  }
}

function renderBrandResultsStatus(container, heading, message) {
  container.innerHTML = '';
  const h = document.createElement('h2');
  h.className = 'br-heading';
  h.textContent = heading;
  container.appendChild(h);
  const spinner = document.createElement('div');
  spinner.className = 'br-spinner';
  container.appendChild(spinner);
  const status = document.createElement('div');
  status.className = 'br-status';
  status.textContent = message;
  container.appendChild(status);
}

async function pollBrandResults(w, container, engagementId) {
  let body;
  try {
    const res = await fetch(`${API}/api/engagements/${engagementId}`, { headers: HEADERS });
    if (!res.ok) throw new Error('poll failed');
    body = await res.json();
  } catch (e) {
    renderBrandResultsError(w, container, 'Lost connection while checking your brand directions.');
    return;
  }
  const status = body.summary.status;
  if (status === 'DONE') {
    if (!body.results || !body.results.directions || body.results.directions.length === 0) {
      renderBrandResultsError(w, container, 'Something went wrong generating your brand directions.');
      return;
    }
    renderBrandResultsDirections(w, container, engagementId, body.results);
  } else if (status === 'FAILED') {
    renderBrandResultsError(w, container, 'Something went wrong generating your brand directions.');
  } else {
    renderBrandResultsStatus(container, w.config.heading || 'Your brand directions are ready',
      'Reading your answers and shaping three directions… this can take a few minutes.');
    setTimeout(() => pollBrandResults(w, container, engagementId), 4000);
  }
}

function brandDirectionLabel(direction) {
  const d = String(direction || '').toLowerCase();
  return d.charAt(0).toUpperCase() + d.slice(1);
}

function renderBrandResultsDirections(w, container, engagementId, results) {
  container.innerHTML = '';
  const h = document.createElement('h2');
  h.className = 'br-heading';
  h.textContent = w.config.heading || 'Your brand directions are ready';
  container.appendChild(h);

  const grid = document.createElement('div');
  grid.className = 'br-cards';
  (results.directions || []).forEach(dir => {
    const card = document.createElement('div');
    card.className = 'br-card';

    const img = document.createElement('img');
    img.className = 'br-card-img';
    img.src = `${API}/api/engagements/${engagementId}/preview/${dir.direction}`;
    img.alt = brandDirectionLabel(dir.direction) + ' preview';
    card.appendChild(img);

    const label = document.createElement('div');
    label.className = 'br-card-label';
    label.textContent = brandDirectionLabel(dir.direction);
    card.appendChild(label);

    if (dir.copy && dir.copy.tagline) {
      const tagline = document.createElement('div');
      tagline.className = 'br-card-tagline';
      tagline.textContent = dir.copy.tagline;
      card.appendChild(tagline);
    }

    const chooseBtn = document.createElement('button');
    chooseBtn.type = 'button';
    chooseBtn.className = 'br-choose-btn';
    chooseBtn.textContent = 'Choose this direction';
    chooseBtn.onclick = () => chooseBrandDirection(w, engagementId, dir.direction, grid);
    card.appendChild(chooseBtn);

    grid.appendChild(card);
  });
  container.appendChild(grid);

  const note = document.createElement('div');
  note.className = 'br-note';
  note.textContent = 'Your progress is saved — you can come back later and pick up where you left off.';
  container.appendChild(note);
}

async function chooseBrandDirection(w, engagementId, direction, grid) {
  grid.querySelectorAll('.br-choose-btn').forEach(b => b.disabled = true);
  try {
    const res = await fetch(`${API}/api/engagements/${engagementId}/choose-direction`, {
      method: 'POST', headers: HEADERS, body: JSON.stringify({ direction })
    });
    if (!res.ok) throw new Error('choose failed');
    requiredPending.delete(w.id);
    updateOutcomeButtons();
    advance('next');
  } catch (e) {
    grid.querySelectorAll('.br-choose-btn').forEach(b => b.disabled = false);
    alert('Could not save your choice. Please try again.');

}

function renderBrandResultsError(w, container, message) {
  container.innerHTML = '';
  const h = document.createElement('h2');
  h.className = 'br-heading';
  h.textContent = w.config.heading || 'Your brand directions are ready';
  container.appendChild(h);
  const err = document.createElement('div');
  err.className = 'br-error';
  err.textContent = message;
  container.appendChild(err);
  const retryBtn = document.createElement('button');

  retryBtn.onclick = () => startBrandResultsPipeline(w, container, true);
  container.appendChild(retryBtn);
}

function storageKey(s) { return 'flowSession:' + s; }

async function boot() {
  const params = new URLSearchParams(window.location.search);
  simulate = params.get('simulate') === '1';
  pageFlowId = params.get('pageFlowId');

  if (simulate) {
    document.getElementById('sim-badge').style.display = 'flex';
    try {
      layouts = await fetch(`${API}/api/public/page-layouts`, { headers: HEADERS }).then(r => r.json());
      const res = await fetch(`${API}${fsBase()}`, {
        method: 'POST', headers: HEADERS, credentials: 'include',
        body: JSON.stringify({ pageFlowId })
      });
      if (!res.ok) throw new Error('no such flow');
      const view = await res.json();
      token = view.token;
      render(view);
    } catch (e) {
      showState('Nothing here', 'This page flow could not be simulated.');
    }
    return;
  }

  // window.__PF_SLUG__ is set server-side (see PageController#flowRuntime) because
  // PageFlowRouteFilter reaches this page via a servlet forward, which never updates
  // the browser's own window.location — a query-string read here would always be null
  // for any /live/<slug>-style request. The query-string fallback only covers a direct
  // /flow-runtime.html?slug=... hit if the server-side injection is ever bypassed.
  // A root-mounted flow's slug is legitimately "" — must not be treated as falsy/absent
  // the way a genuinely-unresolved (null) slug is.
  slug = (typeof window.__PF_SLUG__ !== 'undefined' && window.__PF_SLUG__ !== null)
    ? window.__PF_SLUG__
    : new URLSearchParams(window.location.search).get('slug');
  if (slug === null) {
    showState('Nothing here', 'There is no live page available at this address.');
    return;
  }
  // Disambiguates a slug shared by two live flows under different root prefixes (see
  // PageFlowRepository#findLiveByRoute) — null means the default "/live" prefix.
  rootPrefix = (typeof window.__PF_ROOT_PREFIX__ !== 'undefined')
    ? window.__PF_ROOT_PREFIX__
    : new URLSearchParams(window.location.search).get('rootPrefix');

  try {
    layouts = await fetch(`${API}/api/public/page-layouts`, { headers: HEADERS }).then(r => r.json());

    let view = null;
    const savedToken = localStorage.getItem(storageKey(slug));
    if (savedToken) {
      const res = await fetch(`${API}/api/public/flow-sessions/${savedToken}`, { headers: HEADERS });
      if (res.ok) {
        view = await res.json();
      } else {
        localStorage.removeItem(storageKey(slug));
      }
    }

    if (!view) {
      const res = await fetch(`${API}/api/public/flow-sessions`, {
        method: 'POST', headers: HEADERS, body: JSON.stringify({ slug, rootPrefix })
      });
      if (!res.ok) throw new Error('no live flow');
      view = await res.json();
      localStorage.setItem(storageKey(slug), view.token);
    }

    token = view.token;
    render(view);
  } catch (e) {
    showState('Nothing here', 'There is no live page available at this address.');
  }
}

function render(view) {
  token = view.token;

  if (view.ended) {
    if (!simulate) localStorage.removeItem(storageKey(slug));
    // An END_PAGE flow sets a designated page as the true final destination — show
    // it instead of the generic completion screen, which is reserved for flows that
    // have no end page at all (REDIRECT_FLOW/CREATE_ENGAGEMENT already navigated away,
    // or a plain end-of-flow with nothing configured).
    if (view.page) {
      renderPage(view.page, true);
      return;
    }
    if (view.engagementId) {
      showRegisterScreen(view.engagementId);
    } else {
      showState('All done', 'Thanks — you have completed this flow.');
    }
    return;
  }

  if (!simulate && view.slug !== slug) {
    slug = view.slug;
    localStorage.setItem(storageKey(slug), token);
    history.replaceState(null, '', view.livePath || ('/live/' + slug));
  }

  renderPage(view.page, false);
}

function renderPage(page, isEnded) {
  // A sole-redirect page (no other widgets) forwards immediately with no flash. A
  // redirect widget mixed with other widgets renders the rest of the page first, then
  // redirects after a brief, human-perceptible pause.
  if (page.redirectUrl) {
    if (!page.widgets || page.widgets.length === 0) {
      window.location.href = page.redirectUrl;
      return;
    }
    setTimeout(() => { window.location.href = page.redirectUrl; }, 1500);
  }

  const layout = layouts.find(l => l.id === page.layoutKey) || layouts[0];
  const isFullBleed = !!layout && layout.id === 'FULL_BLEED';

  document.getElementById('state-screen').style.display = 'none';
  document.getElementById('card').style.display = 'block';
  document.getElementById('card').classList.toggle('full-bleed', isFullBleed);
  document.getElementById('card').classList.toggle('no-border', page.bordered === false);

  requiredPending = new Set();
  currentPageOutcomes = page.outcomes || [];
  currentPageWidgets = page.widgets || [];

  // Navigation is opt-in, not layout-driven: a page only gets Back/Next buttons when
  // it's been given a pageNav widget. A flow's designated end page is terminal — the
  // session has already ended server-side — so pageNav is skipped there even if present.
  const widgets = isEnded ? page.widgets.filter(w => w.widgetType !== 'pageNav') : page.widgets;

  const grid = document.getElementById('page-grid');
  grid.style.gridTemplateColumns = layout ? layout.gridTemplateColumns : '1fr';
  grid.innerHTML = '';
  (layout ? layout.slots : [{ key: 'main', label: 'Main' }]).forEach(slot => {
    const slotEl = document.createElement('div');
    slotEl.className = 'slot';
    widgets.filter(w => w.slotKey === slot.key).forEach(w => {
      const fn = widgetRegistry[w.widgetType];
      const el = fn ? fn(w) : null;
      if (el) slotEl.appendChild(el);
    });
    grid.appendChild(slotEl);
  });

  updateOutcomeButtons();
}

async function advance(outcomeKey) {
  document.querySelectorAll('.outcome-btn').forEach(b => b.disabled = true);
  try {
    const res = await fetch(`${API}${fsBase()}/${token}/advance`, {
      method: 'POST', headers: HEADERS, body: JSON.stringify({ outcomeKey }),
      credentials: simulate ? 'include' : 'same-origin'
    });
    if (!res.ok) throw new Error('advance failed');
    render(await res.json());
  } catch (e) {
    document.querySelectorAll('.outcome-btn').forEach(b => b.disabled = false);
    showState('Something went wrong', 'Please try again.');
  }
}

function showState(title, message) {
  document.getElementById('card').style.display = 'none';
  const s = document.getElementById('state-screen');
  s.style.display = 'flex';
  document.getElementById('state-title').textContent = title;
  document.getElementById('state-message').textContent = message;
}

function showRegisterScreen(engagementId) {
  document.getElementById('card').style.display = 'none';
  document.getElementById('state-screen').style.display = 'none';
  document.getElementById('reg-login-link').href = '/login?next=' + encodeURIComponent('/your-brand/' + engagementId);
  document.getElementById('register-screen').style.display = 'block';
  document.getElementById('register-screen').dataset.engagementId = engagementId;
}

async function submitRegistration() {
  const engagementId = document.getElementById('register-screen').dataset.engagementId;
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl    = document.getElementById('reg-err');
  errEl.textContent = '';

  if (!name || !email || !password) { errEl.textContent = 'Please fill in all fields.'; return; }
  if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }

  const btn = document.getElementById('reg-btn');
  btn.disabled = true; btn.textContent = 'Creating account…';

  const regRes = await fetch(`${API}/api/auth/register`, {
    method: 'POST', headers: HEADERS, body: JSON.stringify({ name, email, password })
  }).then(r => r.json());

  if (regRes.error && !regRes.error.includes('already exists')) {
    errEl.textContent = regRes.error; btn.disabled = false; btn.textContent = 'See my brand results →'; return;
  }

  btn.textContent = 'Linking your brand…';
  await fetch(`${API}/api/engagements/${engagementId}/claim`, { method: 'POST', headers: HEADERS });

  window.location.href = '/your-brand/' + engagementId;
}

boot();
</script>
