<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis AI — Page Flows</title>
<script src="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-bg-image: url('/bg-earth.jpg');
    --theme-bg-transform: rotate(180deg);
    --theme-bg-overlay: rgba(0, 0, 10, 0.75);
    --theme-body-bg: #0a0b12;
    --theme-text-primary: #f2f2f2;
    --theme-text-muted: rgba(255, 255, 255, 0.5);
    --theme-text-label: rgba(255, 255, 255, 0.4);
    --theme-card-bg: rgba(255, 255, 255, 0.05);
    --theme-card-bg-hover: rgba(255, 255, 255, 0.12);
    --theme-card-border: rgba(255, 255, 255, 0.1);
    --theme-divider: rgba(255, 255, 255, 0.07);
  }

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--theme-body-bg); display: flex; height: 100vh; overflow: hidden; color: var(--theme-text-primary); }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -2;
    background: var(--theme-bg-image) var(--theme-bg-position, center center) / var(--theme-bg-size, cover) no-repeat;
    transform: var(--theme-bg-transform, none);
  }
  body::after { content: ''; position: fixed; inset: 0; z-index: -1; background: var(--theme-bg-overlay); }

  /* ── Sidebar ── */
  #sidebar { width: 260px; min-width: 260px; background: #111; display: flex; flex-direction: column; border-right: 1px solid #222; }
  #sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid #222; position: relative; }
  .sidebar-logo {
    height: 22px; width: auto; aspect-ratio: 805 / 220; display: block; margin-bottom: 4px;
    background-color: var(--theme-text-primary, currentColor);
    -webkit-mask-image: url(/api/themes/active/logo); mask-image: url(/api/themes/active/logo);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }
  .mode-badge {
    display: inline-block; margin-top: 8px; padding: 3px 9px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: #6fe0a5; background: rgba(111,224,165,0.12); border: 1px solid rgba(111,224,165,0.3); border-radius: 20px;
  }

  #nav-toggle {
    position: absolute; top: 16px; right: 12px; width: 26px; height: 26px;
    background: none; border: none; color: #888; cursor: pointer;
    display: flex; align-items: center; justify-content: center; border-radius: 5px;
    transition: background 0.15s, color 0.15s;
  }
  #nav-toggle:hover { background: #1e1e1e; color: #fff; }
  #nav-menu {
    display: none; position: absolute; top: 100%; right: 12px; margin-top: 6px;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
    overflow: hidden; z-index: 20; min-width: 150px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #nav-menu.open { display: block; }
  #nav-menu .nav-item { display: block; padding: 9px 14px; font-size: 13px; color: #ccc; text-decoration: none; transition: background 0.15s, color 0.15s; }
  #nav-menu .nav-item:hover { background: #242424; color: #fff; }
  #nav-menu .nav-item.active { color: #fff; font-weight: 600; background: #222; pointer-events: none; }

  #new-flow-btn {
    margin: 8px 12px; padding: 10px 14px; background: #1a1a1a; border: 1px solid #333;
    border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.15s;
  }
  #new-flow-btn:hover { background: #222; }

  #flow-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .flow-item { padding: 9px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between; }
  .flow-item:hover { background: #1c1c1c; }
  .flow-item.active { background: #222; }
  .flow-meta { flex: 1; min-width: 0; }
  .flow-name { color: #ccc; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flow-item.active .flow-name { color: #fff; }
  .flow-slug { font-size: 10px; color: #666; margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .live-pill {
    font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-top: 3px;
    display: inline-block; text-transform: uppercase; letter-spacing: 0.3px;
    background: rgba(111,224,165,0.15); color: #6fe0a5;
  }
  .flow-delete { opacity: 0; background: none; border: none; color: #666; cursor: pointer; padding: 2px 4px; border-radius: 4px; font-size: 14px; flex-shrink: 0; transition: opacity 0.15s, color 0.15s; }
  .flow-item:hover .flow-delete { opacity: 1; }
  .flow-delete:hover { color: #ff6b6b; }

  /* ── Main ── */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

  #empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: rgba(255,255,255,0.35);
  }
  #empty h2 { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.5); }
  #empty p { font-size: 14px; text-align: center; max-width: 360px; line-height: 1.5; }

  #level1, #level2 { flex: 1; display: none; min-height: 0; flex-direction: column; }

  #toolbar {
    padding: 12px 20px; border-bottom: 1px solid var(--theme-divider); background: var(--theme-card-bg);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0;
  }
  #toolbar h2 { font-size: 15px; font-weight: 700; margin-right: auto; }
  .tbtn {
    padding: 6px 14px; border-radius: 7px; border: none; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background 0.15s; letter-spacing: 0.2px;
  }
  .tbtn-primary { background: rgba(255,255,255,0.9); color: #0a0b12; }
  .tbtn-primary:hover { background: #fff; }
  .tbtn-ghost { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.12); }
  .tbtn-ghost:hover { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); }

  .legend { display: flex; gap: 12px; font-size: 11px; color: rgba(255,255,255,0.45); align-items: center; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }

  #canvas-wrap { flex: 1; display: flex; min-height: 0; }
  #drawflow { flex: 1; background: transparent; }

  #meta-panel {
    width: 300px; min-width: 300px; border-left: 1px solid var(--theme-divider); background: var(--theme-card-bg);
    padding: 18px; overflow-y: auto; display: none; flex-direction: column; gap: 14px;
  }
  #meta-panel.visible { display: flex; }
  #meta-panel h3 { font-size: 13px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.4px; }
  .form-field input[type=text], .form-field select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--theme-card-border); border-radius: 7px;
    font-size: 13px; font-family: inherit; outline: none; color: var(--theme-text-primary); background: var(--theme-card-bg);
  }
  .form-field input:focus, .form-field select:focus { border-color: rgba(255,255,255,0.3); }
  .check-field { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #ccc; cursor: pointer; }
  .check-field input { accent-color: #6fe0a5; width: 15px; height: 15px; cursor: pointer; }
  .panel-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }

  /* ── Drawflow node styling ── */
  .drawflow .drawflow-node {
    background: #1a1b22; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
    padding: 0; width: 190px; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .drawflow .drawflow-node.selected { border-color: #6fe0a5; box-shadow: 0 0 0 2px rgba(111,224,165,0.25); }
  .page-node { padding: 12px 14px; }
  .page-node .pn-name { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 6px; word-break: break-word; }
  .page-node .pn-badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .page-node .pn-badge {
    font-size: 9px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5);
  }
  .page-node .pn-badge.pn-error { background: rgba(239,68,68,0.18); color: #ef8080; }
  .page-node .pn-badge.pn-auth { background: rgba(96,165,250,0.18); color: #7fb2fb; }

  .drawflow .connection .main-path { stroke: #6fe0a5; stroke-width: 2; }
  .drawflow .drawflow-node .output_1 { background: #6fe0a5 !important; }
  .drawflow .drawflow-node .output_2 { background: #999 !important; }
  .drawflow .drawflow-node .output_3 { background: #ef4444 !important; }
  .drawflow .connection[class*="output_1"] .main-path { stroke: #6fe0a5; }
  .drawflow .connection[class*="output_2"] .main-path { stroke: #999; stroke-dasharray: 4, 4; }
  .drawflow .connection[class*="output_3"] .main-path { stroke: #ef4444; }

  /* ── Level 2: layout editor ── */
  #level2-body { flex: 1; display: flex; min-height: 0; }
  #layout-grid-wrap { flex: 1; padding: 24px; overflow-y: auto; }
  #layout-picker { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .layout-chip {
    padding: 6px 13px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); font-size: 12px; color: rgba(255,255,255,0.6); cursor: pointer; transition: all 0.15s;
  }
  .layout-chip.active { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.3); }
  #layout-grid { display: grid; gap: 14px; min-height: 240px; }
  .slot-box {
    border: 1px dashed rgba(255,255,255,0.18); border-radius: 10px; padding: 12px; min-height: 120px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .slot-label { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.5px; }
  .widget-chip {
    background: var(--theme-card-bg); border: 1px solid var(--theme-card-border); border-radius: 8px;
    padding: 8px 10px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .widget-chip:hover { border-color: rgba(255,255,255,0.3); }
  .widget-chip.selected { border-color: #6fe0a5; }
  .widget-chip-type { color: rgba(255,255,255,0.4); font-size: 10px; text-transform: uppercase; }
  .slot-add-select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #ccc; font-size: 12px; }

  #widget-config-panel {
    width: 300px; min-width: 300px; border-left: 1px solid var(--theme-divider); background: var(--theme-card-bg);
    padding: 18px; overflow-y: auto; display: none; flex-direction: column; gap: 12px;
  }
  #widget-config-panel.visible { display: flex; }

  #toast {
    position: fixed; bottom: 24px; right: 24px; background: rgba(30,30,40,0.95);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 10px 18px; font-size: 13px;
    color: #f2f2f2; backdrop-filter: blur(12px); opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
</style>
<link rel="stylesheet" href="/api/themes/active/styles.css">

<body>

<div id="sidebar">
  <div id="sidebar-header">
    <a href="/dashboard"><div class="sidebar-logo" role="img" aria-label="Genesis"></div></a>
    <div class="mode-badge">Page Flows</div>
    <button id="nav-toggle" onclick="toggleNavMenu(event)" aria-label="Menu">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
    <div id="nav-menu">
      <a href="/dashboard" class="nav-item">Dashboard</a>
      <a href="/dashboard/console" class="nav-item">Consultant</a>
      <a href="/dashboard/training" class="nav-item">Training</a>
      <a href="/dashboard/playground" class="nav-item">Playground</a>
      <a href="/dashboard/agents" class="nav-item">Agents</a>
      <a href="/dashboard/questionnaires" class="nav-item">Questionnaires</a>
      <a href="/dashboard/knowledge" class="nav-item">Knowledge</a>
      <a href="/dashboard/page-flows" class="nav-item active">Page Flows</a>
    </div>
  </div>
  <script>
  (async () => {
    try {
      const r = await fetch("/api/admin/nav-extensions", { credentials: "include" });
      if (!r.ok) return;
      const items = await r.json();
      const nav = document.getElementById("nav-menu");
      if (!nav) return;
      items.forEach(item => {
        const a = document.createElement("a");
        a.href = item.path;
        a.className = "nav-item";
        a.textContent = item.label;
        nav.appendChild(a);
      });
    } catch {}
  })();
  </script>

  <button id="new-flow-btn" onclick="newFlow()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    New page flow
  </button>
  <div id="flow-list"></div>
</div>

<div id="main">
  <div id="empty">
    <h2>Build a page flow</h2>
    <p>Create a page flow, add pages, and connect next / previous / error arrows to assemble the visitor journey.</p>
  </div>

  <!-- Level 1: flow canvas -->
  <div id="level1">
    <div id="toolbar">
      <h2 id="flow-title"></h2>
      <div class="legend">
        <span><span class="legend-dot" style="background:#6fe0a5"></span>next</span>
        <span><span class="legend-dot" style="background:#999"></span>previous</span>
        <span><span class="legend-dot" style="background:#ef4444"></span>error</span>
      </div>
      <button class="tbtn tbtn-ghost" onclick="addPage()">+ Add page</button>
      <button class="tbtn tbtn-primary" id="mark-live-btn" onclick="markLive()">Mark live</button>
    </div>
    <div id="canvas-wrap">
      <div id="drawflow"></div>
      <div id="meta-panel">
        <h3>Page</h3>
        <div class="form-field">
          <label>Name</label>
          <input type="text" id="pg-name">
        </div>
        <label class="check-field"><input type="checkbox" id="pg-auth"> Requires auth</label>
        <label class="check-field"><input type="checkbox" id="pg-error"> Is error page</label>
        <div class="form-field">
          <label>Layout</label>
          <select id="pg-layout"></select>
        </div>
        <div class="panel-actions">
          <button class="tbtn tbtn-primary" onclick="savePageMeta()">Save</button>
          <button class="tbtn tbtn-ghost" onclick="openLayoutEditor()">Edit layout →</button>
          <button class="tbtn tbtn-ghost" onclick="deleteSelectedPage()">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Level 2: layout editor -->
  <div id="level2">
    <div id="toolbar">
      <button class="tbtn tbtn-ghost" onclick="backToFlow()">← Back to flow</button>
      <h2 id="l2-page-title"></h2>
    </div>
    <div id="level2-body">
      <div id="layout-grid-wrap">
        <div id="layout-picker"></div>
        <div id="layout-grid"></div>
      </div>
      <div id="widget-config-panel"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let API_KEY = '';
let flows = [];
let currentFlow = null;
let currentPages = [];
let editor = null;
let restoringCanvas = false;
let selectedPageId = null;
let layouts = [];
let widgetTypes = [];
let l2PageId = null;
let l2Widgets = [];
let l2SelectedWidgetId = null;

function esc(s) { return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function apiFetch(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'X-Api-Key': API_KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok ? 'rgba(111,224,165,0.35)' : 'rgba(239,68,68,0.35)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function toggleNavMenu(e) {
  e.stopPropagation();
  document.getElementById('nav-menu').classList.toggle('open');
}
document.addEventListener('click', () => document.getElementById('nav-menu').classList.remove('open'));

// ── Boot ─────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const r = await fetch('/api/admin/key', { credentials: 'include' });
    if (r.ok) { const { key } = await r.json(); API_KEY = key; }
  } catch {}

  try {
    layouts = await apiFetch('/api/admin/page-layouts');
    widgetTypes = await apiFetch('/api/admin/widget-types');
  } catch (e) {
    toast('Failed to load catalog: ' + e.message, false);
  }

  document.getElementById('pg-layout').innerHTML = layouts.map(l => `<option value="${esc(l.id)}">${esc(l.label)}</option>`).join('');

  initDrawflow();
  await loadFlows();
}

function initDrawflow() {
  const container = document.getElementById('drawflow');
  editor = new Drawflow(container);
  editor.start();

  editor.on('nodeMoved', async (id) => {
    const node = editor.getNodeFromId(id);
    const pageId = node.data.pageId;
    try {
      await apiFetch(`/api/admin/pages/${pageId}/position`, {
        method: 'PUT', body: JSON.stringify({ x: node.pos_x, y: node.pos_y })
      });
    } catch (e) { toast('Failed to save position: ' + e.message, false); }
  });

  editor.on('nodeSelected', (id) => {
    const node = editor.getNodeFromId(id);
    selectPage(node.data.pageId);
  });
  editor.on('nodeUnselected', () => {
    selectedPageId = null;
    document.getElementById('meta-panel').classList.remove('visible');
  });

  editor.on('connectionCreated', async (info) => {
    if (restoringCanvas) return;
    await onConnectionChanged(info);
  });
  editor.on('connectionRemoved', async (info) => {
    if (restoringCanvas) return;
    await onConnectionChanged(info);
  });
}

const OUTPUT_FIELD = { output_1: 'nextPageId', output_2: 'previousPageId', output_3: 'errorPageId' };

async function onConnectionChanged(info) {
  const sourceNode = editor.getNodeFromId(info.output_id);
  const sourcePageId = sourceNode.data.pageId;
  const field = OUTPUT_FIELD[info.output_class];
  if (!field) return;

  // Enforce single connection per output port: keep only the most recent.
  const conns = sourceNode.outputs[info.output_class].connections;
  if (conns.length > 1) {
    for (const c of conns.slice(0, -1)) {
      editor.removeSingleConnection(info.output_id, c.node, info.output_class, c.output);
    }
  }
  const remaining = editor.getNodeFromId(info.output_id).outputs[info.output_class].connections;
  const targetPageId = remaining.length ? editor.getNodeFromId(remaining[0].node).data.pageId : null;

  const page = currentPages.find(p => p.id === sourcePageId);
  const targets = { nextPageId: page.nextPageId, previousPageId: page.previousPageId, errorPageId: page.errorPageId };
  targets[field] = targetPageId;

  try {
    const updated = await apiFetch(`/api/admin/pages/${sourcePageId}/nav-targets`, {
      method: 'PUT', body: JSON.stringify(targets)
    });
    Object.assign(page, updated);
  } catch (e) {
    toast('Failed to link pages: ' + e.message, false);
  }
}

// ── Flows ────────────────────────────────────────────────────────────────
async function loadFlows() {
  flows = await apiFetch('/api/admin/page-flows');
  renderFlowList();
}

function renderFlowList() {
  const el = document.getElementById('flow-list');
  el.innerHTML = '';
  for (const f of flows) {
    const div = document.createElement('div');
    div.className = 'flow-item' + (currentFlow && f.id === currentFlow.id ? ' active' : '');
    div.innerHTML = `
      <div class="flow-meta">
        <div class="flow-name">${esc(f.name)}</div>
        <div class="flow-slug">${esc(f.slug)}</div>
        ${f.live ? '<span class="live-pill">Live</span>' : ''}
      </div>
      <button class="flow-delete" onclick="deleteFlow(event,'${f.id}')" title="Delete">✕</button>`;
    div.addEventListener('click', () => openFlow(f.id));
    el.appendChild(div);
  }
}

async function newFlow() {
  const name = prompt('Page flow name:');
  if (!name) return;
  const slug = prompt('URL slug (e.g. "home"):');
  if (!slug) return;
  const f = await apiFetch('/api/admin/page-flows', { method: 'POST', body: JSON.stringify({ name, slug }) });
  await loadFlows();
  openFlow(f.id);
}

async function deleteFlow(e, id) {
  e.stopPropagation();
  if (!confirm('Delete this page flow and all its pages/widgets?')) return;
  await apiFetch(`/api/admin/page-flows/${id}`, { method: 'DELETE' });
  if (currentFlow && currentFlow.id === id) {
    currentFlow = null;
    document.getElementById('level1').style.display = 'none';
    document.getElementById('level2').style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
  }
  await loadFlows();
}

async function openFlow(id) {
  const detail = await apiFetch(`/api/admin/page-flows/${id}`);
  currentFlow = detail.flow;
  currentPages = detail.pages;

  document.getElementById('empty').style.display = 'none';
  document.getElementById('level2').style.display = 'none';
  document.getElementById('level1').style.display = 'flex';
  document.getElementById('flow-title').textContent = currentFlow.name;
  document.getElementById('mark-live-btn').textContent = currentFlow.live ? 'Live' : 'Mark live';
  document.getElementById('meta-panel').classList.remove('visible');
  selectedPageId = null;
  renderFlowList();
  renderCanvas();
}

async function markLive() {
  if (!currentFlow) return;
  try {
    currentFlow = await apiFetch(`/api/admin/page-flows/${currentFlow.id}/live`, { method: 'PUT' });
    document.getElementById('mark-live-btn').textContent = 'Live';
    await loadFlows();
    renderFlowList();
    toast('Marked live.');
  } catch (e) { toast(e.message, false); }
}

// ── Canvas (Level 1) ────────────────────────────────────────────────────
function renderCanvas() {
  restoringCanvas = true;
  editor.clear();
  const idMap = {};
  for (const p of currentPages) {
    const html = `
      <div class="page-node">
        <div class="pn-name">${esc(p.name)}</div>
        <div class="pn-badges">
          <span class="pn-badge">${esc(p.layoutKey)}</span>
          ${p.requiresAuth ? '<span class="pn-badge pn-auth">Auth</span>' : ''}
          ${p.errorPage ? '<span class="pn-badge pn-error">Error</span>' : ''}
        </div>
      </div>`;
    const nodeId = editor.addNode('page', 1, 3, p.canvasX || 0, p.canvasY || 0, 'page-node-wrap', { pageId: p.id }, html);
    idMap[p.id] = nodeId;
  }
  for (const p of currentPages) {
    const sourceId = idMap[p.id];
    if (p.nextPageId && idMap[p.nextPageId] != null) editor.addConnection(sourceId, idMap[p.nextPageId], 'output_1', 'input_1');
    if (p.previousPageId && idMap[p.previousPageId] != null) editor.addConnection(sourceId, idMap[p.previousPageId], 'output_2', 'input_1');
    if (p.errorPageId && idMap[p.errorPageId] != null) editor.addConnection(sourceId, idMap[p.errorPageId], 'output_3', 'input_1');
  }
  restoringCanvas = false;
}

async function addPage() {
  if (!currentFlow) return;
  const name = prompt('Page name:');
  if (!name) return;
  const page = await apiFetch(`/api/admin/page-flows/${currentFlow.id}/pages`, { method: 'POST', body: JSON.stringify({ name }) });
  const idx = currentPages.length;
  page.canvasX = 60 + (idx % 5) * 230;
  page.canvasY = 60 + Math.floor(idx / 5) * 160;
  try {
    await apiFetch(`/api/admin/pages/${page.id}/position`, {
      method: 'PUT', body: JSON.stringify({ x: page.canvasX, y: page.canvasY })
    });
  } catch (e) { toast('Failed to place page: ' + e.message, false); }
  currentPages.push(page);
  renderCanvas();
}

function selectPage(pageId) {
  selectedPageId = pageId;
  const page = currentPages.find(p => p.id === pageId);
  if (!page) return;
  document.getElementById('pg-name').value = page.name;
  document.getElementById('pg-auth').checked = page.requiresAuth;
  document.getElementById('pg-error').checked = page.errorPage;
  document.getElementById('pg-layout').value = page.layoutKey;
  document.getElementById('meta-panel').classList.add('visible');
}

async function savePageMeta() {
  if (!selectedPageId) return;
  const page = currentPages.find(p => p.id === selectedPageId);
  try {
    const updated = await apiFetch(`/api/admin/pages/${selectedPageId}`, {
      method: 'PUT',
      body: JSON.stringify({
        name: document.getElementById('pg-name').value,
        requiresAuth: document.getElementById('pg-auth').checked,
        errorPage: document.getElementById('pg-error').checked
      })
    });
    Object.assign(page, updated);

    const newLayout = document.getElementById('pg-layout').value;
    if (newLayout !== page.layoutKey) {
      const withLayout = await apiFetch(`/api/admin/pages/${selectedPageId}/layout`, {
        method: 'PUT', body: JSON.stringify({ layoutKey: newLayout })
      });
      Object.assign(page, withLayout);
    }
    renderCanvas();
    toast('Saved.');
  } catch (e) { toast(e.message, false); }
}

async function deleteSelectedPage() {
  if (!selectedPageId) return;
  if (!confirm('Delete this page and its widgets?')) return;
  try {
    await apiFetch(`/api/admin/pages/${selectedPageId}`, { method: 'DELETE' });
    currentPages = currentPages.filter(p => p.id !== selectedPageId);
    selectedPageId = null;
    document.getElementById('meta-panel').classList.remove('visible');
    renderCanvas();
  } catch (e) { toast(e.message, false); }
}

// ── Level 2: layout editor ─────────────────────────────────────────────
async function openLayoutEditor() {
  if (!selectedPageId) return;
  l2PageId = selectedPageId;
  const page = currentPages.find(p => p.id === l2PageId);
  document.getElementById('l2-page-title').textContent = page.name;
  document.getElementById('level1').style.display = 'none';
  document.getElementById('level2').style.display = 'flex';
  renderLayoutPicker(page.layoutKey);
  await loadL2Widgets();
}

function backToFlow() {
  document.getElementById('level2').style.display = 'none';
  document.getElementById('level1').style.display = 'flex';
  document.getElementById('widget-config-panel').classList.remove('visible');
  l2SelectedWidgetId = null;
}

function renderLayoutPicker(activeKey) {
  const el = document.getElementById('layout-picker');
  el.innerHTML = layouts.map(l => `<button class="layout-chip${l.id === activeKey ? ' active' : ''}" data-id="${esc(l.id)}">${esc(l.label)}</button>`).join('');
  el.querySelectorAll('.layout-chip').forEach(btn => {
    btn.addEventListener('click', async () => {
      const layoutKey = btn.dataset.id;
      try {
        const page = currentPages.find(p => p.id === l2PageId);
        const updated = await apiFetch(`/api/admin/pages/${l2PageId}/layout`, { method: 'PUT', body: JSON.stringify({ layoutKey }) });
        Object.assign(page, updated);
        renderLayoutPicker(layoutKey);
        await loadL2Widgets();
        toast('Layout changed.');
      } catch (e) { toast(e.message, false); }
    });
  });
}

async function loadL2Widgets() {
  l2Widgets = await apiFetch(`/api/admin/pages/${l2PageId}/widgets`);
  renderLayoutGrid();
}

function renderLayoutGrid() {
  const page = currentPages.find(p => p.id === l2PageId);
  const layout = layouts.find(l => l.id === page.layoutKey);
  const grid = document.getElementById('layout-grid');
  grid.style.gridTemplateColumns = layout.gridTemplateColumns;
  grid.innerHTML = layout.slots.map(slot => {
    const widgets = l2Widgets.filter(w => w.slotKey === slot.key).sort((a, b) => a.orderInSlot - b.orderInSlot);
    return `
      <div class="slot-box" data-slot="${esc(slot.key)}">
        <div class="slot-label">${esc(slot.label)}</div>
        ${widgets.map(w => `
          <div class="widget-chip${w.id === l2SelectedWidgetId ? ' selected' : ''}" data-id="${w.id}">
            <span>${esc(w.label || w.widgetType)}</span>
            <span class="widget-chip-type">${esc(w.widgetType)}</span>
          </div>
        `).join('')}
        <select class="slot-add-select" data-slot="${esc(slot.key)}">
          <option value="">+ Add widget…</option>
          ${widgetTypes.map(t => `<option value="${esc(t.widgetType)}">${esc(t.displayName)}</option>`).join('')}
        </select>
      </div>`;
  }).join('');

  grid.querySelectorAll('.widget-chip').forEach(chip => {
    chip.addEventListener('click', () => selectWidget(chip.dataset.id));
  });
  grid.querySelectorAll('.slot-add-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const widgetType = sel.value;
      if (!widgetType) return;
      try {
        const widget = await apiFetch(`/api/admin/pages/${l2PageId}/widgets`, {
          method: 'POST',
          body: JSON.stringify({ slotKey: sel.dataset.slot, widgetType, label: '', configJson: '{}' })
        });
        l2Widgets.push(widget);
        renderLayoutGrid();
        selectWidget(widget.id);
      } catch (e) { toast(e.message, false); }
    });
  });
}

function selectWidget(id) {
  l2SelectedWidgetId = id;
  renderLayoutGrid();
  const widget = l2Widgets.find(w => w.id === id);
  const descriptor = widgetTypes.find(t => t.widgetType === widget.widgetType);
  const panel = document.getElementById('widget-config-panel');
  let config = {};
  try { config = JSON.parse(widget.configJson || '{}'); } catch {}

  panel.innerHTML = `
    <h3>${esc(descriptor ? descriptor.displayName : widget.widgetType)}</h3>
    <div class="form-field">
      <label>Label</label>
      <input type="text" id="w-label" value="${esc(widget.label || '')}">
    </div>
    <div id="w-config-fields"></div>
    <div class="panel-actions">
      <button class="tbtn tbtn-primary" onclick="saveWidget()">Save</button>
      <button class="tbtn tbtn-ghost" onclick="deleteWidget()">Delete</button>
    </div>
  `;
  const fields = document.getElementById('w-config-fields');
  const options = descriptor ? descriptor.configOptions : [];
  fields.innerHTML = options.map(o => {
    const id = `w-opt-${o.key}`;
    const value = config[o.key] !== undefined ? config[o.key] : (o.defaultValue || '');
    if (o.type === 'BOOLEAN') {
      return `<label class="check-field"><input type="checkbox" id="${id}" data-key="${esc(o.key)}" ${value === true || value === 'true' ? 'checked' : ''}> ${esc(o.label)}</label>`;
    }
    if (o.type === 'SELECT') {
      return `<div class="form-field"><label>${esc(o.label)}</label>
        <select id="${id}" data-key="${esc(o.key)}">
          ${(o.allowedValues || []).map(v => `<option value="${esc(v)}"${v === value ? ' selected' : ''}>${esc(v)}</option>`).join('')}
        </select></div>`;
    }
    return `<div class="form-field"><label>${esc(o.label)}</label><input type="text" id="${id}" data-key="${esc(o.key)}" value="${esc(value)}"></div>`;
  }).join('');

  panel.classList.add('visible');
}

function collectWidgetConfig() {
  const result = {};
  document.getElementById('w-config-fields').querySelectorAll('[data-key]').forEach(input => {
    result[input.dataset.key] = input.type === 'checkbox' ? input.checked : input.value;
  });
  return result;
}

async function saveWidget() {
  if (!l2SelectedWidgetId) return;
  const widget = l2Widgets.find(w => w.id === l2SelectedWidgetId);
  try {
    const updated = await apiFetch(`/api/admin/pages/${l2PageId}/widgets/${l2SelectedWidgetId}`, {
      method: 'PUT',
      body: JSON.stringify({
        slotKey: widget.slotKey,
        orderInSlot: widget.orderInSlot,
        label: document.getElementById('w-label').value,
        configJson: JSON.stringify(collectWidgetConfig())
      })
    });
    Object.assign(widget, updated);
    renderLayoutGrid();
    toast('Saved.');
  } catch (e) { toast(e.message, false); }
}

async function deleteWidget() {
  if (!l2SelectedWidgetId) return;
  if (!confirm('Delete this widget?')) return;
  try {
    await apiFetch(`/api/admin/pages/${l2PageId}/widgets/${l2SelectedWidgetId}`, { method: 'DELETE' });
    l2Widgets = l2Widgets.filter(w => w.id !== l2SelectedWidgetId);
    l2SelectedWidgetId = null;
    document.getElementById('widget-config-panel').classList.remove('visible');
    renderLayoutGrid();
  } catch (e) { toast(e.message, false); }
}

boot();
</script>
</body>
</html>
