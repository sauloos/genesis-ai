<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis — Themes</title>
<link rel="stylesheet" href="/api/themes/active/styles.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-bg-image: url('/bg-earth.jpg');
    --theme-bg-transform: rotate(180deg);
    --theme-bg-overlay: rgba(0, 0, 10, 0.52);
    --theme-body-bg: #000010;
    --theme-text-primary: #f2f2f2;
    --theme-text-muted: rgba(255, 255, 255, 0.52);
    --theme-text-label: rgba(255, 255, 255, 0.38);
    --theme-section-label: rgba(255, 255, 255, 0.28);
    --theme-card-bg: rgba(255, 255, 255, 0.07);
    --theme-card-bg-hover: rgba(255, 255, 255, 0.12);
    --theme-card-border: rgba(255, 255, 255, 0.10);
    --theme-card-icon-bg: rgba(255, 255, 255, 0.08);
    --theme-card-icon-border: rgba(255, 255, 255, 0.10);
    --theme-card-shadow: rgba(0, 0, 0, 0.3);
    --theme-divider: rgba(255, 255, 255, 0.08);
    --theme-backdrop: blur(12px);
    --theme-btn-color: rgba(255, 255, 255, 0.4);
    --theme-btn-border: rgba(255, 255, 255, 0.12);
    --theme-btn-color-hover: rgba(255, 255, 255, 0.75);
    --theme-btn-border-hover: rgba(255, 255, 255, 0.3);
    --theme-env-badge-bg: rgba(0, 0, 0, 0.4);
    --theme-env-badge-border: rgba(255, 255, 255, 0.08);
    --theme-link-color: rgba(255, 255, 255, 0.5);
    --theme-link-border: rgba(255, 255, 255, 0.18);
    --theme-link-color-hover: rgba(255, 255, 255, 0.85);
    --theme-link-border-hover: rgba(255, 255, 255, 0.4);
    --theme-go-color: rgba(255, 255, 255, 0.28);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    color: var(--theme-text-primary);
    background: var(--theme-body-bg);
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--theme-bg-image) var(--theme-bg-position, center center) / var(--theme-bg-size, cover) no-repeat;
    transform: var(--theme-bg-transform, none);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--theme-bg-overlay);
    z-index: -1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 40px 0;
  }
  .back-btn {
    font-size: 12px;
    color: var(--theme-btn-color);
    background: none;
    border: 1px solid var(--theme-btn-border);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-btn:hover { color: var(--theme-btn-color-hover); border-color: var(--theme-btn-border-hover); }

  .import-btn {
    font-size: 12px;
    font-weight: 600;
    color: #6fe0a5;
    background: rgba(111,224,165,0.1);
    border: 1px solid rgba(111,224,165,0.25);
    border-radius: 6px;
    padding: 5px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .import-btn:hover { background: rgba(111,224,165,0.18); border-color: rgba(111,224,165,0.4); }

  .hero {
    text-align: center;
    padding: 36px 24px 32px;
  }
  .hero-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--theme-text-label);
    margin-bottom: 10px;
  }
  .hero h1 {
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--theme-text-primary);
  }
  .hero-sub {
    font-size: 14px;
    color: var(--theme-text-muted);
    margin-top: 8px;
  }

  .main {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── Theme grid ── */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .theme-card {
    background: var(--theme-card-bg);
    border: 1px solid var(--theme-card-border);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: var(--theme-backdrop);
    -webkit-backdrop-filter: var(--theme-backdrop);
    transition: border-color 0.18s, box-shadow 0.18s;
    position: relative;
  }
  .theme-card.active {
    border-color: rgba(111,224,165,0.5);
    box-shadow: 0 0 0 1px rgba(111,224,165,0.18);
  }
  .theme-card.active::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #6fe0a5, #4caf7d);
  }

  /* ── Theme preview swatch ── */
  .theme-preview {
    height: 80px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .swatch-dots {
    display: flex;
    gap: 6px;
    position: relative;
    z-index: 1;
  }
  .swatch-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .theme-body {
    padding: 18px 20px 16px;
  }

  .theme-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .theme-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--theme-text-primary);
  }
  .badge-active {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(111,224,165,0.15);
    color: #6fe0a5;
    border: 1px solid rgba(111,224,165,0.25);
  }
  .badge-builtin {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.05);
    color: var(--theme-text-muted);
    border: 1px solid var(--theme-card-border);
  }

  .theme-version {
    font-size: 11px;
    color: var(--theme-text-muted);
    margin-bottom: 8px;
  }
  .theme-desc {
    font-size: 12px;
    color: var(--theme-text-muted);
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .theme-actions {
    display: flex;
    gap: 8px;
  }
  .btn-activate {
    flex: 1;
    font-size: 12px;
    font-weight: 600;
    color: #6fe0a5;
    background: rgba(111,224,165,0.1);
    border: 1px solid rgba(111,224,165,0.25);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-activate:hover { background: rgba(111,224,165,0.2); border-color: rgba(111,224,165,0.45); }
  .btn-activate:disabled {
    color: var(--theme-text-muted);
    background: transparent;
    border-color: var(--theme-card-border);
    cursor: default;
  }
  .btn-delete {
    font-size: 12px;
    color: rgba(239,68,68,0.7);
    background: rgba(239,68,68,0.07);
    border: 1px solid rgba(239,68,68,0.18);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-delete:hover { background: rgba(239,68,68,0.14); }

  /* ── Import area ── */
  .import-area {
    display: none;
    margin-bottom: 28px;
    background: var(--theme-card-bg);
    border: 1px dashed var(--theme-card-border);
    border-radius: 14px;
    padding: 28px;
    text-align: center;
    backdrop-filter: var(--theme-backdrop);
    -webkit-backdrop-filter: var(--theme-backdrop);
  }
  .import-area.open { display: block; }
  .import-area p {
    font-size: 13px;
    color: var(--theme-text-muted);
    margin-bottom: 14px;
  }
  .import-area input[type=file] { display: none; }
  .import-label {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    color: #6fe0a5;
    background: rgba(111,224,165,0.1);
    border: 1px solid rgba(111,224,165,0.25);
    border-radius: 7px;
    padding: 8px 18px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .import-label:hover { background: rgba(111,224,165,0.18); }
  .import-filename {
    margin-top: 10px;
    font-size: 12px;
    color: var(--theme-text-muted);
  }
  .import-submit {
    margin-top: 14px;
    display: none;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: #6fe0a5;
    border: none;
    border-radius: 7px;
    padding: 8px 20px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .import-submit:hover { opacity: 0.88; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--theme-text-muted);
    font-size: 14px;
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 32px;
    right: 24px;
    background: rgba(30,30,40,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13px;
    color: #f2f2f2;
    backdrop-filter: blur(12px);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 480px) {
    header { padding: 20px 16px 0; }
    .hero { padding: 28px 16px 24px; }
    .main { padding: 0 12px 60px; }
  }
</style>
</head>
<body>

<header>
  <a href="/dashboard" class="back-btn">← Dashboard</a>
  <button class="import-btn" id="toggleImport">Import theme</button>
</header>

<div class="hero">
  <div class="hero-label">Brain Engine</div>
  <h1>Themes</h1>
  <p class="hero-sub">Select and manage the visual theme applied to this tenant. Theme changes take effect on the next page load.</p>
</div>

<div class="main">

  <div class="import-area" id="importArea">
    <p>Import a theme bundle (.zip) produced by the tenant's theme module build task.</p>
    <label class="import-label" for="themeFile">Choose .zip file</label>
    <input type="file" id="themeFile" accept=".zip">
    <div class="import-filename" id="importFilename"></div>
    <button class="import-submit" id="importSubmit">Upload &amp; Install</button>
  </div>

  <div class="theme-grid" id="themeGrid">
    <div class="empty">Loading themes…</div>
  </div>

</div>

<div id="toast"></div>

<script>
let API_KEY = '';

async function apiFetch(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'X-Api-Key': API_KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok ? 'rgba(111,224,165,0.35)' : 'rgba(239,68,68,0.35)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Swatch colors per theme id
const SWATCHES = {
  'genesis-brands':      { bg: '#000a1a', dots: ['#6fe0a5', '#4caf7d', '#1a2e3f'] },
  'genesis-core-dark':   { bg: '#0e0e16', dots: ['#7c9ef8', '#5a7de8', '#1e1e2a'] },
  'genesis-core-minimal':{ bg: '#f5f4f0', dots: ['#18182e', '#4a4a6a', '#e0dfd8'] },
  'genesis-core-light':  { bg: '#ffffff', dots: ['#111120', '#6fe0a5', '#e8e8f0'] },
};

function renderThemes(themes) {
  const grid = document.getElementById('themeGrid');
  if (!themes.length) {
    grid.innerHTML = '<div class="empty">No themes installed.</div>';
    return;
  }
  grid.innerHTML = themes.map(t => {
    const sw = SWATCHES[t.id] || { bg: '#1a1a2e', dots: ['#888', '#666', '#444'] };
    const isActive = t.active;
    return `
      <div class="theme-card ${isActive ? 'active' : ''}" data-id="${t.id}">
        <div class="theme-preview" style="background:${sw.bg}">
          <div class="swatch-dots">
            ${sw.dots.map(c => `<div class="swatch-dot" style="background:${c}"></div>`).join('')}
          </div>
        </div>
        <div class="theme-body">
          <div class="theme-name-row">
            <span class="theme-name">${t.name}</span>
            ${isActive ? '<span class="badge-active">Active</span>' : ''}
            ${t.builtIn ? '<span class="badge-builtin">Built-in</span>' : ''}
          </div>
          <div class="theme-version">v${t.version}</div>
          <div class="theme-desc">${t.description || ''}</div>
          <div class="theme-actions">
            <button class="btn-activate" data-id="${t.id}" ${isActive ? 'disabled' : ''}>${isActive ? 'Active' : 'Activate'}</button>
            ${!t.builtIn ? `<button class="btn-delete" data-id="${t.id}">Delete</button>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.btn-activate:not([disabled])').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await apiFetch(`/api/themes/${btn.dataset.id}/activate`, { method: 'PUT' });
        toast('Theme activated — reload any open page to see it applied.');
        load();
        reloadThemeLink();
      } catch (e) { toast(e.message, false); }
    });
  });

  grid.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this theme?')) return;
      try {
        await apiFetch(`/api/themes/${btn.dataset.id}`, { method: 'DELETE' });
        toast('Theme deleted.');
        load();
      } catch (e) { toast(e.message, false); }
    });
  });
}

function reloadThemeLink() {
  const link = document.querySelector('link[href="/api/themes/active/styles.css"]');
  if (link) link.href = `/api/themes/active/styles.css?t=${Date.now()}`;
}

async function load() {
  try {
    const themes = await apiFetch('/api/themes');
    renderThemes(themes);
  } catch (e) {
    document.getElementById('themeGrid').innerHTML = `<div class="empty">Error loading themes: ${e.message}</div>`;
  }
}

// Import toggle
document.getElementById('toggleImport').addEventListener('click', () => {
  document.getElementById('importArea').classList.toggle('open');
});

// File selection
document.getElementById('themeFile').addEventListener('change', e => {
  const f = e.target.files[0];
  document.getElementById('importFilename').textContent = f ? f.name : '';
  document.getElementById('importSubmit').style.display = f ? 'inline-block' : 'none';
});

// Import submit
document.getElementById('importSubmit').addEventListener('click', async () => {
  const file = document.getElementById('themeFile').files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/api/themes/import', { method: 'POST', headers: { 'X-Api-Key': API_KEY }, body: fd });
    if (!r.ok) throw new Error(await r.text());
    toast('Theme imported successfully.');
    document.getElementById('importArea').classList.remove('open');
    document.getElementById('themeFile').value = '';
    document.getElementById('importFilename').textContent = '';
    document.getElementById('importSubmit').style.display = 'none';
    load();
  } catch (e) { toast(e.message, false); }
});

// Fetch the API key from the admin session, then load
(async () => {
  try {
    const r = await fetch('/api/admin/key', { credentials: 'include' });
    if (r.ok) { const { key } = await r.json(); API_KEY = key; }
  } catch {}
  load();
})();
</script>
</body>
</html>
