<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Genesis AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f6f6f4; color: #1a1a1a; min-height: 100vh; }

  /* ── Header ── */
  #topbar { background: #fff; border-bottom: 1px solid #e8e8e8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; height: 56px; }
  .brand { font-size: 13px; font-weight: 800; letter-spacing: 0.8px; color: #1a1a1a; }
  #user-area { font-size: 12px; color: #999; display: flex; gap: 12px; align-items: center; }
  #user-area a { color: #666; text-decoration: none; }
  #user-area a:hover { color: #1a1a1a; }

  /* ── Layout ── */
  #content { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; }
  #page-header { margin-bottom: 28px; }
  #page-header h1 { font-size: 26px; font-weight: 800; }
  #page-header p { color: #666; font-size: 14px; margin-top: 6px; }

  #layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
  @media (max-width: 860px) { #layout { grid-template-columns: 1fr; } }
  #right-col { display: flex; flex-direction: column; gap: 20px; }

  .panel { background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 24px 26px; }
  .panel-label { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
    color: #999; margin-bottom: 16px; }
  .panel-empty { font-size: 13px; color: #999; padding: 16px 0; }

  /* ── Agent cards (left) ── */
  .agent-card { border: 1px solid #eee; border-radius: 12px; padding: 16px 18px; margin-bottom: 12px;
    opacity: 0.55; }
  .agent-card:last-child { margin-bottom: 0; }
  .agent-name { font-size: 14px; font-weight: 700; }
  .agent-desc { font-size: 12px; color: #888; margin-top: 4px; line-height: 1.4; }
  .agent-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.4px;
    text-transform: uppercase; background: #f2f2f2; color: #999; padding: 2px 8px; border-radius: 20px;
    margin-top: 8px; }

  /* ── Asset panel (top right) ── */
  .engagement-block { border-top: 1px solid #f0f0f0; padding: 16px 0; }
  .engagement-block:first-child { border-top: none; padding-top: 0; }
  .engagement-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .engagement-sub { font-size: 12px; color: #999; margin-bottom: 12px; }
  .asset-row { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
  .asset-row:last-child { border-bottom: none; }
  .asset-row-label { font-size: 13px; font-weight: 600; }
  .asset-row-actions { display: flex; gap: 8px; }
  .asset-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #ddd; background: #fff;
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .asset-btn:hover { border-color: #1a1a1a; }
  .asset-btn:disabled { opacity: 0.5; cursor: default; }
  .locked-note { font-size: 12px; color: #b5872a; }

  /* ── Catalog panel (bottom right) ── */
  .coming-soon { display: flex; align-items: center; justify-content: center; min-height: 120px;
    color: #bbb; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">GENESIS AI</div>
  <div id="user-area">
    <span id="user-name"></span>
    <a href="#" id="logout-link" onclick="logout()">Sign out</a>
  </div>
</div>

<div id="content">
  <div id="page-header">
    <h1>Your dashboard</h1>
    <p>Downloadable assets, on-demand brand agents, and products for your brand.</p>
  </div>

  <div id="layout">
    <div class="panel" id="agents-panel">
      <div class="panel-label">Brand Agents</div>
      <div id="agents-list"></div>
    </div>

    <div id="right-col">
      <div class="panel" id="assets-panel">
        <div class="panel-label">Your Assets</div>
        <div id="assets-list"><div class="panel-empty">Loading…</div></div>
      </div>

      <div class="panel" id="catalog-panel">
        <div class="panel-label">Catalog</div>
        <div class="coming-soon">Products for your brand — coming soon</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';
const KEY = 'genesis-ai-key';
const HEADERS = { 'Content-Type': 'application/json', 'X-Api-Key': KEY };

const AGENTS = [
  { name: 'Copy', desc: 'Tagline, mission, brand story, elevator pitch, tone guide' },
  { name: 'Visual Identity', desc: 'Colour palette and typography' },
  { name: 'Logo', desc: 'Logo mark concept' },
  { name: 'Playbook Assembly', desc: 'Brand playbook document' },
  { name: 'Brand Book Assembly', desc: 'Brand book PDF' },
];

async function boot() {
  try {
    const me = await fetch(`${API}/api/auth/me`, { headers: HEADERS }).then(r => r.json());
    document.getElementById('user-name').textContent = me.name || me.email || '';
  } catch (_) { /* header still renders without a name */ }

  renderAgentCards();
  await loadAssets();
}

function renderAgentCards() {
  const el = document.getElementById('agents-list');
  el.innerHTML = AGENTS.map(a => `
    <div class="agent-card">
      <div class="agent-name">${esc(a.name)}</div>
      <div class="agent-desc">${esc(a.desc)}</div>
      <div class="agent-badge">Coming soon</div>
    </div>
  `).join('');
}

async function loadAssets() {
  const listEl = document.getElementById('assets-list');
  try {
    const mine = await fetch(`${API}/api/engagements/mine`, { headers: HEADERS }).then(r => {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
    const done = mine.filter(e => e.status === 'DONE');
    if (done.length === 0) {
      listEl.innerHTML = '<div class="panel-empty">No brand assets yet. Complete a brand journey to see your downloads here.</div>';
      return;
    }
    const blocks = await Promise.all(done.map(renderEngagementBlock));
    listEl.innerHTML = blocks.join('');
  } catch (err) {
    listEl.innerHTML = '<div class="panel-empty">Could not load your assets right now.</div>';
  }
}

async function renderEngagementBlock(summary) {
  let detail;
  try {
    detail = await fetch(`${API}/api/engagements/${summary.id}`, { headers: HEADERS }).then(r => r.json());
  } catch (_) {
    return '';
  }
  if (!detail.results) return '';

  const dirs = detail.results.directions || [];
  const brandName = dirs[0]?.brief?.brand?.name || 'Your brand';
  const downloadAllowed = detail.downloadAllowed;

  const rows = dirs.map(dir => {
    const label = dir.direction.charAt(0) + dir.direction.slice(1).toLowerCase();
    const hasLogo = !!dir.logoZipBlobPath;
    const actions = downloadAllowed
      ? `<button class="asset-btn" onclick="downloadPdf('${esc(summary.id)}','${esc(dir.direction)}')">↓ PDF</button>`
        + (hasLogo ? `<button class="asset-btn" onclick="downloadLogos('${esc(summary.id)}','${esc(dir.direction)}')">↓ Logos</button>` : '')
      : `<span class="locked-note">Locked</span>`;
    return `<div class="asset-row">
      <div class="asset-row-label">${esc(label)} — Brand Book${hasLogo ? ' + Logos' : ''}</div>
      <div class="asset-row-actions">${actions}</div>
    </div>`;
  }).join('');

  return `<div class="engagement-block">
    <div class="engagement-title">${esc(brandName)}</div>
    <div class="engagement-sub">${downloadAllowed ? 'Unlocked' : 'Payment required to unlock downloads'}</div>
    ${rows}
  </div>`;
}

async function downloadPdf(engagementId, direction) {
  const btn = event && event.target;
  if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
  try {
    const res = await fetch(`${API}/api/engagements/${engagementId}/pdf/${direction}`, { headers: HEADERS });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `brand-book-${direction.toLowerCase()}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('PDF download failed: ' + (err.message || err));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '↓ PDF'; }
  }
}

async function downloadLogos(engagementId, direction) {
  const res = await fetch(`${API}/api/engagements/${engagementId}/logos/${direction}`, { headers: HEADERS });
  if (!res.ok) { alert('Logos not available yet.'); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `logos-${direction.toLowerCase()}.zip`;
  a.click();
  URL.revokeObjectURL(url);
}

async function logout() {
  await fetch(`${API}/api/auth/logout`, { method: 'POST', headers: HEADERS });
  window.location.href = '/';
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
           .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

boot();
</script>
</body>
</html>
