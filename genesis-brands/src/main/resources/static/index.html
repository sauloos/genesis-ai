<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis AI</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Background: image flipped so earth is at bottom, space at top */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url('/bg-earth.jpg') center center / cover no-repeat;
    transform: rotate(180deg);
    z-index: -1;
  }

  /* Subtle dark overlay so text reads cleanly */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 10, 0.38);
    z-index: -1;
  }

  .wrap {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .logo {
    display: block;
    margin: 0 auto 36px;
    height: 52px;
    width: auto;
  }

  h1 {
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.2;
    margin: 0 0 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  p.sub {
    color: rgba(242, 242, 242, 0.72);
    font-size: 17px;
    line-height: 1.6;
    margin: 0 0 40px;
  }

  form {
    display: flex;
    gap: 10px;
    max-width: 420px;
    margin: 0 auto;
  }

  input[type=email] {
    flex: 1;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #f2f2f2;
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 15px;
    outline: none;
    backdrop-filter: blur(6px);
  }
  input[type=email]:focus { border-color: rgba(255,255,255,0.5); }
  input[type=email]::placeholder { color: rgba(242,242,242,0.4); }

  button {
    background: #f2f2f2;
    color: #0a0a0a;
    border: none;
    border-radius: 8px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #d8d8d8; }
  button:disabled { opacity: 0.6; cursor: default; }

  #msg {
    margin-top: 16px;
    font-size: 14px;
    min-height: 18px;
  }
  #msg.ok  { color: #6fd08c; }
  #msg.err { color: #e07a7a; }

  .admin-link {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 5px;
    padding: 4px 12px;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .admin-link:hover { color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.4); }

  @media (max-width: 480px) {
    form { flex-direction: column; }
    .logo { height: 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <img src="/logo.png" alt="Genesis" class="logo">
  <h1>We're building the AI creative director.</h1>
  <p class="sub">
    Genesis AI conducts brand discovery, directs specialist agents, and assembles
    complete brand identities — leave your email and we'll let you know the moment
    beta access opens.
  </p>
  <form id="signup-form">
    <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
    <button type="submit" id="submit-btn">Notify me</button>
  </form>
  <div id="msg"></div>
</div>

<a href="/dashboard" class="admin-link">Access admin dashboard</a>

<script>
const form = document.getElementById('signup-form');
const emailInput = document.getElementById('email');
const btn = document.getElementById('submit-btn');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim();
  if (!email) return;

  btn.disabled = true;
  msg.className = '';
  msg.textContent = '';

  try {
    const res = await fetch('/api/waitlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (res.ok) {
      msg.className = 'ok';
      msg.textContent = data.message || "You're on the list.";
      emailInput.value = '';
    } else {
      msg.className = 'err';
      msg.textContent = data.error || 'Something went wrong. Please try again.';
    }
  } catch (err) {
    msg.className = 'err';
    msg.textContent = 'Something went wrong. Please try again.';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
