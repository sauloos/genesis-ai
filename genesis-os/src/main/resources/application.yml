spring:
  application:
    name: genesis-os
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/genesis-os;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: claude-opus-5-5
          max-tokens: 8000
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

genesis:
  environment: ${APP_ENV:dev}
  api-key: ${GENESIS_API_KEY:dev-key-change-in-prod}
  allowed-hosts: ${GENESIS_ALLOWED_HOSTS:}
  basic-auth:
    username: ${BASIC_AUTH_USERNAME:genesis}
    password: ${BASIC_AUTH_PASSWORD:change-me-in-prod}
  google-oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  training:
    interpretation:
      enabled: true
      model: claude-haiku-4-5
  agents:
    summarizer:
      model: claude-haiku-4-5
      system-prompt: agents/summarizer/system.md
      max-tokens: 4000
      rag:
        enabled: true
        top-k: 3
    support-faq:
      model: claude-haiku-4-5
      system-prompt: agents/support-faq/system.md
      max-tokens: 1500
      rag:
        enabled: true
        top-k: 3
    compliance-qa:
      model: claude-sonnet-5
      system-prompt: agents/compliance-qa/system.md
      max-tokens: 2000
      rag:
        enabled: true
        top-k: 5
    rfp-response:
      model: claude-opus-5
      system-prompt: agents/rfp-response/system.md
      max-tokens: 6000
      rag:
        enabled: true
        top-k: 5
    research-synthesis:
      model: claude-sonnet-5
      system-prompt: agents/research-synthesis/system.md
      max-tokens: 5000
      rag:
        enabled: true
        top-k: 5
    writer:
      model: claude-sonnet-5
      system-prompt: agents/writer/system.md
      max-tokens: 3000
      rag:
        enabled: true
        top-k: 3
