rootProject.name = 'genesis-platform'
include 'shared-domain'
include 'brain-engine-core'
include 'genesis-brands'

// Each directory under themes/ is its own buildable, independently zippable theme —
// dropping in a new folder is enough to pick it up, no edit needed here.
new File(settingsDir, 'themes').eachDir { dir ->
    include "themes:${dir.name}"
    project(":themes:${dir.name}").projectDir = dir
}
