rootProject.name = 'genesis-platform'
include 'shared-domain'

// Genesis OS aggregator — agent SDK, runtime, one module per OS agent, and the OS app.
include 'os:agent-sdk'
include 'os:widget-sdk'
include 'os:runtime'
include 'os:connectors'
include 'os:standing'
include 'os:channel-sdk'
include 'os:publishing'
include 'os:app'

// Each directory under os/agents/ is its own agent module — dropping in a new folder (with a
// build.gradle) is enough to build it; an app adopts it by declaring a dependency on it.
def osAgentsDir = new File(settingsDir, 'os/agents')
if (osAgentsDir.exists()) {
    osAgentsDir.eachDir { dir ->
        if (new File(dir, 'build.gradle').exists()) include "os:agents:${dir.name}"
    }
}

// Each directory under os/widgets/ is its own widget module (WidgetDescriptor bean + its
// static/widgets/<type>/ client module), adopted the same way as an agent.
def osWidgetsDir = new File(settingsDir, 'os/widgets')
if (osWidgetsDir.exists()) {
    osWidgetsDir.eachDir { dir ->
        if (new File(dir, 'build.gradle').exists()) include "os:widgets:${dir.name}"
    }
}

// Each directory under os/channels/ is a PublishChannel module (one social platform); an app
// adopts a platform by declaring a dependency on it, exactly like an agent.
def osChannelsDir = new File(settingsDir, 'os/channels')
if (osChannelsDir.exists()) {
    osChannelsDir.eachDir { dir ->
        if (new File(dir, 'build.gradle').exists()) include "os:channels:${dir.name}"
    }
}

// Genesis Brands aggregator — the tenant app plus one module per Genesis Brands agent.
include 'brands:app'

def brandsAgentsDir = new File(settingsDir, 'brands/agents')
if (brandsAgentsDir.exists()) {
    brandsAgentsDir.eachDir { dir ->
        if (new File(dir, 'build.gradle').exists()) include "brands:agents:${dir.name}"
    }
}

def brandsWidgetsDir = new File(settingsDir, 'brands/widgets')
if (brandsWidgetsDir.exists()) {
    brandsWidgetsDir.eachDir { dir ->
        if (new File(dir, 'build.gradle').exists()) include "brands:widgets:${dir.name}"
    }
}

// Each directory under themes/ is its own buildable, independently zippable theme —
// dropping in a new folder is enough to pick it up, no edit needed here.
def themesDir = new File(settingsDir, 'themes')
if (themesDir.exists()) {
    themesDir.eachDir { dir ->
        include "themes:${dir.name}"
        project(":themes:${dir.name}").projectDir = dir
    }
}
