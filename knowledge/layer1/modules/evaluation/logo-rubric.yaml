module: logo-evaluation-rubric
version: 2.0
description: >
  Criteria Genesis AI uses to evaluate the Logo Agent's output before accepting it. For the image
  methods (dalle = the OpenAI/Azure gpt-image model, ideogram) the output is a logo system: a
  primary lockup (symbol + wordmark) chosen from several candidates, and the symbol cut from it.
  For svg_concept it is a single SVG mark. The bar is studio-grade identity work — a logo a
  design-literate client would pay a top agency for — not logo-generator output.

evaluation_dimensions:

  - name: on_brief
    weight: critical
    description: Does the logo carry a specific idea from this brand's brief?
    pass_criteria: The symbol's idea is traceable to a specific signal in the brief (differentiator, story, personality) and could not belong to any brand in the category.
    fail_criteria: The symbol is the first cliché associated with the industry (a cup for coffee, a leaf for anything "natural", a swoosh, a globe, a lightbulb, a generic monogram in a circle).

  - name: archetype_consistency
    weight: critical
    description: Is the logo consistent with the archetype and the creative direction?
    pass_criteria: Weight, geometry, typography and tone are congruent with the archetype, and the posture fits the direction — ANCHORED builds on owned equity with exceptional craft, EVOLVED stretches it forward, DISRUPTIVE breaks the category's visual codes.
    fail_criteria: The logo contradicts the archetype or the direction (e.g. a DISRUPTIVE direction rendered as a safe corporate crest).

  - name: craft
    weight: critical
    description: Does it look like finished work from a leading identity studio?
    pass_criteria: Confident, reduced shapes with optical balance; consistent stroke weights; considered negative space; flat fills; nothing superfluous.
    fail_criteria: Clip-art or illustrative detail, gradients, glow, drop shadows, bevels, 3D, lumpy or wobbly shapes, or the generic look of a logo generator.
    method_notes:
      dalle: Judge from the image itself, not the description.
      ideogram: Judge from the image itself, not the description.

  - name: typography
    weight: high
    description: Is the wordmark designed, and does it belong to the direction's identity?
    pass_criteria: The name is set in the direction's headline typeface or a faithful match, with deliberate case, weight and spacing, and sits in a clear, proportioned relationship with the symbol.
    fail_criteria: Default-looking type, awkward spacing, a wordmark that fights or dwarfs the symbol, or type unrelated to the visual identity.
    method_notes:
      svg_concept: Applies only when the SVG includes a wordmark.

  - name: distinctiveness
    weight: high
    description: Would this logo be recognisable and ownable against category competitors?
    pass_criteria: A specific, unusual visual idea (a shape relationship, negative-space device, double reading, construction rule) with a clear rationale for this brand.
    fail_criteria: A stock symbol (generic swoosh, abstract globe, interlocking circles) with no brand-specific rationale.

  - name: legibility_and_scalability
    weight: high
    description: Does the system survive reduction?
    pass_criteria: The symbol alone reads at favicon size and in one flat colour; the lockup reads at a small header size.
    fail_criteria: Relies on fine detail, hairlines, many colours or gradients to read.
    method_notes:
      dalle: Zoom mentally to favicon scale on the symbol; flag detail that would not survive.
      svg_concept: Judge from the construction and markup — flag many path nodes, thin strokes, or effects that don't translate to a flat mark.

  - name: technical_quality
    weight: high
    description: Is the output technically sound for its method?
    pass_criteria: N/A — see method_notes.
    fail_criteria: N/A — see method_notes.
    method_notes:
      dalle: One isolated lockup on a transparent background, the brand name spelled exactly, no other text, no mockup, sheet, frame or scene.
      ideogram: Same as dalle.
      svg_concept: SVG markup (if present) is well-formed and matches the written concept description.

rejection_triggers:
  # If any of these are present, return the output for revision regardless of other scores.
  - The brand name is misspelled, or there are garbled letters or any text beyond the brand name
  - The symbol is a recognisable category cliché or stock symbol with no brand-specific rationale
  - Image methods — the image is a mockup, scene, presentation sheet or set of variations rather than one isolated lockup
  - svg_concept method — markup is malformed or contradicts the written concept description
  - Concept description or symbolism is under 2 sentences or purely a list of adjectives

feedback_format: >
  When returning logo output for revision, lead with what is working before stating what needs to
  change. Be specific about the visual element and the problem, and suggest the direction of
  improvement (not the exact fix — that is the Logo Agent's job). For the image methods the next
  attempt is a fresh set of candidates drawn from a new prompt, not an edit — describe the
  concept, symbol, typography or composition change needed, not a pixel-level correction.
