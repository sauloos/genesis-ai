<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220"
     role="img" aria-label="A continuous-tone duotone scene: a soft horizon, a diffuse sun and a blurred foreground ridge">
  <!-- Pair: imagery. Deliberately NOT a photograph — the kit ships no screenshots and no real
       brands. This is an originated continuous-tone abstraction standing for a
       photography-led identity; imagery-illustrated.svg draws the same scene as flat vector. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28343F"/>
      <stop offset="0.62" stop-color="#8E8E88"/>
      <stop offset="1" stop-color="#CFC7B9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="320" height="220" fill="url(#sky)"/>
  <circle cx="212" cy="92" r="30" fill="#F2E7D4" opacity="0.88" filter="url(#soft)"/>
  <path d="M0 148 C 58 128 112 156 168 140 C 220 126 272 148 320 134 L320 220 L0 220 Z"
        fill="#1B232B" opacity="0.9" filter="url(#softer)"/>
  <path d="M0 176 C 70 164 128 186 196 174 C 252 164 288 180 320 172 L320 220 L0 220 Z"
        fill="#0E1318" opacity="0.85" filter="url(#softer)"/>
  <rect width="320" height="220" fill="#55697A" opacity="0.14"/>
</svg>
