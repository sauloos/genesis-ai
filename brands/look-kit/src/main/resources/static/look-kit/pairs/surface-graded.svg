<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220"
     role="img" aria-label="The same three panels carrying gradients and a fine grain texture">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E8699"/><stop offset="1" stop-color="#3C4E5E"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A2E35"/><stop offset="1" stop-color="#0E1013"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B7BBC1"/><stop offset="1" stop-color="#7E838A"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="320" height="220" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="panels">
      <rect x="24" y="28" width="128" height="164"/>
      <rect x="164" y="28" width="132" height="78"/>
      <rect x="164" y="114" width="132" height="78"/>
    </clipPath>
  </defs>
  <rect width="320" height="220" fill="#F2F1ED"/>
  <rect x="24" y="28" width="128" height="164" fill="url(#g1)"/>
  <rect x="164" y="28" width="132" height="78" fill="url(#g2)"/>
  <rect x="164" y="114" width="132" height="78" fill="url(#g3)"/>
  <!-- The grain sits over the panels only: feTurbulence fills its whole filter region, so the
       clip path, not the filter's input geometry, is what keeps it off the ground. -->
  <g clip-path="url(#panels)" opacity="0.2">
    <rect width="320" height="220" filter="url(#grain)"/>
  </g>
</svg>
