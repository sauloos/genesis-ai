<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220"
     role="img" aria-label="An invented wordmark set in a serif face, centred over a rule">
  <!-- Pair: wordmark. Only the face changes between this and wordmark-sans.svg; the word,
       the geometry, the rule and the subline are identical so the choice measures taste. -->
  <rect width="320" height="220" fill="#F2F1ED"/>
  <text x="160" y="112" text-anchor="middle" fill="#191B1F"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="44" letter-spacing="2.5">HALDEN</text>
  <rect x="104" y="132" width="112" height="1.5" fill="#55697A"/>
  <text x="160" y="157" text-anchor="middle" fill="#9A9EA4"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="11" letter-spacing="6">EST. MMXVI</text>
</svg>
