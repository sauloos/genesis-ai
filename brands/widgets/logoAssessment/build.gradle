// Widget module — its WidgetDescriptor bean, its assess/decide endpoints, its FlowAnswerSource and
// its client module at static/widgets/logoAssessment/. It reaches the logo audit only through
// ClientLogoAssessor, which the adopting app implements, so it never depends on an agent module.
configurations {
    compileOnly { extendsFrom annotationProcessor }
}

dependencies {
    implementation project(':os:widget-sdk')
    compileOnly project(':os:runtime')
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation project(':os:runtime')
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
