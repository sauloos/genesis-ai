# The Purpose Playbook agent runs once per engagement, upstream of every direction and every
# specialist, and its output becomes that client's permanent RAG context. A false premise here is
# not one bad deliverable — it is three directions, five specialist outputs and the client's whole
# Consultant history built on it. So it is configured on the orchestrator's model, not the
# specialists', and given room for a document of real length: the structure module's target is the
# lower half of 48k-88k characters across ~30 sections.
model: claude-opus-5
# 64000, not the 32000 this started on, because 32000 was the binding constraint rather than a
# budget: the first real generation hit the cap mid-object and failed to parse, and only the blind
# retry came back inside it. Opus 5 allows 128000 output tokens, so this is headroom for a document
# at the top of the target band, not licence to pad — length is governed by the structure module.
max-tokens: 64000
rag:
  enabled: true
  top-k: 3
max-iterations: 3
