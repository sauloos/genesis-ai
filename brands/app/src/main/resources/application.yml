spring:
  application:
    name: genesis-ai
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/genesis;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: claude-opus-5
          max-tokens: 8000
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

genesis:
  environment: ${APP_ENV:dev}
  api-key: ${GENESIS_API_KEY:dev-key-change-in-prod}
  allowed-hosts: ${GENESIS_ALLOWED_HOSTS:genesisbrands.ai,www.genesisbrands.ai}
  basic-auth:
    username: ${BASIC_AUTH_USERNAME:genesis}
    password: ${BASIC_AUTH_PASSWORD:change-me-in-prod}
  google-oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  logo:
    default-method: DALLE
  regenerate:
    max-per-slot: 3
  training:
    interpretation:
      enabled: true
      model: claude-haiku-4-5
  consultant:
    system-prompt: agents/consultant/system-prompt.md
    out-of-scope-response: >-
      That's outside my territory. I'm a brand strategy creative director — if you have
      a question about your brand, positioning, identity, or marketing, I'm here for that.
    out-of-scope-keywords:
      - recipe
      - ingredient
      - bake
      - cook
      - preheat
      - tablespoon
      - teaspoon
      - flour
      - butter
      - "trim()"
      - ".trim"
      - "java method"
      - "python "
      - "javascript "
      - "c++ "
      - "sql query"
      - "html tag"
      - "css style"
      - "git commit"
      - "docker "
      - kubernetes
      - "regex "
      - "algorithm "
      - "data structure"
      - "neural network"
      - "machine learning model"
      - "what is rag"
      - "what is llm"
      - "what is gpt"
      - "what is bert"
      - "transformer model"
      - "flight to"
      - "hotel in"
      - "visa for"
      - "medical "
      - "diagnosis "
      - "symptom "
      - "medication "
      - "doctor "

ideogram:
  api-key: ${IDEOGRAM_API_KEY:}

unsplash:
  access-key: ${UNSPLASH_ACCESS_KEY:}

azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT:}
    account-key: ${AZURE_STORAGE_KEY:}
    container: ${AZURE_STORAGE_CONTAINER:knowledge}

qdrant:
  rest:
    url: ${QDRANT_REST_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
