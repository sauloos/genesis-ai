# The derivation that turns one Purpose Playbook into the three direction briefs every specialist
# agent is then briefed from. Config-only, like purpose-playbook-evaluator: there is no CoreAgent
# bean, because this is a step inside the engagement pipeline and not a surface a user picks.
#
# On the orchestrator's model, not the specialists'. This step decides what three brands the client
# will be shown and is read by five agents across three directions, so an error here costs the
# whole engagement rather than one deliverable — the same reasoning as purpose-playbook itself.
model: claude-opus-5-5
# Three briefs, each carrying eleven fields of the purpose-to-direction output contract plus the
# shared invariants: substantial, but a fraction of the playbook it is derived from.
max-tokens: 16000
# Layer 2 precedent informs craft, never content: how comparable engagements separated their three
# directions, not what those directions said. Deliberately narrow for that reason.
rag:
  enabled: true
  top-k: 3
max-iterations: 1
