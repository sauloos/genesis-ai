# The legacy derivation: three direction briefs straight from a questionnaire transcript, for
# engagements whose questionnaire carries no Layer 1 signal keys. Config-only — there is no
# CoreAgent bean, because this is a step inside the engagement pipeline and not a surface anyone
# picks. Its successor is `direction-brief`, which derives from the Purpose Playbook instead.
#
# On the orchestrator's model for the same reason as `direction-brief`: this step decides what
# three brands the client is shown, and five agents across three directions read the result, so an
# error here costs the whole engagement rather than one deliverable.
model: claude-opus-5
# Three briefs with a shared foundation block. Lower than `direction-brief`'s 16000 because the
# legacy output contract is much thinner — four foundation fields and three brands, against the
# eleven-field purpose derivation. This is the value the path has always run at, carried over
# rather than re-picked.
max-tokens: 8000
# No retrieval on this path, and that is deliberate rather than unfinished: an engagement old
# enough to need this derivation predates the Layer 1 signal keys, so there is nothing to tell
# Layer 2 precedent apart from noise for it.
rag:
  enabled: false
max-iterations: 1
